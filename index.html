<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f3efe9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="내 건강">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg?v=2" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<title>내 건강</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 모양 (시안 A · 벤토 위젯, 2026-11-27): 따뜻한 회색 바탕에 크기가 다른 블록을 모아 붙임.
   블록 색은 하나씩: 운동 산호 · 걸음 노랑 · 생리 라벤더 · 인바디 민트 · 헬스 검정. 숫자는 크게, 그림자 없음.
   변화 표시: 좋아짐 = 산호색, 나빠짐 = 회색 (빨강이 주제색이라 '나쁨'으로 쓰지 않음). 항상 ▲▼ 화살표와 함께 */
:root {
  --bg: #f3efe9; --card: #ffffff; --ink: #1e1b18; --muted: #81786e; --line: #ece6dd; --field: #f3efe9;
  --accent: #f4604b; --accent-ink: #ffffff; --soft: #ffe3dc; --track: #ece5dc;
  --butter: #ffe08a; --lilac: #ddd2ff; --mint: #c3e8d5; --dark: #1e1b18; --dark-ink: #ffffff; --hi: #ffe08a;
  --tile-ink: #1e1b18; --tile-sub: rgba(30, 27, 24, .62);
  --good: #d8432f; --bad: #8e857b; --grid: #efe9e1;
  --r: 26px; --r-sm: 18px;
  --c-w: #e5534b; --c-f: #1f8f7a; --c-m: #b87a10; --c-b: #7a6fd6; /* 그래프 4색 (검사 통과) */
  --shadow: none;
  --sans: Pretendard Variable, Pretendard, system-ui, -apple-system, "Apple SD Gothic Neo", "Segoe UI", "Malgun Gothic", sans-serif;
}
/* 다크 모드: 같은 블록 색을 어둡게 가라앉힘. 산호 블록만 밝게 남겨 오늘 운동이 먼저 보이게 */
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121110; --card: #1f1d1b; --ink: #f4efe8; --muted: #a59c92; --line: #2f2c29; --field: #2a2724;
    --accent: #f36a55; --accent-ink: #ffffff; --soft: #3a2420; --track: #2f2c29;
    --butter: #4a3f1c; --lilac: #37314f; --mint: #1f3d31; --dark: #2a2724; --dark-ink: #f4efe8; --hi: #ffd76a;
    --tile-ink: #f4efe8; --tile-sub: rgba(244, 239, 232, .66);
    --good: #ff8a7a; --bad: #a59c92; --grid: #2a2724;
    --c-w: #e85e53; --c-f: #26a487; --c-m: #b9831f; --c-b: #8a7ee6;
  }
}
/* 확대 없음, 스크롤만 */
* { box-sizing: border-box; touch-action: pan-x pan-y; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 var(--sans); -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; }
main { max-width: 540px; margin: 0 auto; padding: calc(18px + env(safe-area-inset-top)) 14px calc(112px + env(safe-area-inset-bottom)); }
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 0 4px 14px; }
.date { margin: 0 0 2px; font-size: 13px; font-weight: 600; color: var(--muted); }
h1 { font-size: 28px; font-weight: 800; line-height: 1.15; letter-spacing: -.03em; margin: 0; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--dark); color: var(--hi); }
.icon-btn svg { width: 22px; height: 22px; }

.card { background: var(--card); border-radius: var(--r); padding: 16px; margin-bottom: 10px; }
.card h2 { font-size: 17px; font-weight: 800; margin: 0 0 10px; }
.sub { color: var(--muted); font-size: 14px; }
.btn { flex: none; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; padding: 0 18px; border-radius: 16px; background: var(--accent); color: var(--accent-ink); font-weight: 800; }
.btn.ghost { background: var(--field); color: var(--ink); }
.btn.small { min-height: 36px; padding: 0 14px; font-size: 14px; border-radius: 99px; }

/* ── 벤토 블록 ── */
.bento { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 10px; }
.bento > .card { margin: 0; }
.span2 { grid-column: span 2; }
.tile { position: relative; overflow: hidden; display: block; width: 100%; text-align: left; border-radius: var(--r); padding: 16px; }
.tk { font-size: 12px; font-weight: 700; opacity: .72; }
.tv { font-size: 30px; font-weight: 800; letter-spacing: -.03em; line-height: 1.15; margin-top: 6px; }
.tv small { font-size: 14px; font-weight: 700; margin-left: 2px; letter-spacing: 0; }
.ts { font-size: 12px; font-weight: 600; opacity: .72; margin-top: 2px; }
.t-coral { background: var(--accent); color: var(--accent-ink); }
.t-butter { background: var(--butter); color: var(--tile-ink); }
.t-lilac { background: var(--lilac); color: var(--tile-ink); }
.t-mint { background: var(--mint); color: var(--tile-ink); }
.t-dark { background: var(--dark); color: var(--dark-ink); }
.t-dark .tk { color: var(--hi); opacity: 1; }
.t-dark .sub, .t-dark .link { color: rgba(255, 255, 255, .62); }
.blob { position: absolute; right: -34px; bottom: -44px; width: 150px; height: 150px; border-radius: 50%; background: rgba(255, 255, 255, .14); pointer-events: none; }
.badge { position: absolute; right: 14px; top: 14px; background: var(--dark); color: var(--hi); font-size: 12px; font-weight: 800; padding: 6px 10px; border-radius: 99px; }
.big { font-size: 68px; font-weight: 800; letter-spacing: -.05em; line-height: .95; margin-top: 12px; }
.big small { font-size: 22px; font-weight: 700; letter-spacing: 0; margin-left: 4px; opacity: .85; }
.bar { height: 12px; border-radius: 6px; background: rgba(255, 255, 255, .28); overflow: hidden; margin-top: 14px; }
.bar i { display: block; height: 100%; border-radius: 6px; background: currentColor; }
.t-dark .bar { background: rgba(255, 255, 255, .14); } .t-dark .bar i { background: var(--hi); }
.go { flex: none; background: var(--hi); color: #1e1b18; font-weight: 800; font-size: 13px; padding: 8px 12px; border-radius: 99px; white-space: nowrap; }
.row2 { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.tchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.tchips span { font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 99px; background: rgba(255, 255, 255, .1); }
.tchips span.ok { background: var(--accent); color: var(--accent-ink); }
.tchips span.w { box-shadow: inset 0 0 0 1.5px var(--accent); }
.spark { display: block; width: 100%; height: 30px; margin-top: 6px; }
.dots { display: flex; gap: 4px; margin-top: 10px; }
.dots i { flex: 1; height: 24px; border-radius: 8px; background: var(--field); }
.dots i.on { background: var(--ink); }
.dots i.today { box-shadow: inset 0 0 0 2px var(--accent); }

/* 아래 탭 막대 */
nav.tabbar { position: fixed; left: 14px; right: 14px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 5; max-width: 512px; margin: 0 auto;
  display: flex; align-items: center; height: 64px; padding: 0 6px; border-radius: 32px; background: #1e1b18; box-shadow: 0 10px 24px -12px rgba(0, 0, 0, .45); }
@media (prefers-color-scheme: dark) { nav.tabbar { background: #2a2724; } }
nav.tabbar button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; font-size: 11px; font-weight: 700; color: #8a8178; }
nav.tabbar svg { width: 22px; height: 22px; }
nav.tabbar button.on { color: #ffffff; }
nav.tabbar button.on svg { color: var(--accent); }

/* ── 달력 ── */
.month-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.month-head h2 { margin: 0; font-size: 20px; font-weight: 800; }
.month-head .arrows { display: flex; gap: 6px; }
.month-head .arrows button { width: 36px; height: 36px; border-radius: 50%; background: var(--field); display: grid; place-items: center; }
.month-head .arrows svg { width: 20px; height: 20px; }
.wk, .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.wk { font-size: 12px; color: var(--muted); text-align: center; margin-bottom: 2px; }
.wk span:nth-child(7) { color: var(--accent); }
.day { position: relative; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 4px 0 3px; border-radius: var(--r-sm); min-height: 66px; }
.day .dn { font-size: 13px; line-height: 1.2; color: var(--muted); }
.day.today .dn { background: var(--dark); color: var(--dark-ink); border-radius: 9px; padding: 0 6px; font-weight: 700; }
.day.sel { background: var(--soft); }
.day.future { opacity: .45; }
.day svg.ring { width: 30px; height: 30px; transform: rotate(-90deg); }
.day .dm { font-size: 11px; line-height: 1.1; color: var(--ink); font-weight: 600; min-height: 12px; }
.day .ib { position: absolute; top: 14px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); opacity: .55; }
.legend-line { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 8px; }
.legend-line i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); opacity: .55; margin-right: 5px; vertical-align: 2px; }
.banner { display: flex; gap: 12px; align-items: center; background: var(--butter); color: var(--tile-ink); border-radius: var(--r); padding: 14px 16px; margin-bottom: 10px; font-size: 14px; }
.banner b { display: block; }
.banner .btn { flex: none; margin-left: auto; }
.tiles { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 8px; }
.tiles .tile { border-radius: var(--r-sm); background: var(--field); padding: 12px; }
.tiles .tile:first-child { background: var(--butter); color: var(--tile-ink); }
.tiles .tile b { display: block; font-weight: 800; font-size: 22px; line-height: 1.2; }
.tiles .tile b small { font-size: 13px; font-weight: 600; opacity: .7; margin-left: 2px; }
.tiles .tile span { font-size: 12px; opacity: .72; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { font-size: 14px; font-weight: 600; padding: 7px 12px; border-radius: 99px; background: var(--field); color: var(--ink); }
.chip.pick.on { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
/* 그날 운동 목록 */
.wo-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 36px; }
.wo-head h3 { margin: 0; font-size: 16px; font-weight: 800; }
.wo { list-style: none; margin: 6px 0 0; padding: 0; }
.wo li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.wo li:first-child { border-top: 0; }
.wo-dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.wo-name { flex: 1; min-width: 0; }
.wo-note { display: block; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.wo-empty { margin: 4px 0 0; font-size: 14px; }
.wo-sep { height: 1px; background: var(--line); margin: 14px 0 10px; }
.wo .x { flex: none; width: 28px; height: 28px; border-radius: 50%; color: var(--muted); display: grid; place-items: center; }
.wo .x svg { width: 16px; height: 16px; }
.mine-form { margin-top: 8px; padding-top: 6px; }
/* 오늘 요약 (첫 화면 맨 위) */
.hero-top { display: flex; align-items: center; gap: 18px; }
.big-ring { position: relative; flex: none; width: 128px; height: 128px; }
.big-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.big-ring .in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.big-ring .in b { font-size: 36px; font-weight: 800; line-height: 1; letter-spacing: -.02em; }
.big-ring .in span { font-size: 13px; opacity: .7; margin-top: 2px; }
.hero-facts { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-width: 0; }
.hero-facts b { font-size: 26px; font-weight: 800; line-height: 1.1; }
.hero-facts b + span { font-size: 13px; color: var(--muted); margin-left: 4px; }
.watch-line { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; font-size: 12px; font-weight: 600; opacity: .9; }
.watch-line a { flex: none; text-decoration: none; color: inherit; font-weight: 800; font-size: 12px; padding: 6px 10px; border-radius: 99px; background: rgba(255, 255, 255, .22); }
.t-coral .link { color: inherit; opacity: .85; padding: 0; }
.pill { font-size: 13px; font-weight: 800; padding: 5px 11px; border-radius: 99px; background: var(--card); color: var(--ink); }
.pill.done { background: var(--accent); color: var(--accent-ink); }
.edit-link { text-align: right; margin-top: 4px; }
.link { font-size: 13px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; padding: 6px 0; }
.day .my { position: absolute; top: 5px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.legend-line i.lg-my { background: var(--accent); opacity: 1; }
.detail-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; }
.edit-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }

/* 입력칸 */
.fld { display: flex; flex-direction: column; gap: 3px; min-width: 0; font-size: 13px; color: var(--muted); }
.fld input { width: 100%; min-width: 0; height: 46px; padding: 0 12px; border-radius: 14px; border: 1.5px solid transparent; background: var(--field); font-size: 17px; color: var(--ink); }
.fld input[type=date] { display: block; max-width: 100%; -webkit-appearance: none; appearance: none; line-height: 42px; }
.fld input[type=date]::-webkit-date-and-time-value { text-align: left; }
.fld input:focus { outline: 0; border-color: var(--accent); }

/* ── 인바디 ── */
.metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 10px; }
/* 인바디 한마디 */
.fb ul { list-style: none; margin: 0; padding: 0; }
.fb li { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; font-size: 15px; line-height: 1.45; }
.fb .fb-ic { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 800; margin-top: 1px; }
.fb { background: var(--butter); color: var(--tile-ink); }
.fb .fb-ic { background: var(--dark); color: var(--hi); }
/* 그래프 수치 고르기 */
.ck-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
.ck { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; padding: 7px 12px; border-radius: 99px; background: var(--field); color: var(--muted); }
.ck i { width: 10px; height: 10px; border-radius: 50%; opacity: .45; }
.ck.on { background: var(--dark); color: var(--dark-ink); font-weight: 800; }
.ck.on i { opacity: 1; }
.rg-row { display: flex; gap: 2px; background: var(--field); border-radius: 99px; padding: 3px; margin: 0 0 10px; }
.rg { flex: 1; font-size: 13px; font-weight: 600; padding: 6px 0; border-radius: 99px; color: var(--muted); }
.rg.on { background: var(--card); color: var(--ink); font-weight: 800; }
.chart-wrap .band-lab { fill: var(--muted); font-size: 11px; }
.chart-wrap .band-lab.on { fill: var(--ink); font-weight: 700; }
.chart-wrap .vlab.last { font-size: 13px; font-weight: 800; }
.tip-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
.more { width: 100%; margin-top: 8px; }
.metric .bmi-cls { font-weight: 800; }
.metric { text-align: left; border-radius: var(--r); padding: 14px 14px 12px; background: var(--card); color: var(--ink); }
.metric.m-w { background: var(--accent); color: var(--accent-ink); }
.metric.m-f { background: var(--mint); color: var(--tile-ink); }
.metric.m-m { background: var(--butter); color: var(--tile-ink); }
.metric.m-b { background: var(--lilac); color: var(--tile-ink); }
.metric.on { box-shadow: inset 0 0 0 3px var(--ink); }
.metric.m-w.on { box-shadow: inset 0 0 0 3px var(--dark); }
.metric .lab { font-size: 12px; font-weight: 700; opacity: .75; }
.metric .val { font-size: 30px; font-weight: 800; line-height: 1.15; letter-spacing: -.03em; margin-top: 2px; }
.metric .val small { font-size: 13px; font-weight: 700; opacity: .75; margin-left: 2px; }
.metric .delta, .metric .delta.good, .metric .delta.bad, .metric .delta.same { color: inherit; background: rgba(0, 0, 0, .08); padding: 1px 7px; border-radius: 99px; font-size: 12px; font-weight: 800; }
.metric.m-w .delta { background: rgba(255, 255, 255, .22); }
.delta { font-size: 13px; font-weight: 600; white-space: nowrap; }
.delta.good { color: var(--good); } .delta.bad { color: var(--bad); } .delta.same { color: var(--muted); }
.metric .since { font-size: 11px; font-weight: 600; opacity: .72; margin-top: 4px; }
.chart-wrap { position: relative; }
.chart-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart-wrap .axis { fill: var(--muted); font-size: 11px; }
.chart-wrap .vlab { fill: var(--ink); font-size: 12px; font-weight: 600; }
.tip { position: absolute; pointer-events: none; transform: translate(-50%, calc(-100% - 12px)); background: var(--ink); color: var(--bg); font-size: 13px; line-height: 1.35; padding: 6px 10px; border-radius: 10px; white-space: nowrap; }
.tip .delta { color: inherit; }
.chart-sum { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 8px; font-size: 14px; color: var(--muted); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
.hist { list-style: none; margin: 0; padding: 0; }
.hist li { display: grid; grid-template-columns: 74px repeat(3, minmax(0, 1fr)) 28px; align-items: center; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; }
.hist li:first-child { border-top: 0; }
.hist .hd { font-size: 13px; color: var(--muted); }
.hist .hv b { font-weight: 600; }
.hist .hv .delta { display: block; font-size: 11px; }
.hist .head { font-size: 12px; color: var(--muted); padding-top: 0; }
.hist .x { width: 28px; height: 28px; border-radius: 50%; color: var(--muted); display: grid; place-items: center; }
.hist .x svg { width: 16px; height: 16px; }
.empty { text-align: center; color: var(--muted); padding: 18px 0 6px; font-size: 15px; }

/* ── 설정 창 ── */
dialog { width: min(540px, 100%); max-width: 100%; max-height: 92vh; margin: auto auto 0; padding: 0; border: 0; border-radius: 22px 22px 0 0; background: var(--bg); color: var(--ink); }
dialog::backdrop { background: rgba(0, 0, 0, .35); }
.sheet { padding: 18px 16px calc(24px + env(safe-area-inset-bottom)); overflow-y: auto; max-height: 92vh; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.sheet-head h2 { margin: 0; font-size: 22px; }
.url-box { font: 13px/1.4 ui-monospace, Menlo, monospace; word-break: break-all; background: var(--field); border-radius: 10px; padding: 10px; margin: 8px 0; user-select: all; -webkit-user-select: all; }
ol.steps { margin: 0; padding-left: 22px; font-size: 15px; }
ol.steps li { margin-bottom: 8px; }
ol.steps b { font-weight: 600; }
.field-tbl { width: 100%; border-collapse: collapse; font-size: 14px; margin: 6px 0; }
.field-tbl td { padding: 4px 6px; border-top: 1px solid var(--line); }
.field-tbl code { font: 13px ui-monospace, Menlo, monospace; background: var(--field); padding: 1px 5px; border-radius: 5px; }
.inline { display: flex; gap: 8px; align-items: flex-end; }
.inline .fld { flex: 1; }
/* ── 헬스 ── */
.pweek { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.pd { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 1px 7px; border-radius: 14px; background: var(--field); min-height: 76px; }

/* 운동 그림: 산호색 운동복 + 짙은 레깅스 + 흰 운동화, 머리는 묶은 머리. 기구는 회색 틀 + 짙은 쿠션 */

  --skin: #f1c3a6; --hair: #4b2f25; --leg: #3a3343; --iron: #2c2a30; --frame: #b9afa4; --pad: #4a4350; --shoe: #ffffff; }

#rest { position: fixed; left: 14px; right: 14px; bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 6; max-width: 512px; margin: 0 auto; height: 56px;
  display: flex; align-items: center; gap: 10px; background: #ffe08a; color: #1e1b18; border-radius: 28px; padding: 0 8px 0 18px; font-weight: 800; box-shadow: 0 10px 20px -10px rgba(0, 0, 0, .4); }
body.flash::after { content: ''; position: fixed; inset: 0; z-index: 50; pointer-events: none; background: var(--accent); opacity: 0; animation: flash 1.2s ease-out 2; }

@media (prefers-reduced-motion: reduce) { body.flash::after { animation-duration: 2s; animation-iteration-count: 1; } }
#rest b { font-size: 22px; font-weight: 800; min-width: 52px; }

</style>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// 내 건강
//  · 오늘: 요약 + 달력. 아이폰 '단축어'가 오늘 운동 시간·걸음 수를 동기화 서버(worker/)로 보내면
//    앱이 열릴 때와 1분마다 받아 옴. 운동 이름·시간·칼로리는 직접 추가.
//  · 인바디: 몸무게(kg)·근육량(%)·체지방(%)·BMI 기록과 변화 그래프, 칭찬 한마디.
//  · 헬스: 주간 계획, 세트 기록, 루틴, 휴식 타이머, 운동 그림.
//  · 생리: 달력에 생리한 날 체크, 다음 예정일·가임기 예상(1년 뒤까지), 주기 통계.
// 모든 기록은 서버의 data:{연결 키} 하나에 들어 있고, 이 휴대폰에도 복사본을 둠(오프라인용).
// ─────────────────────────────────────────────────────────────────────────────
const API = 'https://my-health-sync.weekly-meals-reader.workers.dev';
const LS = 'my-health';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const WD = ['월', '화', '수', '목', '금', '토', '일'];
const WD_SUN = ['일', '월', '화', '수', '목', '금', '토'];

// ── 저장 상태 ──
const S = (() => { try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch { return {}; } })();
if (!S.key) S.key = newKey();
const blank = d => Object.assign({ days: {}, inbody: [], gym: {}, mine: {}, cycle: {} }, d);
S.data = blank(S.data);
delete S.synced; // 예전 버전이 남긴 값
S.goal = S.goal || 30;
S.tab = S.tab || 'cal';
S.chartKeys = S.chartKeys || ['w'];
// 적다 만 입력칸 (다른 앱에 다녀오거나 앱이 다시 켜져도 그대로 남게)
S.drafts = S.drafts || {};
const draft = (k, def = '') => esc(S.drafts[k] ?? def);
const clearDrafts = prefix => { for (const k of Object.keys(S.drafts)) if (k.startsWith(prefix)) delete S.drafts[k]; };
const save = () => { try { localStorage.setItem(LS, JSON.stringify(S)); } catch {} };
save();

function newKey() {
  const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
  return Array.from(crypto.getRandomValues(new Uint8Array(32)), b => abc[b % abc.length]).join('');
}
const pushUrl = () => `${API}/h/${S.key}`;
const KEY_OK = k => /^[A-Za-z0-9]{24,64}$/.test(k || '');

// ── 날짜 ──
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const todayStr = () => ymd(new Date());
const longDate = s => { const d = parseYmd(s); return `${d.getMonth() + 1}월 ${d.getDate()}일 (${WD_SUN[d.getDay()]})`; };
const shortDate = s => { const d = parseYmd(s); return `${String(d.getFullYear()).slice(2)}.${d.getMonth() + 1}.${d.getDate()}`; };
const fmtInt = n => Number(n).toLocaleString('ko-KR');

let view = (() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); })();
let sel = todayStr();
const stopEditing = () => { clearDrafts('day-'); save(); };
// 앱을 켜 둔 채 자정이 지나면 '오늘'·이번 달·이번 주로 돌아감
let shownDay = todayStr();
function checkNewDay() {
  const t = todayStr();
  if (t === shownDay) return;
  if (sel === shownDay) sel = t;
  view = new Date(parseYmd(t).getFullYear(), parseYmd(t).getMonth(), 1);
  gymWeek = mondayOf(parseYmd(t)); planDay = null;
  cycView = new Date(parseYmd(t).getFullYear(), parseYmd(t).getMonth(), 1);
  shownDay = t;
}

// ── 서버와 주고받기 ──
// 응답이 너무 오래 안 오면 포기 (약한 인터넷에서 저장 줄이 멈추지 않게). 예전 iOS 는 그냥 기다림
const tmo = ms => (AbortSignal.timeout ? AbortSignal.timeout(ms) : undefined);
let syncing = false, lastSync = '', writes = 0; // writes: 서버에 저장이 끝난 횟수
const typing = () => !!(document.activeElement && document.activeElement.matches('input'));
async function sync() {
  if (syncing) return;
  syncing = true;
  try {
    // 아직 못 보낸 기록이 있으면 먼저 보냄 (안 그러면 서버 값이 덮어씀)
    if (S.pending) await post({});
    await chain.catch(() => {});
    if (S.pending) return;
    const w = writes, key = S.key;
    const r = await fetch(`${API}/d/${S.key}`, { cache: 'no-store', signal: tmo(15000) });
    if (!r.ok) throw new Error(r.status);
    const text = await r.text();
    // 받는 사이에 새로 적었거나 저장이 끝났으면(그쪽이 더 새 값) 이번 것은 버림
    if (S.pending || writes !== w || key !== S.key) return;
    // 바뀐 게 없으면 다시 그리지 않음 (1분마다 화면이 깜빡이거나 그림이 튀지 않게)
    if (text === lastSync) return;
    lastSync = text;
    const before = JSON.stringify(S.data);
    S.data = blank(JSON.parse(text));
    if (JSON.stringify(S.data) === before) return;
    save();
    // 입력 중이면 화면을 다시 그리지 않음 (키보드가 닫히지 않게)
    if (!typing()) render();
  } catch { /* 오프라인: 휴대폰에 있는 복사본으로 계속 */ }
  finally { syncing = false; }
}
// 저장은 한 줄로 차례차례 (빠르게 여러 번 눌러도 늦게 온 답이 새 기록을 덮지 않게)
let chain = Promise.resolve();
// 날짜별 기록은 { 날짜: 값 } 으로 모아 둠: 오프라인이거나 빨리 여러 날을 고쳐도 앞의 날이 덮이지 않게
const DAY_MAPS = ['cycleDays', 'mineDays', 'gymSessions', 'dayEdits', 'planWeeks'];
// 인바디는 추가(ibAdd)·삭제(ibDel)만 차례대로 쌓아 보냄 → 서버가 그대로 적용 (다른 기기 기록을 지우지 않음)
const LISTS = ['ibAdd', 'ibDel'];
function queue(body) {
  const prev = S.pending || {}, next = { ...prev, ...body };
  for (const k of DAY_MAPS) if (body[k]) next[k] = { ...(prev[k] || {}), ...body[k] };
  for (const k of LISTS) if (body[k]) next[k] = [...(prev[k] || []), ...body[k]];
  S.pending = next;
  save();
}
function post(body) {
  queue(body);
  return (chain = chain.catch(() => {}).then(flush));
}
async function flush() {
  const send = S.pending;
  if (!send) return;
  if (!Object.keys(send).length) { S.pending = null; save(); return; }
  const r = await fetch(`${API}/d/${S.key}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(send), signal: tmo(15000) });
  // 서버가 받지 않는 내용(너무 큼 등)은 계속 다시 보내지 않음. 안 그러면 새 기록을 영영 못 받아 옴
  if (r.status >= 400 && r.status < 500 && r.status !== 429) {
    if (S.pending === send) S.pending = null;
    lastSync = ''; save(); toast('저장하지 못했어요');
    throw Object.assign(new Error(r.status), { shown: true });
  }
  if (!r.ok) throw new Error(r.status);
  const text = await r.text();
  // 보내는 동안 또 바뀐 게 없을 때만 서버 값을 받아들임 (있으면 다음 차례에 그것까지 보냄)
  writes++;
  if (S.pending === send) { S.pending = null; S.data = blank(JSON.parse(text)); lastSync = text; }
  save();
}
const failed = e => { if (!e || !e.shown) toast('인터넷 연결되면 저장돼요'); };
const saveSoon = body => post(body).then(render).catch(failed);

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 2200);
}

// ── 그리기 ──
function render() {
  checkNewDay();
  $('#today').textContent = `${new Date().getFullYear()}년 ${longDate(todayStr())}`;
  for (const b of document.querySelectorAll('nav.tabbar button')) b.classList.toggle('on', b.dataset.tab === S.tab);
  $('#v-cal').hidden = S.tab !== 'cal'; $('#v-ib').hidden = S.tab !== 'ib'; $('#v-gym').hidden = S.tab !== 'gym'; $('#v-cyc').hidden = S.tab !== 'cyc';

const ARROW_L = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>';
const ARROW_R = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>';
const X_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';

// 운동 링: 하루 목표(분)를 채운 만큼 초록 원이 참
function ring(min) {
  const r = 12, c = 2 * Math.PI * r, p = Math.min((min || 0) / S.goal, 1);
  return `<svg class="ring" viewBox="0 0 30 30" aria-hidden="true">
    <circle cx="15" cy="15" r="${r}" fill="none" stroke="var(--track)" stroke-width="4"/>
    ${p > 0 ? `<circle cx="15" cy="15" r="${r}" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-dasharray="${(c * p).toFixed(2)} ${c.toFixed(2)}"/>` : ''}
  </svg>`;
}

// 그날 운동한 시간: 워치 기록과 내가 추가한 운동 중 큰 쪽 (워치를 차고 한 운동을 또 적어도 두 번 세지 않게)
const mineOf = ds => (S.data.mine && S.data.mine[ds]) || [];
const dayMin = ds => Math.max((S.data.days[ds] || {}).min || 0, mineOf(ds).reduce((a, x) => a + (x.min || 0), 0));

// 첫 화면: 위에는 오늘 요약(크게), 아래에 달력. 달력에서 다른 날을 누르면 달력 밑에 그날 자세히.
function renderCal() {
  const today = todayStr();
  const neverSynced = !Object.values(S.data.days).some(watchAt), unfinished = unfinishedGym();
  $('#v-cal').innerHTML = `
    ${neverSynced ? `<div class="banner"><div><b>Apple Watch 연결하기</b>운동이 끝나면 여기로 바로 올라오게 설정해요.</div><button class="btn small" data-act="setup">설정 방법</button></div>` : ''}
    ${unfinished.length ? `<div class="banner"><div><b>${shortDate(unfinished[0])} 헬스를 아직 안 끝냈어요</b>끝내야 계획 체크와 오늘 한 운동에 들어가요.</div><button class="btn small" data-tab="gym">정리하기</button></div>` : ''}
    ${!S.keySaved && !neverSynced ? `<div class="banner"><div><b>기록 지키기</b>연결 키를 저장해 두면 휴대폰을 바꿔도 기록을 되찾아요.</div><button class="btn small" data-act="setup">저장하기</button></div>` : ''}
    ${todayHero(today)}
    ${calendarCard(today)}
    ${sel !== today ? dayDetail(sel) : ''}`;
}

// 워치 기록이 언제 왔는지 + 단축어를 바로 실행하는 버튼.
// 아이폰이 잠겨 있으면 단축어가 건강 데이터를 못 읽어서 밤 10시 자동화가 조용히 실패할 수 있음 → 앱을 연 김에 직접 보내기.
// 단축어가 끝나고 이 앱으로 돌아오면 visibilitychange → sync 로 바로 보임.
const SHORTCUT = '건강 기록 보내기';
// 그날 워치 기록을 받은 시각 (wat: 숫자를 직접 고쳐도 남음. 예전 기록은 at)
const watchAt = r => r.wat || (r.at && !r.manual ? r.at : 0);
function watchLine(rec) {
  if (!Object.values(S.data.days).some(watchAt)) return ''; // 아직 연결 전이면 위 배너가 안내함
  const got = watchAt(rec) ? new Date(watchAt(rec)) : null;
  const txt = got ? `${got.getHours() < 12 ? '오전' : '오후'} ${got.getHours() % 12 || 12}:${String(got.getMinutes()).padStart(2, '0')}에 받은 워치 기록` : '오늘 워치 기록이 아직 안 왔어요';
  return `<div class="watch-line"><span>${txt}</span><a href="shortcuts://run-shortcut?name=${encodeURIComponent(SHORTCUT)}">지금 가져오기</a></div>`;
}

// 오늘 화면 블록: 운동(산호·크게) · 걸음(노랑) · 생리(라벤더) · 헬스(검정) · 한 운동(흰색) · 인바디(민트) · 이번 주(흰색)
function todayHero(ds) {
  const rec = S.data.days[ds] || {}, min = dayMin(ds), editing = S.drafts['day-edit'] === ds;
  const badge = min >= S.goal ? '목표 달성 ✓' : min > 0 ? `${S.goal - min}분 남음` : '아직 운동 전';
  const y = S.data.days[addDays(ds, -1)] || {};
  const stepSub = rec.steps == null ? '아직 안 왔어요' : y.steps != null ? `어제보다 ${rec.steps >= y.steps ? '+' : '−'}${fmtInt(Math.abs(rec.steps - y.steps))}` : '오늘 걸음';
  const kcal = mineOf(ds).reduce((a, x) => a + (x.kcal || 0), 0);
  return `<div class="bento">
    <div class="card tile t-coral span2"><span class="blob"></span>
      <div class="tk">오늘 운동</div><span class="badge">${badge}</span>
      <div class="big num">${min}<small>/ ${S.goal}분</small></div>
      <div class="bar"><i style="width:${Math.min(100, min / S.goal * 100).toFixed(0)}%"></i></div>
      ${watchLine(rec)}
      ${editing ? '' : `<button class="link" style="margin-top:6px" data-act="edit" data-date="${ds}">숫자 직접 고치기</button>`}
    </div>
    ${editing ? `<div class="card span2">${editForm(ds)}</div>` : ''}
    <div class="card tile t-butter"><div class="tk">걸음</div><div class="tv num">${rec.steps != null ? fmtInt(rec.steps) : '–'}</div><div class="ts">${stepSub}</div></div>
    ${cycTile()}
    ${gymTile(ds)}
    <div class="card span2">${workoutsBlock(ds, kcal ? `오늘 한 운동 <span class="sub num" style="font-weight:600">· ${fmtInt(kcal)}kcal</span>` : '오늘 한 운동')}</div>
    ${ibTile()}
    ${weekTile(ds)}
  </div>`;
}
function cycTile() {
  const I = cycleInfo(), today = todayStr();
  let v = '–', sub = '기록 시작하기';
  if (I.L && I.ongoing) { v = `${I.day}<small>일째</small>`; sub = '생리 중'; }
  else if (I.L && I.late) { v = `+${I.late}<small>일</small>`; sub = '예정일 지남'; }
  else if (I.L && I.next === today) { v = '오늘'; sub = '생리 예정일'; }
  else if (I.L) { v = `D-${diffDays(today, I.next)}`; sub = `다음 생리 ${md(I.next)}`; }
  return `<button class="card tile t-lilac" data-tab="cyc"><div class="tk">생리</div><div class="tv num">${v}</div><div class="ts">${sub}</div></button>`;
}
// 헬스 블록: 운동 중 → 이어서, 플랜 → 시작, 끝 → 결과, 없으면 이번 주 계획 + 추천
function gymTile(ds) {
  const g = G().sessions[ds], plan = planOf(ds);
  const sets = g ? g.items.reduce((a, i) => a + i.sets.length, 0) : 0, done = g ? g.items.reduce((a, i) => a + i.sets.filter(x => x.done).length, 0) : 0;
  const names = g ? `<div class="tchips">${g.items.map(i => `<span class="${i.sets.length && i.sets.every(x => x.done) ? 'ok' : CAUTION[i.ex] ? 'w' : ''}">${esc(i.ex)}</span>`).join('')}</div>` : '';
  let k, v, go;
  if (g && g.start && !g.end) { k = `오늘 헬스 · ${Math.max(1, Math.round((Date.now() - g.start) / 60000))}분째`; v = `세트 ${done} / ${sets}`; go = '이어서 →'; }
  else if (g && g.end) { k = '오늘 헬스 끝'; v = `${g.min || '–'}분 · 운동 ${g.items.length}개`; go = '보기 →'; }
  else if (g && g.items.length) { k = '오늘의 헬스 플랜'; v = `운동 ${g.items.length}개`; go = '시작 →'; }
  else {
    return `<button class="card tile t-dark span2" data-tab="gym"><div class="row2"><div><div class="tk">오늘 헬스</div><div class="tv" style="font-size:20px">${plan.length ? '오늘 계획이 있어요' : '플랜이 아직 없어요'}</div></div><span class="go">추천 받기 →</span></div>
      ${plan.length ? `<div class="tchips">${plan.map(n => `<span class="${didOn(ds, n) ? 'ok' : ''}">${didOn(ds, n) ? '✓ ' : ''}${esc(n)}</span>`).join('')}</div>` : ''}</button>`;
  }
  return `<button class="card tile t-dark span2" data-tab="gym"><div class="row2"><div><div class="tk">${k}</div><div class="tv" style="font-size:20px">${v}</div></div><span class="go">${go}</span></div>
    ${g.start && !g.end ? `<div class="bar"><i style="width:${sets ? (done / sets * 100).toFixed(0) : 0}%"></i></div>` : ''}${names}</button>`;
}
// 인바디 블록: 체지방률(없으면 몸무게) + 최근 6번 흐름
function ibTile() {
  const k = series('f').length ? 'f' : 'w', s = series(k).slice(-6), last = ibSorted().at(-1);
  if (!last) return `<button class="card tile t-mint" data-tab="ib"><div class="tk">인바디</div><div class="tv">–</div><div class="ts">첫 결과 적기</div></button>`;
  const v = s.map(e => e[k]), lo = Math.min(...v), hi = Math.max(...v), X = i => 4 + i * 112 / Math.max(1, v.length - 1), Y = x => hi === lo ? 15 : 26 - (x - lo) / (hi - lo) * 22;
  const pts = v.map((x, i) => `${X(i).toFixed(1)},${Y(x).toFixed(1)}`).join(' ');
  return `<button class="card tile t-mint" data-tab="ib"><div class="tk">${k === 'f' ? '체지방률' : '몸무게'}</div><div class="tv num">${s.length ? f1(v.at(-1)) : '–'}<small>${METRICS[k].unit}</small></div>
    ${v.length > 1 ? `<svg class="spark" viewBox="0 0 120 30" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${X(v.length - 1)}" cy="${Y(v.at(-1))}" r="4" fill="currentColor"/></svg>` : ''}
    <div class="ts">${shortDate(last.date)}${last.w != null && k !== 'w' ? ` · ${f1(last.w)}kg` : ''}</div></button>`;
}
// 이번 주(월~일) 운동한 날
function weekTile(ds) {
  const mon = ymd(mondayOf(parseYmd(ds))), days = Array.from({ length: 7 }, (_, i) => addDays(mon, i));
  const on = d => d <= ds && (dayMin(d) > 0 || mineOf(d).length > 0);
  return `<div class="card tile"><div class="tk">이번 주</div><div class="tv num">${days.filter(on).length}<small>일</small></div>
    <div class="dots">${days.map(d => `<i class="${on(d) ? 'on' : ''} ${d === ds ? 'today' : ''}"></i>`).join('')}</div></div>`;
}

function calendarCard(today) {
  const D = S.data.days, y = view.getFullYear(), m = view.getMonth();
  const first = new Date(y, m, 1), off = (first.getDay() + 6) % 7, n = new Date(y, m + 1, 0).getDate();
  const ibDates = new Set(S.data.inbody.map(e => e.date));
  let cells = '', active = 0;
  for (let i = 0; i < off; i++) cells += '<span></span>';
  for (let d = 1; d <= n; d++) {
    const ds = ymd(new Date(y, m, d)), min = dayMin(ds), mine = mineOf(ds).length;
    if (min > 0 || mine) active++;
    const cls = ['day', ds === today && 'today', ds === sel && ds !== today && 'sel', ds > today && 'future'].filter(Boolean).join(' ');
    cells += `<button class="${cls}" data-day="${ds}" aria-label="${longDate(ds)}${min ? `, 운동 ${min}분` : ''}${mine ? `, 운동 기록 ${mine}개` : ''}">
      <span class="dn num">${d}</span>${ds > today ? '<svg class="ring"></svg>' : ring(min)}
      <span class="dm num">${min ? min + '분' : ''}</span>${mine ? '<i class="my"></i>' : ''}${ibDates.has(ds) ? '<i class="ib"></i>' : ''}</button>`;
  }
  return `<div class="card">
    <div class="month-head">
      <div><h2>${y}년 ${m + 1}월</h2><span class="sub" style="font-size:13px">${active}일 운동</span></div>
      <div class="arrows"><button data-act="prev" aria-label="지난달">${ARROW_L}</button><button data-act="next" aria-label="다음 달">${ARROW_R}</button></div>
    </div>
    <div class="wk">${WD.map(w => `<span>${w}</span>`).join('')}</div>
    <div class="grid" id="grid">${cells}</div>
    <div class="legend-line"><span>링 = 하루 목표 ${S.goal}분 중 채운 만큼</span><span><i class="lg-my"></i>운동 기록</span><span><i></i>인바디 잰 날</span></div>
  </div>`;
}

const QUICK = ['필라테스', '러닝', '헬스', '자전거', '홈트레이닝'];

// 그날 운동 목록 (직접 추가한 운동 + 끝낸 헬스)
function workoutsBlock(ds, title) {
  const mine = mineOf(ds), future = ds > todayStr(), open = S.drafts['mine-open'] === ds;
  const recent = open ? [...new Set(Object.values(S.data.mine || {}).flat().map(x => x.name))].filter(n => !QUICK.includes(n)).slice(-6) : [];
  const items = mine.map(x => `<li><span class="wo-dot"></span><span class="wo-name">${esc(x.name)}${x.min || x.kcal ? ` <span class="sub num">${x.min ? `· ${x.min}분 ` : ''}${x.kcal ? `· ${fmtInt(x.kcal)}kcal` : ''}</span>` : ''}${x.note ? `<span class="wo-note">${esc(x.note)}</span>` : ''}</span>
      <button class="x" data-del-mine="${esc(x.id)}" data-date="${ds}" aria-label="${esc(x.name)} 지우기">${X_ICON}</button></li>`);
  return `<div class="wo-head"><h3>${title}</h3>${!future && !open ? `<button class="btn small" data-act="mine-open" data-date="${ds}">＋ 운동 추가</button>` : ''}</div>
    ${items.length ? `<ul class="wo">${items.join('')}</ul>` : ''}
    ${open ? `<div class="mine-form">
      <div class="chips">${[...QUICK, ...recent].map(n => `<button class="chip pick ${S.drafts['mine-name'] === n ? 'on' : ''}" data-pick="${esc(n)}">${esc(n)}</button>`).join('')}</div>
      <div class="form-grid" style="margin-top:10px">
        <label class="fld" style="grid-column:1/-1">운동 이름<input id="m-name" data-draft="mine-name" value="${draft('mine-name')}" placeholder="위에서 고르거나 직접 적기"></label>
        <label class="fld">시간 (분)<input id="m-min" data-draft="mine-min" value="${draft('mine-min')}" inputmode="numeric" placeholder="예: 45"></label>
        <label class="fld">칼로리 (kcal)<input id="m-kcal" data-draft="mine-kcal" value="${draft('mine-kcal')}" inputmode="numeric" placeholder="예: 320"></label>
      </div>
      <label class="fld">메모 (선택)<input id="m-note" data-draft="mine-note" value="${draft('mine-note')}" placeholder="예: 스쿼트 40kg 5세트"></label>
      <div class="detail-foot"><span></span><span style="display:flex;gap:8px"><button class="btn small ghost" data-act="mine-cancel">취소</button><button class="btn small" data-act="mine-save" data-date="${ds}">추가</button></span></div>
    </div>` : ''}`;
}

// 워치 숫자 직접 고치기 (그날 하나만 열림)
function editForm(ds) {
  const rec = S.data.days[ds];
  if (S.drafts['day-edit'] === ds) return `
    <div class="edit-row">
      <label class="fld">워치 운동(분)<input id="e-min" data-draft="day-min" inputmode="numeric" value="${draft('day-min', rec?.min ?? '')}"></label>
      <label class="fld">걸음<input id="e-steps" data-draft="day-steps" inputmode="numeric" value="${draft('day-steps', rec?.steps ?? '')}"></label>
    </div>
    <div class="detail-foot"><button class="btn small ghost" data-act="del-day" data-date="${ds}">지우기</button>
      <span style="display:flex;gap:8px"><button class="btn small ghost" data-act="cancel">취소</button><button class="btn small" data-act="save-day" data-date="${ds}">저장</button></span></div>`;
  return ds > todayStr() ? '' : `<div class="edit-link"><button class="link" data-act="edit" data-date="${ds}">숫자 직접 고치기</button></div>`;
}

// 달력에서 고른 다른 날
function dayDetail(ds) {
  const rec = S.data.days[ds], ib = S.data.inbody.find(e => e.date === ds), mine = mineOf(ds);
  const has = rec && (rec.min != null || rec.steps != null);
  const t = (v, unit, lab) => `<div class="tile"><b class="num">${v == null ? '–' : fmtInt(v)}<small>${unit}</small></b><span>${lab}</span></div>`;
  let body = has
    ? `<div class="tiles">${t(rec.min, '분', mine.length ? '워치 운동 시간' : '운동 시간')}${t(rec.steps, '', '걸음')}</div>`
    : `<p class="sub" style="margin:0">${ds > todayStr() ? '아직 오지 않은 날이에요.' : '이날은 워치 기록이 없어요.'}</p>`;
  if (ib) body += `<p class="sub" style="margin:10px 0 0">인바디 · ${[ib.w != null && f1(ib.w) + 'kg', ib.m != null && '근육 ' + f1(ib.m) + '%', ib.f != null && '체지방 ' + f1(ib.f) + '%'].filter(Boolean).join(' · ')}</p>`;
  return `<div class="card" id="day-detail"><h2>${longDate(ds)}</h2>${body}${editForm(ds)}<div class="wo-sep"></div>${workoutsBlock(ds, '운동')}</div>`;
}

// ── 인바디 ──
const METRICS = {
  w: { lab: '몸무게', unit: 'kg', better: -1 },   // 줄면 좋음
  m: { lab: '근육량', unit: '%', better: 1 },     // 늘면 좋음
  f: { lab: '체지방', unit: '%', better: -1 },    // 줄면 좋음
  b: { lab: 'BMI', unit: '', better: 0 },          // 몸무게와 키로 자동 계산. 좋고 나쁨은 범위로 판단하므로 변화는 회색으로
};
// BMI 범위 (대한비만학회 기준)
const bmiClass = b => b < 18.5 ? '저체중' : b < 23 ? '정상' : b < 25 ? '비만 전단계' : b < 30 ? '비만 1단계' : b < 35 ? '비만 2단계' : '비만 3단계';
const heightCm = () => (S.data.profile && S.data.profile.height) || null;
const bmiOf = w => heightCm() ? r1(w / (heightCm() / 100) ** 2) : null;
const r1 = v => Math.round(v * 10) / 10;
const f1 = v => Number(v).toFixed(1); // 29 → 29.0
function deltaHtml(d, key, suffix = '') {
  if (d == null) return '';
  d = r1(d);
  if (d === 0) return `<span class="delta same">± 0${suffix}</span>`;
  const cls = !METRICS[key].better ? 'same' : d * METRICS[key].better > 0 ? 'good' : 'bad';
  return `<span class="delta ${cls}">${d > 0 ? '▲ +' : '▼ −'}${Math.abs(d).toFixed(1)}${suffix}</span>`;
}
const ibSorted = () => [...S.data.inbody].sort((a, b) => a.date.localeCompare(b.date) || (a.id || '').localeCompare(b.id || ''));
const series = k => k === 'b'
  ? (heightCm() ? ibSorted().filter(e => e.w != null).map(e => ({ ...e, b: bmiOf(e.w) })) : [])
  : ibSorted().filter(e => e[k] != null);

// ── 인바디 한마디 (AI 없이 규칙으로) ──
// 지난번과 비교한 변화, 연속 기록, 처음과 비교, BMI·체지방 범위, 최근 4주 운동한 날을 보고
// 칭찬 최대 3개. 체지방 표준 범위는 여성 기준(인바디 18–28%).
function ibPraise() {
  const good = [];
  const s = ibSorted();
  if (!s.length) return good;
  const pick = k => series(k);
  const last = k => pick(k).at(-1), prev = k => pick(k).at(-2), first = k => pick(k)[0];
  const d = k => (last(k) && prev(k)) ? r1(last(k)[k] - prev(k)[k]) : null;
  const sinceFirst = k => pick(k).length > 1 ? r1(last(k)[k] - first(k)[k]) : null;
  // 같은 방향으로 몇 번 연속 바뀌었는지 (dir: -1 줄어듦, +1 늘어남)
  const streak = (k, dir) => { const v = pick(k).map(e => e[k]); let n = 0; for (let i = v.length - 1; i > 0 && (v[i] - v[i - 1]) * dir > 0.05; i--) n++; return n; };
  const pp = x => Math.abs(x).toFixed(1);
  const dW = d('w'), dM = d('m'), dF = d('f');

  // 칭찬
  if (streak('f', -1) >= 3) good.push(`체지방이 ${streak('f', -1)}번 연속 줄었어요. 흐름이 아주 좋아요!`);
  else if (dF != null && dF <= -0.2) good.push(`체지방이 지난번보다 ${pp(dF)}%p 줄었어요. 잘하고 있어요!`);
  if (streak('m', 1) >= 3) good.push(`근육량이 ${streak('m', 1)}번 연속 늘었어요. 근력 운동 효과가 보여요!`);
  else if (dM != null && dM >= 0.2) good.push(`근육량이 지난번보다 ${pp(dM)}%p 늘었어요. 근력 운동이 잘 되고 있어요.`);
  if (dW != null && dW <= -0.3 && dM != null && dM >= 0) good.push(`근육은 지키면서 몸무게가 ${pp(dW)}kg 줄었어요. 가장 좋은 방향이에요.`);
  const fF = sinceFirst('f');
  if (fF != null && fF <= -1 && pick('f').length >= 3) good.push(`처음(${shortDate(first('f').date)})보다 체지방이 ${pp(fF)}%p 줄었어요.`);
  const lf = last('f');
  if (lf && lf.f >= 18 && lf.f <= 28) good.push(`체지방률 ${f1(lf.f)}%로 표준 범위(18–28%) 안이에요.`);
  const lb = last('b'), pb = prev('b');
  if (lb && lb.b >= 18.5 && lb.b < 23 && pb && pb.b >= 23) good.push(`BMI ${f1(lb.b)} · 정상 범위에 들어왔어요!`);

  // 최근 4주 운동한 날
  const today = parseYmd(todayStr());
  let active = 0;
  for (let i = 0; i < 28; i++) { const ds = ymd(new Date(today.getFullYear(), today.getMonth(), today.getDate() - i)); if (dayMin(ds) > 0 || mineOf(ds).length) active++; }
  if (active >= 12) good.push(`최근 4주 동안 ${active}일 운동했어요. 꾸준함이 최고예요!`);

  if (!good.length && s.length > 1) good.push('큰 변화 없이 잘 유지하고 있어요. 지금처럼 꾸준히!');
  if (s.length === 1) good.unshift('첫 기록을 남겼어요! 다음 측정부터 변화를 알려 드릴게요.');
  return good.slice(0, 3);
}

function feedbackCard() {
  const good = ibPraise();
  if (!good.length) return '';
  return `<div class="card fb">
    <h2>이번 결과 한마디</h2>
    <ul>${good.map(t => `<li><span class="fb-ic" aria-hidden="true">✓</span><span>${esc(t)}</span></li>`).join('')}</ul>
  </div>`;
}

// 그래프에 넣을 수치 (순서와 색 고정: 몸무게·체지방·근육량·BMI — 색약 구분까지 검사한 4색)
const CHART_KEYS = ['w', 'f', 'm', 'b'];
const chartKeys = () => {
  const ks = (S.chartKeys || ['w']).filter(k => CHART_KEYS.includes(k) && (k !== 'b' || heightCm()));
  return ks.length ? ks : ['w']; // 키를 아직 모르면 BMI 대신 몸무게
};
let ibShowAll = false;

function renderIb() {
  const card = k => {
    const s = series(k), M = METRICS[k];
    const last = s[s.length - 1], prev = s[s.length - 2];
    if (k === 'b' && !heightCm()) return `<button class="metric m-b" data-act="height">
      <div class="lab">BMI</div><div class="val" style="font-size:17px">키 입력</div>
      <div class="since">키를 적으면 자동 계산돼요</div></button>`;
    const on = chartKeys().length === 1 && chartKeys()[0] === k;
    return `<button class="metric m-${k} ${on ? 'on' : ''}" data-metric="${k}">
      <div class="lab">${M.lab}${k === 'b' && last ? ` · <span class="bmi-cls">${bmiClass(last.b)}</span>` : ''}</div>
      <div class="val num">${last ? f1(last[k]) : '–'}<small>${M.unit}</small></div>
      ${prev ? deltaHtml(last[k] - prev[k], k) : '<span class="delta same">&nbsp;</span>'}
      <div class="since">${prev ? '지난번보다' : s.length ? '첫 기록' : '기록 없음'}</div>
    </button>`;
  };
  const list = ibSorted().reverse();
  const shown = ibShowAll ? list : list.slice(0, 5);
  const prevOf = (e, k) => { const s = series(k); const i = s.indexOf(e); return i > 0 ? s[i - 1][k] : null; };
  const cell = (e, k) => { const p = prevOf(e, k); return `<span class="hv num">${e[k] == null ? '–' : `<b>${f1(e[k])}</b>`}${e[k] != null && p != null ? deltaHtml(e[k] - p, k) : ''}</span>`; };
  const keys = chartKeys(), multi = keys.length > 1;

  // 오늘 결과를 아직 안 적었으면 적는 칸이 맨 위, 적었으면 맨 아래
  const doneToday = S.data.inbody.some(e => e.date === todayStr());
  const form = `<div class="card">
      <h2>새 결과 적기</h2>
      <div class="form-grid">
        <label class="fld">잰 날<input type="date" id="i-date" data-draft="ib-date" value="${draft('ib-date', todayStr())}" max="${todayStr()}"></label>
        <label class="fld">몸무게 (kg)<input id="i-w" data-draft="ib-w" value="${draft('ib-w')}" inputmode="decimal" placeholder="예: 62.4"></label>
        <label class="fld">근육량 (%)<input id="i-m" data-draft="ib-m" value="${draft('ib-m')}" inputmode="decimal" placeholder="예: 38.5"></label>
        <label class="fld">체지방 (%)<input id="i-f" data-draft="ib-f" value="${draft('ib-f')}" inputmode="decimal" placeholder="예: 27.0"></label>
      </div>
      <button class="btn" style="width:100%" data-act="add-ib">저장</button>
    </div>`;

  $('#v-ib').innerHTML = `
    ${doneToday ? '' : form}
    <div class="metrics">${card('w')}${card('f')}${card('m')}${card('b')}</div>
    ${feedbackCard()}
    <div class="card">
      <h2>${multi ? '처음 기록 대비 변화' : `${METRICS[keys[0]].lab} 변화${METRICS[keys[0]].unit ? ` <span class="sub">(${METRICS[keys[0]].unit})</span>` : ''}`}</h2>
      <div class="ck-row">${CHART_KEYS.map(k => {
        const off = k === 'b' && !heightCm();
        return `<button class="ck ${keys.includes(k) ? 'on' : ''}" data-ck="${k}" ${off ? 'data-act="height"' : ''} aria-pressed="${keys.includes(k)}"><i style="background:var(--c-${k})"></i>${METRICS[k].lab}</button>`;
      }).join('')}</div>
      <div class="rg-row">${RANGES.map(([id, lab]) => `<button class="rg ${(S.chartRange || 'all') === id ? 'on' : ''}" data-range="${id}">${lab}</button>`).join('')}</div>
      ${keys.length === 1 && keys[0] === 'b' ? `<p class="sub" style="margin:0 0 6px;font-size:13px">키 ${heightCm()}cm 기준 (대한비만학회) · <button class="link" data-act="height">키 바꾸기</button></p>` : ''}
      ${multi ? '<p class="sub" style="margin:0 0 6px;font-size:13px">보는 기간의 첫 기록을 0으로 놓고 겹쳐 봐요 (몸무게 kg, 체지방·근육량 %p, BMI 점)</p>' : ''}
      ${chartHtml(keys)}
    </div>
    <div class="card">
      <h2>지난 기록</h2>
      ${list.length ? `<ul class="hist">
        <li class="head"><span>날짜</span><span>몸무게</span><span>근육량</span><span>체지방</span><span></span></li>
        ${shown.map(e => `<li><span class="hd num">${shortDate(e.date)}</span>${cell(e, 'w')}${cell(e, 'm')}${cell(e, 'f')}
          <button class="x" data-del-ib="${esc(e.id)}" aria-label="${shortDate(e.date)} 기록 지우기">${X_ICON}</button></li>`).join('')}
      </ul>
      ${list.length > 5 ? `<button class="btn ghost small more" data-act="ib-more">${ibShowAll ? '최근 5개만 보기' : `이전 기록 ${list.length - 5}개 더 보기`}</button>` : ''}`
      : '<p class="empty">아직 기록이 없어요. 위에 첫 결과를 적어 보세요.</p>'}
    </div>
    ${doneToday ? form : ''}`;
  bindChart();
}

// 선 그래프. 하나만 고르면 실제 값, 여러 개면 각자 (보는 기간의) 첫 기록 대비 변화로 겹침.
// BMI 하나만 볼 때는 18.5 / 23 / 25 / 30 기준선과 범위 띠를 깔아서 정상 범위 안인지 바로 보이게.
// 숫자는 일부 점에만(하나: 처음·마지막·최고·최저 / 여럿: 선 끝), 점을 누르면 그날 값 전부.
const RANGES = [['3m', '3개월', 3], ['6m', '6개월', 6], ['1y', '1년', 12], ['all', '전체', 0]];
const BMI_BANDS = [
  { from: 0, to: 18.5, lab: '저체중', fill: 'var(--c-b)' },
  { from: 18.5, to: 23, lab: '정상', fill: 'var(--c-f)' },
  { from: 23, to: 25, lab: '비만 전단계', fill: 'var(--c-m)' },
  { from: 25, to: 30, lab: '비만 1단계', fill: 'var(--c-w)' },
  { from: 30, to: 99, lab: '비만 2단계 이상', fill: 'var(--c-w)' },
];
let chartPts = [];
function chartHtml(keys) {
  keys = keys.filter(k => series(k).length);
  if (!keys.length) return '<p class="empty">기록을 적으면 여기에 그래프가 그려져요.</p>';
  const multi = keys.length > 1, bmi = !multi && keys[0] === 'b';
  const months = (RANGES.find(r => r[0] === (S.chartRange || 'all')) || RANGES[3])[2];
  const now = parseYmd(todayStr());
  const cut = months ? new Date(now.getFullYear(), now.getMonth() - months, now.getDate()).getTime() : -Infinity;

  const lines = keys.map(k => {
    const s = series(k), all = s.map((e, i) => ({ t: parseYmd(e.date).getTime(), date: e.date, raw: e[k], prev: i ? s[i - 1][k] : null }));
    const pts = all.filter(p => p.t >= cut);
    const base = pts.length ? pts[0].raw : 0;
    pts.forEach(p => (p.v = multi ? r1(p.raw - base) : p.raw));
    return { k, pts };
  }).filter(l => l.pts.length);
  if (!lines.length) return '<p class="empty">이 기간에는 기록이 없어요. 기간을 넓혀 보세요.</p>';

  const W = 340, H = 220, L = 36, R = multi ? 74 : bmi ? 66 : 14, T = 18, B = 28;
  const ts = lines.flatMap(l => l.pts.map(p => p.t));
  let t0 = Math.min(...ts), t1 = Math.max(...ts);
  if (t0 === t1) { t0 -= 864e5 * 15; t1 += 864e5 * 15; }
  const vs = lines.flatMap(l => l.pts.map(p => p.v)).concat(multi ? [0] : []);
  let lo = Math.min(...vs), hi = Math.max(...vs), ticks;
  if (bmi) {
    // 18.5–30 이 늘 보이도록, 기록이 밖에 있으면 넓힘
    lo = Math.min(18, Math.floor(lo - 0.5)); hi = Math.max(30.5, Math.ceil(hi + 0.5));
    ticks = [18.5, 23, 25, 30].filter(v => v > lo && v < hi);
  } else {
    const pad = Math.max((hi - lo) * 0.18, multi ? 0.5 : keys[0] === 'w' ? 1 : 0.8);
    lo -= pad; hi += pad;
    const step = niceStep((hi - lo) / (multi ? 4 : 3));
    ticks = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) ticks.push(r1(v));
  }
  const X = t => L + (t - t0) / (t1 - t0) * (W - L - R), Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const fmtV = v => multi ? (v > 0 ? '+' : v < 0 ? '−' : '±') + Math.abs(v).toFixed(1) : f1(v);
  const x0 = L, x1 = W - R, yB = H - B;

  // 누를 수 있는 날짜들 (모든 선의 날짜를 합침)
  const dates = [...new Set(lines.flatMap(l => l.pts.map(p => p.date)))].sort();
  chartPts = dates.map(date => ({ date, x: X(parseYmd(date).getTime()), rows: lines.map(l => ({ k: l.k, p: l.pts.find(p => p.date === date) })).filter(r => r.p) }));

  // 아래 날짜 눈금: 달이 바뀌는 곳마다, 너무 많으면 건너뜀
  const monthTicks = [];
  for (let d = new Date(new Date(t0).getFullYear(), new Date(t0).getMonth() + 1, 1); d.getTime() <= t1; d = new Date(d.getFullYear(), d.getMonth() + 1, 1)) monthTicks.push(d);
  const every = Math.ceil(monthTicks.length / 5) || 1;
  const xTicks = monthTicks.filter((_, i) => i % every === 0)
    .map(d => ({ x: X(d.getTime()), lab: d.getMonth() === 0 ? `${String(d.getFullYear()).slice(2)}년 1월` : `${d.getMonth() + 1}월` }))
    .filter(t => t.x > x0 + 14 && t.x < x1 - 14);

  // BMI 범위 띠와 이름
  let bands = '';
  if (bmi) {
    for (const b of BMI_BANDS) {
      const yTop = Y(Math.min(b.to, hi)), yBot = Y(Math.max(b.from, lo));
      if (yBot <= yTop) continue;
      const normal = b.lab === '정상';
      bands += `<rect x="${x0}" y="${yTop}" width="${x1 - x0}" height="${yBot - yTop}" fill="${b.fill}" opacity="${normal ? 0.16 : 0.07}"/>`;
      if (yBot - yTop >= 11) bands += `<rect x="${x1 + 4}" y="${yTop + 1}" width="3" height="${yBot - yTop - 2}" rx="1.5" fill="${b.fill}" opacity="${normal ? 0.9 : 0.45}"/><text class="band-lab${normal ? ' on' : ''}" x="${x1 + 11}" y="${(yTop + yBot) / 2 + 4}">${b.lab.replace(' 이상', '+')}</text>`;
    }
  }

  let marks = '', labels = '';
  for (const l of lines) {
    const col = `var(--c-${l.k})`;
    const P = l.pts.map(p => ({ ...p, x: X(p.t), y: Y(p.v) }));
    const line = P.map((p, i) => `${i ? 'L' : 'M'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join('');
    if (!multi && !bmi && P.length > 1) marks += `<path d="${line}L${P.at(-1).x.toFixed(1)},${yB}L${P[0].x.toFixed(1)},${yB}Z" fill="${col}" opacity=".08"/>`;
    marks += `<path d="${line}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    marks += P.map((p, i) => {
      const lastPt = i === P.length - 1;
      return `<circle cx="${p.x}" cy="${p.y}" r="${lastPt ? 6 : multi ? 3.5 : 4}" fill="${lastPt ? 'var(--card)' : col}" stroke="${lastPt ? col : 'var(--card)'}" stroke-width="${lastPt ? 3 : 1.5}" data-d="${p.date}" data-last="${lastPt ? 1 : ''}"/>`;
    }).join('');
    if (!multi) {
      const v = P.map(p => p.v), iMax = v.indexOf(Math.max(...v)), iMin = v.lastIndexOf(Math.min(...v));
      labels += [...new Set([0, P.length - 1, iMax, iMin])].map(i => {
        const p = P[i], below = i === iMin && i !== iMax && P.length > 1, isLast = i === P.length - 1;
        return `<text class="vlab num${isLast ? ' last' : ''}" x="${Math.min(Math.max(p.x, x0 + 14), x1 - 14)}" y="${below ? p.y + 19 : p.y - 11}" text-anchor="middle">${f1(p.v)}</text>`;
      }).join('');
    }
    l.end = P.at(-1);
  }
  if (multi) {
    // 선 끝에 이름과 변화량 (겹치지 않게 위아래로 밀기)
    const ends = lines.map(l => ({ k: l.k, y: l.end.y, ly: l.end.y, v: l.end.v })).sort((a, b) => a.y - b.y);
    for (let i = 1; i < ends.length; i++) if (ends[i].ly - ends[i - 1].ly < 14) ends[i].ly = ends[i - 1].ly + 14;
    labels = ends.map(e => `<text class="vlab num" x="${x1 + 8}" y="${e.ly + 4}"><tspan fill="var(--c-${e.k})">●</tspan> ${METRICS[e.k].lab} ${fmtV(e.v)}</text>`).join('');
  }
  const first = lines[0].pts[0], last = lines[0].pts.at(-1);
  return `<div class="chart-wrap" id="chart">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${keys.map(k => METRICS[k].lab).join(', ')} 변화 그래프">
      ${bands}
      ${ticks.map(v => `<line x1="${x0}" x2="${x1}" y1="${Y(v)}" y2="${Y(v)}" stroke="${bmi ? 'var(--muted)' : 'var(--grid)'}" stroke-width="1" ${bmi ? 'stroke-dasharray="3 4" opacity=".45"' : ''}/><text class="axis num" x="${x0 - 6}" y="${Y(v) + 4}" text-anchor="end">${multi ? fmtV(v) : v}</text>`).join('')}
      ${multi ? `<line x1="${x0}" x2="${x1}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--muted)" stroke-width="1" opacity=".5"/>` : ''}
      <line x1="${x0}" x2="${x1}" y1="${yB}" y2="${yB}" stroke="var(--line)" stroke-width="1"/>
      ${xTicks.map(t => `<line x1="${t.x}" x2="${t.x}" y1="${yB}" y2="${yB + 4}" stroke="var(--line)"/><text class="axis" x="${t.x}" y="${H - 8}" text-anchor="middle">${t.lab}</text>`).join('')}
      <line id="cross" x1="0" x2="0" y1="${T - 6}" y2="${yB}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>
      ${marks}${labels}
      <rect x="0" y="0" width="${W}" height="${H}" fill="transparent"/>
    </svg>
    <div class="tip" id="tip" hidden></div>
  </div>
  ${!multi && lines[0].pts.length > 1 ? `<div class="chart-sum"><span>${shortDate(first.date)} ~ ${shortDate(last.date)} · ${lines[0].pts.length}번</span><span>${deltaHtml(last.raw - first.raw, keys[0], METRICS[keys[0]].unit)}${bmi ? ` · 지금 <b style="color:var(--ink)">${bmiClass(last.raw)}</b>` : ''}</span></div>` : ''}`;
}
function niceStep(raw) {
  const p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
}
function bindChart() {
  const wrap = $('#chart'); if (!wrap) return;
  const svg = wrap.querySelector('svg'), tip = $('#tip'), cross = $('#cross');
  svg.querySelectorAll('circle').forEach(c => (c.dataset.r = c.getAttribute('r')));
  const show = ev => {
    const box = svg.getBoundingClientRect(), sx = box.width / 340;
    const x = (ev.clientX - box.left) / sx;
    let best = chartPts[0]; for (const p of chartPts) if (Math.abs(p.x - x) < Math.abs(best.x - x)) best = p;
    tip.innerHTML = `${longDate(best.date)}` + best.rows.map(({ k, p }) =>
      `<br><span class="tip-dot" style="background:var(--c-${k})"></span>${METRICS[k].lab} <b class="num">${f1(p.raw)}${METRICS[k].unit}</b> ${p.prev != null ? deltaHtml(p.raw - p.prev, k) : ''}`).join('');
    const ys = svg.querySelectorAll(`circle[data-d="${best.date}"]`);
    const topY = Math.min(...[...ys].map(c => +c.getAttribute('cy')));
    tip.style.left = Math.min(Math.max(best.x * sx, 80), box.width - 80) + 'px';
    tip.style.top = topY * sx + 'px';

  } catch {}
  const ib = ibSorted().filter(e => e.f != null).at(-1);
  if (ib && ib.f > 28) why.push(`체지방률 ${f1(ib.f)}% → 큰 근육(등·엉덩이)으로 근육 늘리기`);

  // 고르기: 준비운동 → 등 2개 → 엉덩이 1개는 늘 넣고, 남는 시간에 가슴·하체 하나 더·팔을 필요한 순서대로
  const triedAt = {};
  for (const d of doneDays(addDays(today, 1)).reverse()) for (const it of G().sessions[d].items) triedAt[it.ex] = d;
  // 부위 안에서: 좋아하는 것 → 해 본 것(최근 순) → 기본 순서. 손목 주의 운동은 이미 하나 있으면 건너뜀
  const pickFrom = (g, k) => {
    const list = g === '하체·엉덩이' && legBusy ? ['덤벨 스티프 레그 데드리프트', '힙 쓰러스트', '플레이트 힙 쓰러스트', '힙 어브덕션'] : RECO_PICK[g];
    const wristTaken = chosen.some(c => CAUTION[c.ex]);
    return [...list].filter(n => !chosen.some(c => c.ex === n) && !(wristTaken && CAUTION[n]))
      .sort((a, b) => LIKED.includes(b) - LIKED.includes(a) || (triedAt[b] || '').localeCompare(triedAt[a] || '') || list.indexOf(a) - list.indexOf(b))[k];
  };
  const big = light ? 6 : 8, small = light ? 4 : 5; // 운동 하나에 걸리는 분 (세트 + 쉬는 시간 + 자리 옮기기)
  const chosen = [{ g: '준비', ex: WARMUP, min: 3, sets: 2, reps: 15 }];
  const take = (g, min, sets, reps) => { const ex = pickFrom(g, 0); if (ex) chosen.push({ g, ex, min, sets, reps }); };
  // 데드리프트(좋아하는 손목 주의 운동)를 먼저 잡고, 등은 손목 부담 없는 머신·케이블로
  take('하체·엉덩이', big, 3, 10); take('등', big, 3, 10); take('등', big, 3, 10);
  const extra = [
    { g: '가슴', min: big, sets: 3, reps: 10, score: need['가슴'] },
    { g: '어깨', min: small, sets: 3, reps: 12, score: need['어깨'] + 0.5 },
    ...(legBusy ? [] : [{ g: '하체·엉덩이', min: big, sets: 3, reps: 10, score: need['하체·엉덩이'] - 1 }]),
    { g: '팔', min: small, sets: 2, reps: 12, score: need['팔'] },
  ].sort((a, b) => b.score - a.score);
  const total = () => chosen.reduce((a, c) => a + c.min, 0);
  for (const e of extra) if (total() + e.min <= maxMin) take(e.g, e.min, e.sets, e.reps);

  // 하는 순서: 준비운동 → (하체가 주인공이거나 데드리프트·레그 프레스 같은 큰 하체 운동이면 하체 먼저) → 등 → 가슴 → 어깨 → 팔
  // → (엉덩이 보조 운동만 있으면 마무리로). 데드리프트는 등 운동으로 손아귀·손목이 지치기 전에
  const BIG_LEG = ['덤벨 스티프 레그 데드리프트', '머신 레그 프레스', '스미스머신 스쿼트'];
  const legsMain = chosen.filter(c => c.g === '하체·엉덩이').length >= 2 || chosen.some(c => BIG_LEG.includes(c.ex));
  const rank = { 준비: 0, '하체·엉덩이': legsMain ? 1 : 9, 등: 2, 가슴: 3, 어깨: 4, 팔: 5 };
  chosen.sort((a, b) => rank[a.g] - rank[b.g]);

  why.push('어깨 튼튼하게: 회전근 준비운동부터, 어깨 운동 하나 · 등 운동은 가슴보다 많이 (어깨가 앞으로 말리지 않게)');
  const wr = chosen.find(c => CAUTION[c.ex]);
  why.push(wr ? `손목 주의 운동은 하루 하나만: 오늘은 ${wr.ex}` : '손목 주의 운동 없이 짰어요');
  if (legBusy) why.push('다리는 이번 주에 많이 썼어요 → 하체는 엉덩이 운동 하나만');
  why.push(`순서: ${chosen.map(c => c.g === '준비' ? '어깨 준비' : c.g === '하체·엉덩이' ? '엉덩이·하체' : c.g).filter((g, i, a) => a.indexOf(g) === i).join(' → ')} · 근력 약 ${total()}분`);

  const items = chosen.map(c => {
    const r = recoSets(c.ex, today, light ? 2 : c.sets, c.reps, light);
    if (r.up) why.push(`${c.ex}: 지난번 12회씩 다 해서 ${r.sets[0].w}kg로 올렸어요`);
    return { ex: c.ex, sets: r.sets };
  });
  if (!Object.keys(lastDay).length) why.push('처음 하는 운동은 마지막 2회가 힘들 정도의 무게로 시작해요');
  // 유산소가 적은 주면 근력 끝나고 일립티컬 10분 (근력 시간에는 안 셈)
  if (cardioMin < 45 && avgSteps < 8000) { items.push({ ex: '일립티컬 머신', sets: [{ m: '10', done: false }] }); why.push('이번 주 유산소가 적어요 → 끝나고 일립티컬 10분'); }
  return { items, why };
}

// 운동 하나의 날짜별 최고 무게 그래프
let openEx = null;
function exChartHtml(n) {
  const pts = Object.keys(G().sessions).sort().map(d => {
    const it = (G().sessions[d].items || []).find(i => i.ex === n);
    const ws = it ? it.sets.filter(x => x.done && +x.w > 0).map(x => +x.w) : [];
    return ws.length ? { d, w: Math.max(...ws) } : null;
  }).filter(Boolean);
  if (pts.length < 2) return '<p class="sub" style="margin:0 0 10px;font-size:13px">두 번 이상 기록하면 그래프가 그려져요.</p>';
  const W = 320, H = 130, L = 30, R = 14, T = 20, B = 22;
  const vs = pts.map(p => p.w);
  let lo = Math.min(...vs), hi = Math.max(...vs);
  const pad = Math.max((hi - lo) * 0.2, 2); lo = Math.max(0, lo - pad); hi += pad;
  const X = i => L + i * (W - L - R) / (pts.length - 1), Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const iMax = vs.lastIndexOf(Math.max(...vs)), lab = [...new Set([0, pts.length - 1, iMax])];
  const step = niceStep((hi - lo) / 3), ticks = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) ticks.push(r1(v));
  const kg = v => f1(v).replace('.0', '');
  return `<div class="exchart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(n)} 무게 변화, 처음 ${vs[0]}kg 지금 ${vs.at(-1)}kg">
    ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text class="axis num" x="${L - 5}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`).join('')}
    <path d="${pts.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(p.w).toFixed(1)}`).join('')}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p, i) => `<circle cx="${X(i)}" cy="${Y(p.w)}" r="${i === iMax ? 5.5 : 3.5}" fill="${i === iMax ? 'var(--card)' : 'var(--accent)'}" stroke="var(--accent)" stroke-width="${i === iMax ? 3 : 0}"/>`).join('')}
    ${lab.map(i => `<text class="vlab num" x="${Math.min(Math.max(X(i), L + 14), W - R - 14)}" y="${Y(pts[i].w) - 9}" text-anchor="middle">${kg(pts[i].w)}${i === iMax ? ' 최고' : ''}</text>`).join('')}
    <text class="axis num" x="${L}" y="${H - 5}">${shortDate(pts[0].d)}</text><text class="axis num" x="${W - R}" y="${H - 5}" text-anchor="end">${shortDate(pts.at(-1).d)}</text>
  </svg><p class="sub" style="margin:0;font-size:13px">${pts.length}번 · 처음보다 ${vs.at(-1) - vs[0] >= 0 ? '+' : '−'}${kg(Math.abs(vs.at(-1) - vs[0]))}kg</p></div>`;
}
function statsCard() {
  const now = new Date(), y = now.getFullYear(), m = now.getMonth();
  const inMonth = ds => { const d = parseYmd(ds); return d.getFullYear() === y && d.getMonth() === m; };
  const days = new Set([...Object.keys(S.data.mine || {}).filter(inMonth).filter(d => mineOf(d).length), ...Object.keys(G().sessions).filter(inMonth).filter(d => G().sessions[d].start)]);
  const count = {};
  for (const d of Object.keys(S.data.mine || {}).filter(inMonth)) for (const x of mineOf(d)) count[x.name] = (count[x.name] || 0) + 1;
  const top = Object.entries(count).sort((a, b) => b[1] - a[1])[0];
  // 운동별 최고 무게와 지난번 무게
  const best = {};
  for (const d of Object.keys(G().sessions).sort()) for (const it of G().sessions[d].items || []) {
    if (isCardio(it.ex)) continue;
    const ws = it.sets.filter(s => s.done && +s.w > 0).map(s => +s.w);
    if (!ws.length) continue;
    const b = best[it.ex] || { max: 0 };
    best[it.ex] = { max: Math.max(b.max, ...ws), last: Math.max(...ws), date: d };
  }
  const rows = Object.entries(best).sort((a, b) => b[1].date.localeCompare(a[1].date)).slice(0, 8);
  return `<div class="card">
    <h2>${m + 1}월 기록</h2>
    <div class="tiles">
      <div class="tile"><b class="num">${days.size}<small>일</small></b><span>운동한 날</span></div>
      <div class="tile"><b style="font-size:17px">${top ? esc(top[0]) : '–'}</b><span>가장 많이 한 운동${top ? ` · ${top[1]}번` : ''}</span></div>
    </div>
    ${rows.length ? `<h3 style="font-size:15px;font-weight:800;margin:14px 0 4px">운동별 최고 무게</h3>
    <p class="sub" style="margin:0 0 4px;font-size:13px">운동을 누르면 무게 변화를 보여 줘요</p>
    <ul class="wo">${rows.map(([n, b]) => `<li class="exli"><button class="exrow" data-exc="${esc(n)}" aria-expanded="${openEx === n}">${figSvg(n, 36)}<span class="wo-name">${esc(n)}<span class="wo-note">지난번 ${f1(b.last).replace('.0', '')}kg · ${shortDate(b.date)}</span></span><b class="num">${f1(b.max).replace('.0', '')}<small class="sub"> kg</small></b></button>${openEx === n ? exChartHtml(n) : ''}</li>`).join('')}</ul>` : ''}
  </div>`;
}

  const gaps = P.slice(1).map((p, i) => diffDays(P[i].start, p.start)).filter(x => x >= 15 && x <= 60).slice(-6);
  const plens = (ongoing ? P.slice(0, -1) : P).map(p => diffDays(p.start, p.end) + 1).filter(x => x >= 2 && x <= 12).slice(-6);
  const cycleLen = gaps.length >= 2 ? Math.round(mid(gaps)) : prof.cycleLen || gaps[0] || 28;
  const periodLen = plens.length >= 2 ? Math.round(mid(plens)) : prof.periodLen || plens[0] || 5;
  const I = { P, L, ongoing, gaps, cycleLen, periodLen, measured: gaps.length >= 2 };
  if (!L) return I;
  I.day = diffDays(L.start, today) + 1;
  I.next = addDays(L.start, cycleLen);
  I.late = !ongoing && I.next < today ? diffDays(I.next, today) : 0;
  return I;
}
// 달력 표시: 예상 생리일(pp), 가임기(fw), 배란일(ov)
function cycMarks(I) {
  const pp = new Set(), fw = new Set(), ov = new Set(), today = todayStr();
  if (!I.L) return { pp, fw, ov };
  if (I.ongoing) for (let d = addDays(I.L.end, 1); d <= addDays(I.L.start, I.periodLen - 1); d = addDays(d, 1)) if (d >= today) pp.add(d);
  // 오늘부터 1년 뒤까지 같은 주기로 이어서 예상
  let s = I.late ? today : I.next;
  const until = addDays(today, 366);
  for (let k = 0; addDays(s, -19) <= until; k++) {
    const o = addDays(s, -14);
    if (o >= I.L.start && !(k === 0 && I.late)) { ov.add(o); for (let i = -5; i <= 1; i++) fw.add(addDays(o, i)); }
    if (s <= until) for (let i = 0; i < I.periodLen; i++) if (addDays(s, i) >= today) pp.add(addDays(s, i));
    s = addDays(s, I.cycleLen);
  }
  return { pp, fw, ov };
}

// 주기 링: 한 바퀴 = 한 주기. 산호색 = 생리 기간, 초록 = 가임기(예상), 점 = 오늘
function cycRing(I, big, lab) {
  const r = 50, c = 2 * Math.PI * r, L = I.cycleLen, ovDay = L - 13; // 다음 시작일 14일 전 = 주기 (L−13)일째
  const arc = (from, to, col, op = 1) => {
    const a = Math.max(0, (from - 1) / L), b = Math.min(1, to / L);
    return b > a ? `<circle cx="60" cy="60" r="${r}" fill="none" stroke="${col}" stroke-opacity="${op}" stroke-width="12" stroke-dasharray="${((b - a) * c).toFixed(2)} ${c.toFixed(2)}" stroke-dashoffset="${(-a * c).toFixed(2)}"/>` : '';
  };
  const day = Math.min(I.day || 1, L), ang = (day - 0.5) / L * 2 * Math.PI;
  return `<div class="big-ring"><svg viewBox="0 0 120 120" aria-hidden="true">
      <circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--track)" stroke-width="12"/>
      ${arc(1, I.periodLen, 'var(--accent)')}${arc(ovDay - 5, ovDay + 1, 'var(--c-f)', 0.7)}
      <circle cx="${(60 + r * Math.cos(ang)).toFixed(1)}" cy="${(60 + r * Math.sin(ang)).toFixed(1)}" r="8" fill="var(--card)" stroke="var(--ink)" stroke-width="3"/>
    </svg><div class="in"><b class="num">${big}</b><span>${lab}</span></div></div>`;
}

function cycHero(I) {
  const today = todayStr();
  if (!I.L) return `<div class="card">
    <h2>첫 기록</h2>
    <p class="sub" style="margin:0 0 10px">마지막 생리 시작일을 넣으면 다음 예정일을 알려 줘요.</p>
    <div class="form-grid">
      <label class="fld" style="grid-column:1/-1">마지막 생리 시작일<input type="date" id="c-start" data-draft="cyc0-start" value="${draft('cyc0-start')}" max="${today}"></label>
      <label class="fld">평소 주기 (일)<input id="c-len" data-draft="cyc0-len" value="${draft('cyc0-len', '28')}" inputmode="numeric"></label>
      <label class="fld">생리 기간 (일)<input id="c-plen" data-draft="cyc0-plen" value="${draft('cyc0-plen', '5')}" inputmode="numeric"></label>
    </div>
    <button class="btn" style="width:100%" data-act="cyc-setup">저장</button>
  </div>`;
  let ring, facts, action;
  if (I.ongoing) {
    const end = addDays(I.L.start, I.periodLen - 1), f = flowOf(today) > 0;
    ring = cycRing(I, `${I.day}<small>일째</small>`, '생리 중');
    facts = `<span class="pill done">생리 ${I.day}일째</span>${end >= today ? `<div class="sub">${md(end)}쯤 끝날 것 같아요</div>` : ''}`;
    // 오늘 이미 체크했으면 '끝났어요'를 안 보여 줌 (오늘 기록을 지워 기간이 하루 짧아지지 않게). 내일 물어봄
    action = f ? `<p class="sub" style="margin:12px 0 6px;font-size:13px">✓ 오늘도 체크했어요</p>
      <div class="chips" style="margin:0"><button class="chip pick" data-cyc-flow="" data-date="${today}">취소</button></div>`
      : `<p class="sub" style="margin:12px 0 6px;font-size:13px">오늘도 생리 중이에요?</p>
      <div class="chips" style="margin:0"><button class="chip pick" data-cyc-flow="2" data-date="${today}">네, 오늘도</button>
      <button class="chip pick" data-cyc-flow="0" data-date="${today}">끝났어요</button></div>`;
  } else {
    const o = addDays(I.next, -14), fs = addDays(o, -5), fe = addDays(o, 1);
    const fert = I.late ? '' : today >= fs && today <= fe ? '<div class="sub" style="color:var(--c-f);font-weight:700">오늘은 가임기예요 (예상)</div>'
      : fs > today ? `<div class="sub">가임기 예상 ${md(fs)}–${md(fe)}</div>` : '';
    if (I.late) ring = cycRing(I, `+${I.late}<small>일</small>`, '예정일 지남');
    else if (I.next === today) ring = cycRing(I, '오늘', '생리 예정일');
    else ring = cycRing(I, `${diffDays(today, I.next)}<small>일</small>`, '다음 생리까지');
    facts = `<span class="pill">예상 ${longDate(I.next)}</span><div class="sub">주기 ${I.day}일째</div>${fert}`;
    action = `<button class="btn" style="width:100%;margin-top:14px" data-cyc-flow="2" data-date="${today}">생리 시작했어요</button>`;
  }
  return `<div class="card tile t-lilac"><div class="hero-top">${ring}<div class="hero-facts">${facts}</div></div>${action}</div>`;
}
// 생리 화면 작은 블록: 다음 생리(산호) · 가임기(민트)
function cycTiles(I) {
  const today = todayStr(), o = addDays(I.next, -14), fs = addDays(o, -5), fe = addDays(o, 1);
  const nv = I.late ? `+${I.late}<small>일</small>` : I.next === today ? '오늘' : `D-${diffDays(today, I.next)}`;
  return `<div class="bento">
    <div class="card tile t-coral"><div class="tk">다음 생리</div><div class="tv num">${nv}</div><div class="ts">${I.late ? '예정일 지남' : longDate(I.next)}</div></div>
    <div class="card tile t-mint"><div class="tk">가임기 (예상)</div><div class="tv num" style="font-size:24px">${I.late ? '–' : `${md(fs)}–${md(fe).split('/').pop()}`}</div><div class="ts">${I.late ? '기록 후 다시 계산' : `배란일 ${md(o)}`}</div></div>
  </div>`;
}

function cycCalendar(I) {
  const y = cycView.getFullYear(), m = cycView.getMonth(), today = todayStr(), { pp, fw, ov } = cycMarks(I);
  const off = (new Date(y, m, 1).getDay() + 6) % 7, n = new Date(y, m + 1, 0).getDate();
  let cells = '<span></span>'.repeat(off);
  for (let d = 1; d <= n; d++) {
    const ds = ymd(new Date(y, m, d)), f = flowOf(ds);
    const cls = ['cday', f > 0 && 'p', !f && pp.has(ds) && 'pp', !f && fw.has(ds) && 'fw', ov.has(ds) && 'ov', ds === today && 'today'].filter(Boolean).join(' ');
    const inner = `<span class="cn num">${d}</span>`;
    cells += ds > today ? `<span class="${cls}">${inner}</span>`
      : `<button class="${cls}" data-cday="${ds}" aria-pressed="${f > 0}" aria-label="${longDate(ds)} 생리">${inner}</button>`;
  }
  return `<div class="card">
    <div class="month-head">
      <h2>${y}년 ${m + 1}월</h2>
      <div class="arrows"><button data-act="cyc-prev" aria-label="지난달">${ARROW_L}</button><button data-act="cyc-next" aria-label="다음 달">${ARROW_R}</button></div>
    </div>
    <div class="wk">${WD.map(w => `<span>${w}</span>`).join('')}</div>
    <div class="cgrid" id="cgrid">${cells}</div>
    <div class="legend-line"><span><i class="lp"></i>생리</span><span><i class="lpp"></i>예상</span><span><i class="lfw"></i>가임기</span><span><i class="lov"></i>배란일</span></div>
    <p class="sub" style="margin:6px 0 0;font-size:12px">날짜를 누르면 생리한 날로 체크되고, 다시 누르면 지워져요. 예상과 가임기는 기록으로 어림한 값이라 피임에 쓰면 안 돼요.</p>
  </div>`;
}

function cycStats(I) {
  if (!I.L) return '';
  const P = I.P.slice(-7), rows = [];
  for (let i = P.length - 1; i >= 0 && rows.length < 6; i--) {
    const p = P[i], len = P[i + 1] ? diffDays(p.start, P[i + 1].start) : I.day, plen = diffDays(p.start, p.end) + 1;
    rows.push({ p, len, plen, now: !P[i + 1] });
  }
  const scale = Math.max(40, ...rows.map(r => r.len));
  const g = I.gaps, spread = g.length >= 3 && Math.max(...g) - Math.min(...g) >= 8;
  return `<div class="card">
    <h2>내 주기</h2>
    <div class="tiles">
      <div class="tile"><b class="num">${I.cycleLen}<small>일</small></b><span>보통 주기${I.measured ? ` · 최근 ${g.length}번` : ''}</span></div>
      <div class="tile"><b class="num">${I.periodLen}<small>일</small></b><span>보통 생리 기간</span></div>
    </div>
    ${I.measured ? '' : `<p class="sub" style="margin:8px 0 0;font-size:13px">기록이 두 번 쌓일 때까지는 평소 주기로 예상해요 · <button class="link" data-act="cyc-settings">바꾸기</button></p>`}
    ${spread ? `<p class="sub" style="margin:8px 0 0;font-size:13px">최근 주기가 ${Math.min(...g)}–${Math.max(...g)}일로 차이가 커요.</p>` : ''}
    <ul class="cy-list">${rows.map(r => `<li><span class="hd num">${shortDate(r.p.start)}</span>
      <span class="cy-bar"><i style="width:${(r.len / scale * 100).toFixed(1)}%"><s style="width:${Math.min(100, r.plen / r.len * 100).toFixed(1)}%"></s></i></span>
      <span class="num cy-n">${r.now ? `${r.len}일째` : `${r.len}일`}</span></li>`).join('')}</ul>
  </div>`;
}

function renderCyc() {
  const I = cycleInfo();
  $('#v-cyc').innerHTML = cycHero(I) + (I.L ? cycTiles(I) + cycCalendar(I) : '') + cycStats(I);
}

// 그날 생리 기록 바꾸기 → 저장 (f 가 null 이면 기록을 지움)
function setCycDay(ds, f) {
  if (f == null) delete CY()[ds]; else CY()[ds] = { f };
  save(); renderCyc();
  saveSoon({ cycleDays: { [ds]: CY()[ds] || null } });
}
function cycClick(t) {
  const a = t.dataset.act, today = todayStr();
  // 달력: 누르면 생리한 날로 체크, 다시 누르면 지움. 오늘을 지우면 '끝났어요'와 같음
  if (t.dataset.cday) { const ds = t.dataset.cday; setCycDay(ds, flowOf(ds) > 0 ? (ds === today ? 0 : null) : 2); return true; }
  if (t.dataset.cycFlow !== undefined) {
    // data-cyc-flow: 2 = 생리한 날, 0 = 끝났어요, 빈 값 = 오늘 체크 취소
    const ds = t.dataset.date || today, f = t.dataset.cycFlow === '' ? null : +t.dataset.cycFlow, wasNone = !cycleInfo().ongoing && ds === today && f > 0 && !flowOf(ds);
    setCycDay(ds, f);
    if (wasNone) toast('기록했어요. 몸 잘 챙겨요');
    return true;
  }
  if (a === 'cyc-prev' || a === 'cyc-next') { cycView = new Date(cycView.getFullYear(), cycView.getMonth() + (a === 'cyc-next' ? 1 : -1), 1); renderCyc(); return true; }
  if (a === 'cyc-setup' || a === 'cyc-settings') {
    let len, plen;
    if (a === 'cyc-setup') { len = parseInt($('#c-len').value, 10); plen = parseInt($('#c-plen').value, 10); }
    else {
      const I = cycleInfo();
      len = parseInt(prompt('평소 생리 주기 (일, 예: 28)', I.cycleLen) || '', 10);
      if (!len) return true;
      plen = parseInt(prompt('평소 생리 기간 (일, 예: 5)', I.periodLen) || '', 10);
      if (!plen) return true;
    }
    if (!(len >= 15 && len <= 60) || !(plen >= 1 && plen <= 14)) { toast('주기는 15–60일, 기간은 1–14일로 적어 주세요'); return true; }
    const start = a === 'cyc-setup' ? $('#c-start').value : '';
    if (a === 'cyc-setup' && (!start || start > today)) { toast('마지막 생리 시작일을 골라 주세요'); return true; }
    S.data.profile = { ...(S.data.profile || {}), cycleLen: len, periodLen: plen };
    const body = { profile: S.data.profile };
    if (a === 'cyc-setup') {
      // 시작일부터 평소 기간만큼 생리한 날로 채움 (나중에 달력에서 고칠 수 있음)
      body.cycleDays = {};
      for (let i = 0; i < plen && addDays(start, i) <= today; i++) { CY()[addDays(start, i)] = { f: 2 }; body.cycleDays[addDays(start, i)] = { f: 2 }; }
      clearDrafts('cyc0-');
    }
    save(); renderCyc(); toast('저장했어요');
    saveSoon(body);
    return true;
  }
  return false;
}
