<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fff3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1210" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="내 건강">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>내 건강</title>
<style>
/* 모양 (시안 C · 코랄 파스텔): 크림빛 바탕, 흰 카드, 산호색 하나, 둥근 모서리.
   변화 표시: 좋아짐 = 산호색, 나빠짐 = 회색 (빨강이 주제색이라 '나쁨'으로 쓰지 않음). 항상 ▲▼ 화살표와 함께 */
:root {
  --bg: #fff3ee; --card: #ffffff; --ink: #3b2320; --muted: #8a6b64; --line: #f5dfd8; --field: #fff0eb;
  --accent: #eb5a50; --accent-ink: #ffffff; --soft: #ffe5de; --track: #fbdcd5;
  --good: #d14b41; --bad: #8e817d; --grid: #f8e6e0;
  --r: 22px; --r-sm: 16px;
  --c-w: #e5534b; --c-f: #1f8f7a; --c-m: #b87a10; --c-b: #7a6fd6; /* 그래프 4색 (검사 통과) */
  --shadow: 0 1px 2px rgba(59, 35, 32, .05), 0 6px 18px rgba(235, 90, 80, .06);
  --sans: system-ui, -apple-system, "Apple SD Gothic Neo", "Segoe UI", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1210; --card: #2a1c19; --ink: #fbede8; --muted: #c4a49c; --line: #3d2a26; --field: #34231f;
    --accent: #ff7a6e; --accent-ink: #2a0c08; --soft: #46241f; --track: #46302b;
    --good: #ff8a7f; --bad: #a8968f; --grid: #36241f;
    --c-w: #e85e53; --c-f: #26a487; --c-m: #b9831f; --c-b: #8a7ee6;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  }
}
/* 확대 없음, 스크롤만 */
* { box-sizing: border-box; touch-action: pan-x pan-y; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 var(--sans); -webkit-text-size-adjust: 100%; }
main { max-width: 540px; margin: 0 auto; padding: calc(18px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom)); }
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.date { margin: 0 0 2px; font-size: 14px; color: var(--muted); }
h1 { font-size: 30px; font-weight: 800; line-height: 1.15; letter-spacing: -.02em; margin: 0; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--card); box-shadow: var(--shadow); color: var(--muted); }
.icon-btn svg { width: 22px; height: 22px; }

.card { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; }
.card h2 { font-size: 17px; font-weight: 800; margin: 0 0 10px; }
.sub { color: var(--muted); font-size: 14px; }
.btn { flex: none; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 18px; border-radius: 14px; background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.ghost { background: var(--field); color: var(--ink); }
.btn.small { min-height: 36px; padding: 0 14px; font-size: 15px; border-radius: 12px; }

/* 아래 탭 막대 */
nav.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; justify-content: center;
  background: color-mix(in srgb, var(--card) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
nav.tabbar button { flex: 1; max-width: 160px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; font-size: 12px; color: var(--muted); }
nav.tabbar svg { width: 26px; height: 26px; }
nav.tabbar button.on { color: var(--accent); font-weight: 600; }

/* ── 달력 ── */
.month-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.month-head h2 { margin: 0; font-size: 20px; font-weight: 800; }
.month-head .arrows { display: flex; gap: 6px; }
.month-head .arrows button { width: 38px; height: 38px; border-radius: 50%; background: var(--field); display: grid; place-items: center; }
.month-head .arrows svg { width: 20px; height: 20px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.stat { background: var(--field); border-radius: var(--r-sm); padding: 8px 10px; }
.stat b { display: block; font-weight: 800; font-size: 17px; line-height: 1.3; white-space: nowrap; }
.stat span { font-size: 12px; color: var(--muted); }
.wk, .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.wk { font-size: 12px; color: var(--muted); text-align: center; margin-bottom: 2px; }
.wk span:nth-child(7) { color: var(--accent); }
.day { position: relative; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 4px 0 3px; border-radius: var(--r-sm); min-height: 66px; }
.day .dn { font-size: 13px; line-height: 1.2; color: var(--muted); }
.day.today .dn { background: var(--accent); color: var(--accent-ink); border-radius: 9px; padding: 0 6px; font-weight: 700; }
.day.sel { background: var(--soft); }
.day.future { opacity: .45; }
.day svg.ring { width: 30px; height: 30px; transform: rotate(-90deg); }
.day .dm { font-size: 11px; line-height: 1.1; color: var(--ink); font-weight: 600; min-height: 12px; }
.day .ib { position: absolute; top: 14px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); opacity: .55; }
.legend-line { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 8px; }
.legend-line i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); opacity: .55; margin-right: 5px; vertical-align: 2px; }
.banner { display: flex; gap: 12px; align-items: center; background: var(--soft); border-radius: var(--r-sm); padding: 12px 14px; margin-bottom: 14px; font-size: 15px; }
.banner b { display: block; }
.banner .btn { flex: none; margin-left: auto; }
.tiles { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 8px; }
.tile { border-radius: var(--r-sm); background: var(--field); padding: 10px; }
.tile b { display: block; font-weight: 800; font-size: 22px; line-height: 1.2; }
.tile b small { font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 2px; }
.tile span { font-size: 12px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { font-size: 13px; padding: 3px 10px; border-radius: 99px; background: var(--soft); color: var(--ink); }
.chip.pick { font-size: 14px; padding: 6px 12px; }
.chip.pick.on { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
/* 운동 목록 (워치 / 내가 추가) */
.wo-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 36px; }
.wo-head h3 { margin: 0; font-size: 16px; font-weight: 800; }
.wo { list-style: none; margin: 6px 0 0; padding: 0; }
.wo li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.wo li:first-child { border-top: 0; }
.wo-dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.wo-dot.watch { background: transparent; box-shadow: inset 0 0 0 3px var(--accent); }
.wo-name { flex: 1; min-width: 0; }
.wo-note { display: block; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.wo-empty { margin: 4px 0 0; font-size: 14px; }
.wo-sep { height: 1px; background: var(--line); margin: 14px 0 10px; }
.wo .x { flex: none; width: 28px; height: 28px; border-radius: 50%; color: var(--muted); display: grid; place-items: center; }
.wo .x svg { width: 16px; height: 16px; }
.mine-form { margin-top: 8px; padding-top: 6px; }
.wo .src { flex: none; font-size: 11px; font-weight: 700; color: var(--accent); background: var(--soft); border-radius: 99px; padding: 2px 8px; }
/* 오늘 요약 (첫 화면 맨 위) */
.hero { padding: 18px 16px 14px; }
.hero-date { margin: 0 0 10px; font-size: 15px; font-weight: 800; color: var(--accent); }
.hero-top { display: flex; align-items: center; gap: 18px; }
.big-ring { position: relative; flex: none; width: 128px; height: 128px; }
.big-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.big-ring .in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.big-ring .in b { font-size: 36px; font-weight: 800; line-height: 1; letter-spacing: -.02em; }
.big-ring .in span { font-size: 13px; color: var(--muted); margin-top: 2px; }
.hero-facts { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-width: 0; }
.hero-facts b { font-size: 26px; font-weight: 800; line-height: 1.1; }
.hero-facts b + span { font-size: 13px; color: var(--muted); margin-left: 4px; }
.pill { font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 99px; background: var(--soft); color: var(--ink); }
.pill.done { background: var(--accent); color: var(--accent-ink); }
.edit-link { text-align: right; margin-top: 4px; }
.link { font-size: 13px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; padding: 6px 0; }
.ib-mini { display: block; width: 100%; text-align: left; padding: 2px 0; }
.ib-vals { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 14px; margin-top: 2px; }
.ib-vals b { font-weight: 800; }
.day .my { position: absolute; top: 5px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.legend-line i.lg-my { background: var(--accent); opacity: 1; }
.detail-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; }
.edit-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }

/* 입력칸 */
.fld { display: flex; flex-direction: column; gap: 3px; min-width: 0; font-size: 13px; color: var(--muted); }
.fld input { width: 100%; min-width: 0; height: 44px; padding: 0 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--field); font-size: 17px; color: var(--ink); }
.fld input[type=date] { display: block; max-width: 100%; -webkit-appearance: none; appearance: none; line-height: 42px; }
.fld input[type=date]::-webkit-date-and-time-value { text-align: left; }
.fld input:focus { outline: 0; border-color: var(--accent); }

/* ── 인바디 ── */
.metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
/* 인바디 한마디 */
.fb h3 { font-size: 15px; font-weight: 800; margin: 12px 0 4px; }
.fb ul { list-style: none; margin: 0; padding: 0; }
.fb li { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; font-size: 15px; line-height: 1.45; }
.fb .fb-ic { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 800; margin-top: 1px; }
.fb .fb-ok .fb-ic { background: var(--accent); color: var(--accent-ink); }
.fb .fb-tip .fb-ic { background: var(--field); color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }
.fb-note { margin: 10px 0 0; font-size: 12px; color: var(--muted); }
/* 그래프 수치 고르기 */
.ck-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
.ck { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; padding: 6px 12px; border-radius: 99px; background: var(--field); color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }
.ck i { width: 10px; height: 10px; border-radius: 50%; opacity: .45; }
.ck.on { background: var(--card); color: var(--ink); font-weight: 700; box-shadow: inset 0 0 0 2px var(--ink); }
.ck.on i { opacity: 1; }
.rg-row { display: flex; gap: 2px; background: var(--field); border-radius: 12px; padding: 3px; margin: 0 0 10px; }
.rg { flex: 1; font-size: 13px; padding: 5px 0; border-radius: 9px; color: var(--muted); }
.rg.on { background: var(--card); color: var(--ink); font-weight: 700; box-shadow: var(--shadow); }
.chart-wrap .band-lab { fill: var(--muted); font-size: 11px; }
.chart-wrap .band-lab.on { fill: var(--ink); font-weight: 700; }
.chart-wrap .vlab.last { font-size: 13px; font-weight: 800; }
.tip-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
.more { width: 100%; margin-top: 8px; }
.metric .bmi-cls { color: var(--accent); font-weight: 700; }
.metric { text-align: left; background: var(--card); border-radius: var(--r-sm); box-shadow: var(--shadow); padding: 12px 12px 10px; border: 2px solid transparent; }
.metric.on { border-color: var(--accent); }
.metric .lab { font-size: 13px; color: var(--muted); }
.metric .val { font-size: 24px; font-weight: 800; line-height: 1.2; letter-spacing: -.01em; }
.metric .val small { font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 1px; }
.delta { font-size: 13px; font-weight: 600; white-space: nowrap; }
.delta.good { color: var(--good); } .delta.bad { color: var(--bad); } .delta.same { color: var(--muted); }
.metric .since { font-size: 11px; color: var(--muted); margin-top: 2px; }
.chart-wrap { position: relative; }
.chart-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart-wrap .axis { fill: var(--muted); font-size: 11px; }
.chart-wrap .vlab { fill: var(--ink); font-size: 12px; font-weight: 600; }
.tip { position: absolute; pointer-events: none; transform: translate(-50%, calc(-100% - 12px)); background: var(--ink); color: var(--bg); font-size: 13px; line-height: 1.35; padding: 6px 10px; border-radius: 10px; white-space: nowrap; }
.tip .delta { color: inherit; }
.chart-sum { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 8px; font-size: 14px; color: var(--muted); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
.hist { list-style: none; margin: 0; padding: 0; }
.hist li { display: grid; grid-template-columns: 74px repeat(3, minmax(0, 1fr)) 28px; align-items: center; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; }
.hist li:first-child { border-top: 0; }
.hist .hd { font-size: 13px; color: var(--muted); }
.hist .hv b { font-weight: 600; }
.hist .hv .delta { display: block; font-size: 11px; }
.hist .head { font-size: 12px; color: var(--muted); padding-top: 0; }
.hist .x { width: 28px; height: 28px; border-radius: 50%; color: var(--muted); display: grid; place-items: center; }
.hist .x svg { width: 16px; height: 16px; }
.empty { text-align: center; color: var(--muted); padding: 18px 0 6px; font-size: 15px; }

/* ── 헬스 (초안) ── */
.draft { border: 2px dashed var(--line); background: transparent; box-shadow: none; }
.draft .tag { display: inline-block; font-size: 11px; font-weight: 700; color: var(--accent); background: var(--soft); border-radius: 6px; padding: 1px 7px; margin-bottom: 6px; }
.draft ul { margin: 6px 0 0; padding-left: 20px; color: var(--muted); font-size: 15px; }

/* ── 설정 창 ── */
dialog { width: min(540px, 100%); max-width: 100%; max-height: 92vh; margin: auto auto 0; padding: 0; border: 0; border-radius: 22px 22px 0 0; background: var(--bg); color: var(--ink); }
dialog::backdrop { background: rgba(0, 0, 0, .35); }
.sheet { padding: 18px 16px calc(24px + env(safe-area-inset-bottom)); overflow-y: auto; max-height: 92vh; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.sheet-head h2 { margin: 0; font-size: 22px; }
.url-box { font: 13px/1.4 ui-monospace, Menlo, monospace; word-break: break-all; background: var(--field); border-radius: 10px; padding: 10px; margin: 8px 0; user-select: all; -webkit-user-select: all; }
ol.steps { margin: 0; padding-left: 22px; font-size: 15px; }
ol.steps li { margin-bottom: 8px; }
ol.steps b { font-weight: 600; }
.field-tbl { width: 100%; border-collapse: collapse; font-size: 14px; margin: 6px 0; }
.field-tbl td { padding: 4px 6px; border-top: 1px solid var(--line); }
.field-tbl code { font: 13px ui-monospace, Menlo, monospace; background: var(--field); padding: 1px 5px; border-radius: 5px; }
.inline { display: flex; gap: 8px; align-items: flex-end; }
.inline .fld { flex: 1; }
/* ── 헬스 ── */
.plan-line { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.plan-line span { color: var(--ink); font-weight: 700; background: var(--field); border-radius: 99px; padding: 1px 8px; }
.plan-line span.ok { background: var(--soft); color: var(--accent); }
.pweek { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.pd { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 1px 7px; border-radius: 14px; background: var(--field); min-height: 76px; }
.pd-w { font-size: 11px; color: var(--muted); }
.pd-d { font-size: 15px; font-weight: 800; line-height: 1.1; }
.pd-i { font-size: 11px; font-weight: 700; line-height: 1.3; padding: 0 4px; border-radius: 6px; background: var(--card); max-width: 100%; overflow: hidden; white-space: nowrap; }
.pd-i.ok { background: var(--accent); color: var(--accent-ink); }
.pd-i.none { background: none; color: var(--line); }
.pd.today { box-shadow: inset 0 0 0 2px var(--accent); }
.pd.sel { background: var(--soft); }
.pd.done { background: var(--soft); }
.pedit { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.gx { border-top: 1px solid var(--line); padding: 12px 0 8px; }
.gx:first-of-type { border-top: 0; }
.gx-head { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 6px; }
.gx-name { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.gx-name b { font-size: 16px; font-weight: 800; }
.gx-grp { font-size: 12px; color: var(--accent); font-weight: 700; }
.gx-last { font-size: 12px; color: var(--muted); }
.gx-yt { font-size: 12px; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; align-self: flex-start; }
.gx .x { flex: none; width: 28px; height: 28px; border-radius: 50%; color: var(--muted); display: grid; place-items: center; }
.gx .x svg { width: 16px; height: 16px; }
.gs { display: flex; align-items: center; gap: 6px; padding: 4px 0; }
.gs-n { width: 22px; height: 22px; border-radius: 50%; background: var(--field); font-size: 12px; font-weight: 700; display: grid; place-items: center; flex: none; }
.gs input { width: 64px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--field); text-align: center; font-size: 17px; font-weight: 700; color: var(--ink); }
.gs input:focus { outline: 0; border-color: var(--accent); }
.gs-u { font-size: 13px; color: var(--muted); }
.gs-ok { margin-left: auto; width: 40px; height: 40px; border-radius: 50%; background: var(--field); color: var(--muted); font-size: 18px; font-weight: 800; box-shadow: inset 0 0 0 1px var(--line); }
.gs.done .gs-ok { background: var(--accent); color: var(--accent-ink); box-shadow: none; }
.gs.done .gs-n { background: var(--accent); color: var(--accent-ink); }
.gs.done input { background: var(--soft); border-color: transparent; }
.gx-foot { display: flex; gap: 14px; padding-left: 28px; }
.gym-end { display: flex; gap: 8px; margin-top: 12px; }
.gym-end .btn:last-child { flex: 1; }
.picker { margin-top: 8px; border-top: 1px solid var(--line); }
.pk-g h4 { margin: 12px 0 4px; font-size: 13px; color: var(--accent); }
.pk { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 4px 0; border-top: 1px solid var(--line); font-size: 15px; }
.pk span { flex: 1; }
.pk b { font-size: 13px; color: var(--accent); }
.pk.have b { color: var(--muted); font-weight: 500; }
.fig { flex: none; background: var(--field); border-radius: 14px; }
.fig .pr { stroke: var(--muted); fill: none; stroke-width: 2.5; stroke-linecap: round; opacity: .45; }
.fig .pr rect, .fig .pr polygon { fill: var(--muted); stroke: none; }
.fig .bd path, .fig .far path { stroke: var(--accent); stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.fig .far { opacity: .35; }
.fig .hd { fill: var(--accent); }
.fig .at path { stroke: var(--ink); fill: none; stroke-linecap: round; }
.fig .at circle { fill: var(--ink); }
.fig .at circle.pl { fill: none; stroke: var(--ink); stroke-width: 3; }
.fig .at path.cb { stroke: var(--muted); stroke-width: 1; }
#rest { position: fixed; left: 12px; right: 12px; bottom: calc(70px + env(safe-area-inset-bottom)); z-index: 6; max-width: 516px; margin: 0 auto;
  display: flex; align-items: center; gap: 10px; background: var(--ink); color: var(--bg); border-radius: 16px; padding: 10px 14px; box-shadow: 0 6px 20px rgba(0,0,0,.2); }
#rest b { font-size: 22px; font-weight: 800; min-width: 52px; }
#rest i { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.2); overflow: hidden; }
#rest s { display: block; height: 100%; background: var(--accent); text-decoration: none; }
#rest button { font-size: 13px; font-weight: 700; color: var(--bg); padding: 6px 4px; }
#toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 12px; font-size: 15px; z-index: 20; white-space: nowrap; }
</style>
</head>
<body>
<main>
  <header>
    <div><p class="date" id="today"></p><h1 id="title">내 건강</h1></div>
    <button class="icon-btn" id="openSettings" aria-label="설정">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <section id="v-cal"></section>
  <section id="v-ib" hidden></section>
  <section id="v-gym" hidden></section>
</main>

<nav class="tabbar">
  <button data-tab="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>오늘</button>
  <button data-tab="ib"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M5 16l5-5 4 3 6-7"/></svg>인바디</button>
  <button data-tab="gym"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>헬스</button>
</nav>

<dialog id="settings"><div class="sheet" id="sheet"></div></dialog>
<div id="toast" hidden></div>
<div id="rest" hidden><span>휴식</span><b class="num">1:00</b><i><s></s></i><button data-act="rest-add">+30초</button><button data-act="rest-skip">건너뛰기</button></div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// 내 건강
//  · 달력: Apple Watch 기록. 아이폰 '단축어' 자동화가 운동이 끝날 때 오늘 운동 시간·활동 칼로리·걸음 수를
//    동기화 서버(worker/)로 보내면, 앱이 열릴 때와 1분마다 받아 옴.
//  · 인바디: 몸무게(kg)·근육량(%)·체지방(%) 기록과 변화 그래프.
//  · 헬스: 틀 구상 중.
// 모든 기록은 서버의 data:{연결 키} 하나에 들어 있고, 이 휴대폰에도 복사본을 둠(오프라인용).
// ─────────────────────────────────────────────────────────────────────────────
const API = 'https://my-health-sync.weekly-meals-reader.workers.dev';
const LS = 'my-health';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const WD = ['월', '화', '수', '목', '금', '토', '일'];
const WD_SUN = ['일', '월', '화', '수', '목', '금', '토'];

// ── 저장 상태 ──
const S = (() => { try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch { return {}; } })();
if (!S.key) S.key = newKey();
S.data = Object.assign({ days: {}, inbody: [], gym: {}, mine: {} }, S.data);
S.goal = S.goal || 30;
S.tab = S.tab || 'cal';
S.chartKeys = S.chartKeys || ['w'];
// 적다 만 입력칸 (다른 앱에 다녀오거나 앱이 다시 켜져도 그대로 남게)
S.drafts = S.drafts || {};
const draft = (k, def = '') => esc(S.drafts[k] ?? def);
const clearDrafts = prefix => { for (const k of Object.keys(S.drafts)) if (k.startsWith(prefix)) delete S.drafts[k]; };
const save = () => { try { localStorage.setItem(LS, JSON.stringify(S)); } catch {} };
save();

function newKey() {
  const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
  return Array.from(crypto.getRandomValues(new Uint8Array(32)), b => abc[b % abc.length]).join('');
}
const pushUrl = () => `${API}/h/${S.key}`;

// ── 날짜 ──
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const todayStr = () => ymd(new Date());
const longDate = s => { const d = parseYmd(s); return `${d.getMonth() + 1}월 ${d.getDate()}일 (${WD_SUN[d.getDay()]})`; };
const shortDate = s => { const d = parseYmd(s); return `${String(d.getFullYear()).slice(2)}.${d.getMonth() + 1}.${d.getDate()}`; };
const fmtInt = n => Number(n).toLocaleString('ko-KR');

let view = (() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); })();
let sel = todayStr();
const stopEditing = () => { clearDrafts('day-'); save(); };

// ── 서버와 주고받기 ──
let syncing = false;
async function sync() {
  if (syncing) return;
  syncing = true;
  try {
    // 아직 못 보낸 인바디·헬스 기록이 있으면 먼저 보냄 (안 그러면 서버 값이 덮어씀)
    if (S.pending) await post({});
    await chain;
    if (S.pending) return;
    const r = await fetch(`${API}/d/${S.key}`, { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    if (S.pending) return; // 받는 사이에 새로 적은 게 있으면 이번 것은 버림
    S.data = Object.assign({ days: {}, inbody: [], gym: {}, mine: {} }, d);
    S.synced = Date.now();
    save();
    // 입력 중이면 화면을 다시 그리지 않음 (키보드가 닫히지 않게)
    if (!(document.activeElement && document.activeElement.matches('input'))) render();
  } catch { /* 오프라인: 휴대폰에 있는 복사본으로 계속 */ }
  finally { syncing = false; }
}
// 저장은 한 줄로 차례차례 (빠르게 여러 번 눌러도 늦게 온 답이 새 기록을 덮지 않게)
let chain = Promise.resolve();
function post(body) {
  S.pending = { ...(S.pending || {}), ...body };
  save();
  return (chain = chain.catch(() => {}).then(flush));
}
async function flush() {
  const send = S.pending;
  if (!send) return;
  const r = await fetch(`${API}/d/${S.key}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(send) });
  if (!r.ok) throw new Error(r.status);
  const data = await r.json();
  // 보내는 동안 또 바뀐 게 없을 때만 서버 값을 받아들임 (있으면 다음 차례에 그것까지 보냄)
  if (S.pending === send) { S.pending = null; S.data = Object.assign({ days: {}, inbody: [], gym: {}, mine: {} }, data); }
  save();
}
const saveSoon = body => post(body).then(render).catch(() => toast('인터넷 연결되면 저장돼요'));

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 2200);
}

// ── 그리기 ──
function render() {
  $('#today').textContent = longDate(todayStr()).replace(/^/, `${new Date().getFullYear()}년 `);
  for (const b of document.querySelectorAll('nav.tabbar button')) b.classList.toggle('on', b.dataset.tab === S.tab);
  $('#v-cal').hidden = S.tab !== 'cal'; $('#v-ib').hidden = S.tab !== 'ib'; $('#v-gym').hidden = S.tab !== 'gym';
  $('#title').textContent = { cal: '내 건강', ib: '인바디', gym: '헬스' }[S.tab];
  if (S.tab === 'cal') renderCal();
  if (S.tab === 'ib') renderIb();
  if (S.tab === 'gym') renderGym();
}

const ARROW_L = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>';
const ARROW_R = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>';
const X_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';

// 운동 링: 하루 목표(분)를 채운 만큼 초록 원이 참
function ring(min) {
  const r = 12, c = 2 * Math.PI * r, p = Math.min((min || 0) / S.goal, 1);
  return `<svg class="ring" viewBox="0 0 30 30" aria-hidden="true">
    <circle cx="15" cy="15" r="${r}" fill="none" stroke="var(--track)" stroke-width="4"/>
    ${p > 0 ? `<circle cx="15" cy="15" r="${r}" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-dasharray="${(c * p).toFixed(2)} ${c.toFixed(2)}"/>` : ''}
  </svg>`;
}

// 그날 운동한 시간: 워치 기록과 내가 추가한 운동 중 큰 쪽 (워치를 차고 한 운동을 또 적어도 두 번 세지 않게)
const mineOf = ds => (S.data.mine && S.data.mine[ds]) || [];
const dayMin = ds => Math.max((S.data.days[ds] || {}).min || 0, mineOf(ds).reduce((a, x) => a + (x.min || 0), 0));
const hm = d => `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;

// 첫 화면: 위에는 오늘 요약(크게), 아래에 달력. 달력에서 다른 날을 누르면 달력 밑에 그날 자세히.
function renderCal() {
  const today = todayStr();
  const neverSynced = !Object.values(S.data.days).some(r => r.at && !r.manual);
  $('#v-cal').innerHTML = `
    ${neverSynced ? `<div class="banner"><div><b>Apple Watch 연결하기</b>운동이 끝나면 여기로 바로 올라오게 설정해요.</div><button class="btn small" data-act="setup">설정 방법</button></div>` : ''}
    ${todayHero(today)}
    ${calendarCard(today)}
    ${sel !== today ? dayDetail(sel) : ''}`;
}

// 큰 링: 하루 목표를 채운 만큼
function bigRing(min) {
  const r = 50, c = 2 * Math.PI * r, p = Math.min(min / S.goal, 1);
  return `<div class="big-ring"><svg viewBox="0 0 120 120" aria-hidden="true">
      <circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--track)" stroke-width="12"/>
      ${p > 0 ? `<circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${(c * p).toFixed(2)} ${c.toFixed(2)}"/>` : ''}
    </svg><div class="in"><b class="num">${min}</b><span>/ ${S.goal}분</span></div></div>`;
}

function todayHero(ds) {
  const rec = S.data.days[ds] || {}, min = dayMin(ds);
  const status = min >= S.goal ? '오늘 목표 달성!' : min > 0 ? `목표까지 ${S.goal - min}분` : '아직 운동 전이에요';
  const last = ibSorted().at(-1), prev = last && ibSorted().at(-2);
  const ibLine = last ? `<button class="ib-mini" data-tab="ib">
      <span class="sub">최근 인바디 · ${shortDate(last.date)}</span>
      <span class="ib-vals num">${['w', 'm', 'f'].filter(k => last[k] != null).map(k => `<span>${METRICS[k].lab} <b>${f1(last[k])}${METRICS[k].unit}</b> ${prev && prev[k] != null ? deltaHtml(last[k] - prev[k], k) : ''}</span>`).join('')}</span>
    </button>` : '';
  return `<div class="card hero">
    <p class="hero-date">오늘 · ${longDate(ds)}</p>
    <div class="hero-top">
      ${bigRing(min)}
      <div class="hero-facts">
        <span class="pill ${min >= S.goal ? 'done' : ''}">${status}</span>
        ${planOf(ds).length ? `<div class="plan-line">오늘 계획 ${planOf(ds).map(n => `<span class="${didOn(ds, n) ? 'ok' : ''}">${didOn(ds, n) ? '✓ ' : ''}${esc(n)}</span>`).join('')}</div>` : ''}
        <div><b class="num">${rec.steps != null ? fmtInt(rec.steps) : '–'}</b><span>걸음</span></div>
        ${(() => { const k = mineOf(ds).reduce((a, x) => a + (x.kcal || 0), 0); return k ? `<div><b class="num">${fmtInt(k)}</b><span>운동 kcal</span></div>` : ''; })()}
      </div>
    </div>
    ${editForm(ds)}
    <div class="wo-sep"></div>
    ${workoutsBlock(ds, '오늘 한 운동')}
    ${ibLine ? `<div class="wo-sep"></div>${ibLine}` : ''}
  </div>`;
}

function calendarCard(today) {
  const D = S.data.days, y = view.getFullYear(), m = view.getMonth();
  const first = new Date(y, m, 1), off = (first.getDay() + 6) % 7, n = new Date(y, m + 1, 0).getDate();
  const ibDates = new Set(S.data.inbody.map(e => e.date));
  let cells = '', active = 0;
  for (let i = 0; i < off; i++) cells += '<span></span>';
  for (let d = 1; d <= n; d++) {
    const ds = ymd(new Date(y, m, d)), min = dayMin(ds), mine = mineOf(ds).length;
    if (min > 0 || mine) active++;
    const cls = ['day', ds === today && 'today', ds === sel && ds !== today && 'sel', ds > today && 'future'].filter(Boolean).join(' ');
    cells += `<button class="${cls}" data-day="${ds}" aria-label="${longDate(ds)}${min ? `, 운동 ${min}분` : ''}${mine ? `, 운동 기록 ${mine}개` : ''}">
      <span class="dn num">${d}</span>${ds > today ? '<svg class="ring"></svg>' : ring(min)}
      <span class="dm num">${min ? min + '분' : ''}</span>${mine ? '<i class="my"></i>' : ''}${ibDates.has(ds) ? '<i class="ib"></i>' : ''}</button>`;
  }
  return `<div class="card">
    <div class="month-head">
      <div><h2>${y}년 ${m + 1}월</h2><span class="sub" style="font-size:13px">${active}일 운동</span></div>
      <div class="arrows"><button data-act="prev" aria-label="지난달">${ARROW_L}</button><button data-act="next" aria-label="다음 달">${ARROW_R}</button></div>
    </div>
    <div class="wk">${WD.map(w => `<span>${w}</span>`).join('')}</div>
    <div class="grid" id="grid">${cells}</div>
    <div class="legend-line"><span>링 = 하루 목표 ${S.goal}분 중 채운 만큼</span><span><i class="lg-my"></i>운동 기록</span><span><i></i>인바디 잰 날</span></div>
  </div>`;
}

// 워치 운동 이름: 영어로 오면 한국어로 (모르는 이름은 그대로)
const WORKOUT_KO = [
  [/traditional strength/i, '근력 운동'], [/functional strength/i, '기능성 근력 운동'], [/core/i, '코어 운동'],
  [/high intensity|hiit/i, '고강도 인터벌'], [/outdoor walk/i, '실외 걷기'], [/indoor walk/i, '실내 걷기'], [/walk/i, '걷기'],
  [/outdoor run/i, '실외 달리기'], [/indoor run/i, '실내 달리기'], [/run/i, '달리기'], [/hik/i, '하이킹'],
  [/outdoor cycl/i, '실외 사이클'], [/indoor cycl/i, '실내 사이클'], [/cycl/i, '사이클'], [/elliptical/i, '일립티컬'],
  [/rowing/i, '로잉'], [/stair/i, '계단 오르기'], [/yoga/i, '요가'], [/pilates/i, '필라테스'], [/pool swim/i, '수영(실내)'],
  [/open water/i, '수영(실외)'], [/swim/i, '수영'], [/dance/i, '댄스'], [/cool ?down/i, '쿨다운'], [/flexibility|stretch/i, '스트레칭'],
  [/mind/i, '마음 챙김'], [/tennis/i, '테니스'], [/badminton/i, '배드민턴'], [/^other$/i, '기타'],
];
const workoutName = x => { for (const [re, ko] of WORKOUT_KO) if (re.test(x)) return ko; return x; };
const QUICK = ['필라테스', '러닝', '헬스', '자전거', '홈트레이닝'];

// 그날 운동 목록: 워치 운동 + 내가 추가한 운동을 한 목록으로, 출처 표시와 함께
function workoutsBlock(ds, title) {
  const rec = S.data.days[ds] || {}, watch = rec.watch || [], mine = mineOf(ds);
  const future = ds > todayStr(), open = S.drafts['mine-open'] === ds;
  const recent = [...new Set(Object.values(S.data.mine || {}).flat().map(x => x.name))].filter(n => !QUICK.includes(n)).slice(-6);
  const items = [
    ...watch.map(x => `<li><span class="wo-dot watch"></span><span class="wo-name">${esc(workoutName(x))}</span><span class="src">워치</span></li>`),
    ...mine.map(x => `<li><span class="wo-dot"></span><span class="wo-name">${esc(x.name)}${x.min || x.kcal ? ` <span class="sub num">${x.min ? `· ${x.min}분 ` : ''}${x.kcal ? `· ${fmtInt(x.kcal)}kcal` : ''}</span>` : ''}${x.note ? `<span class="wo-note">${esc(x.note)}</span>` : ''}</span>
      <button class="x" data-del-mine="${esc(x.id)}" data-date="${ds}" aria-label="${esc(x.name)} 지우기">${X_ICON}</button></li>`),
  ];
  return `<div class="wo-head"><h3>${title}</h3>${!future && !open ? `<button class="btn small" data-act="mine-open" data-date="${ds}">＋ 운동 추가</button>` : ''}</div>
    ${items.length ? `<ul class="wo">${items.join('')}</ul>` : open ? '' : ''}
    ${open ? `<div class="mine-form">
      <div class="chips">${[...QUICK, ...recent].map(n => `<button class="chip pick ${S.drafts['mine-name'] === n ? 'on' : ''}" data-pick="${esc(n)}">${esc(n)}</button>`).join('')}</div>
      <div class="form-grid" style="margin-top:10px">
        <label class="fld" style="grid-column:1/-1">운동 이름<input id="m-name" data-draft="mine-name" value="${draft('mine-name')}" placeholder="위에서 고르거나 직접 적기"></label>
        <label class="fld">시간 (분)<input id="m-min" data-draft="mine-min" value="${draft('mine-min')}" inputmode="numeric" placeholder="예: 45"></label>
        <label class="fld">칼로리 (kcal)<input id="m-kcal" data-draft="mine-kcal" value="${draft('mine-kcal')}" inputmode="numeric" placeholder="예: 320"></label>
      </div>
      <label class="fld">메모 (선택)<input id="m-note" data-draft="mine-note" value="${draft('mine-note')}" placeholder="예: 스쿼트 40kg 5세트"></label>
      <div class="detail-foot"><span></span><span style="display:flex;gap:8px"><button class="btn small ghost" data-act="mine-cancel">취소</button><button class="btn small" data-act="mine-save" data-date="${ds}">추가</button></span></div>
    </div>` : ''}`;
}

// 워치 숫자 직접 고치기 (그날 하나만 열림)
function editForm(ds) {

    <div class="edit-row">
      <label class="fld">워치 운동(분)<input id="e-min" data-draft="day-min" inputmode="numeric" value="${draft('day-min', rec?.min ?? '')}"></label>
      <label class="fld">걸음<input id="e-steps" data-draft="day-steps" inputmode="numeric" value="${draft('day-steps', rec?.steps ?? '')}"></label>
    </div>
    <div class="detail-foot"><button class="btn small ghost" data-act="del-day" data-date="${ds}">지우기</button>
      <span style="display:flex;gap:8px"><button class="btn small ghost" data-act="cancel">취소</button><button class="btn small" data-act="save-day" data-date="${ds}">저장</button></span></div>`;
  return ds > todayStr() ? '' : `<div class="edit-link"><button class="link" data-act="edit" data-date="${ds}">숫자 직접 고치기</button></div>`;

// 달력에서 고른 다른 날
function dayDetail(ds) {
  const rec = S.data.days[ds], ib = S.data.inbody.find(e => e.date === ds), mine = mineOf(ds);
  const has = rec && (rec.min != null || rec.steps != null);
  const t = (v, unit, lab) => `<div class="tile"><b class="num">${v == null ? '–' : fmtInt(v)}<small>${unit}</small></b><span>${lab}</span></div>`;
  let body = has
    ? `<div class="tiles">${t(rec.min, '분', mine.length ? '워치 운동 시간' : '운동 시간')}${t(rec.steps, '', '걸음')}</div>`
    : `<p class="sub" style="margin:0">${ds > todayStr() ? '아직 오지 않은 날이에요.' : '이날은 워치 기록이 없어요.'}</p>`;
  if (ib) body += `<p class="sub" style="margin:10px 0 0">인바디 · ${[ib.w != null && f1(ib.w) + 'kg', ib.m != null && '근육 ' + f1(ib.m) + '%', ib.f != null && '체지방 ' + f1(ib.f) + '%'].filter(Boolean).join(' · ')}</p>`;
  return `<div class="card" id="day-detail"><h2>${longDate(ds)}</h2>${body}${editForm(ds)}<div class="wo-sep"></div>${workoutsBlock(ds, '운동')}</div>`;
}

// ── 인바디 ──
const METRICS = {
  w: { lab: '몸무게', unit: 'kg', better: -1 },   // 줄면 좋음
  m: { lab: '근육량', unit: '%', better: 1 },     // 늘면 좋음
  f: { lab: '체지방', unit: '%', better: -1 },    // 줄면 좋음
  b: { lab: 'BMI', unit: '', better: 0 },          // 몸무게와 키로 자동 계산. 좋고 나쁨은 범위로 판단하므로 변화는 회색으로
};
// BMI 범위 (대한비만학회 기준)
const bmiClass = b => b < 18.5 ? '저체중' : b < 23 ? '정상' : b < 25 ? '비만 전단계' : b < 30 ? '비만 1단계' : b < 35 ? '비만 2단계' : '비만 3단계';
const heightCm = () => (S.data.profile && S.data.profile.height) || null;
const bmiOf = w => heightCm() ? r1(w / (heightCm() / 100) ** 2) : null;
const r1 = v => Math.round(v * 10) / 10;
const f1 = v => Number(v).toFixed(1); // 29 → 29.0
function deltaHtml(d, key, suffix = '') {
  if (d == null) return '';
  d = r1(d);
  if (d === 0) return `<span class="delta same">± 0${suffix}</span>`;
  const cls = !METRICS[key].better ? 'same' : d * METRICS[key].better > 0 ? 'good' : 'bad';
  return `<span class="delta ${cls}">${d > 0 ? '▲ +' : '▼ −'}${Math.abs(d).toFixed(1)}${suffix}</span>`;
}
const ibSorted = () => [...S.data.inbody].sort((a, b) => a.date.localeCompare(b.date) || (a.id || '').localeCompare(b.id || ''));
const series = k => k === 'b'
  ? (heightCm() ? ibSorted().filter(e => e.w != null).map(e => ({ ...e, b: bmiOf(e.w) })) : [])
  : ibSorted().filter(e => e[k] != null);

// ── 인바디 한마디 (AI 없이 규칙으로) ──
// 지난번과 비교한 변화, 연속 기록, 처음과 비교, BMI·체지방 범위, 최근 4주 운동한 날을 보고
// 칭찬은 최대 3개, 보완할 점은 최대 3개. 체지방 표준 범위는 여성 기준(인바디 18–28%).
function ibFeedback() {
  const good = [], tips = [];
  const s = ibSorted();
  if (!s.length) return { good, tips };
  const pick = k => series(k);
  const last = k => pick(k).at(-1), prev = k => pick(k).at(-2), first = k => pick(k)[0];
  const d = k => (last(k) && prev(k)) ? r1(last(k)[k] - prev(k)[k]) : null;
  const sinceFirst = k => pick(k).length > 1 ? r1(last(k)[k] - first(k)[k]) : null;
  // 같은 방향으로 몇 번 연속 바뀌었는지 (dir: -1 줄어듦, +1 늘어남)
  const streak = (k, dir) => { const v = pick(k).map(e => e[k]); let n = 0; for (let i = v.length - 1; i > 0 && (v[i] - v[i - 1]) * dir > 0.05; i--) n++; return n; };
  const pp = x => Math.abs(x).toFixed(1);
  const dW = d('w'), dM = d('m'), dF = d('f');

  // 칭찬
  if (streak('f', -1) >= 3) good.push(`체지방이 ${streak('f', -1)}번 연속 줄었어요. 흐름이 아주 좋아요!`);
  else if (dF != null && dF <= -0.2) good.push(`체지방이 지난번보다 ${pp(dF)}%p 줄었어요. 잘하고 있어요!`);
  if (streak('m', 1) >= 3) good.push(`근육량이 ${streak('m', 1)}번 연속 늘었어요. 근력 운동 효과가 보여요!`);
  else if (dM != null && dM >= 0.2) good.push(`근육량이 지난번보다 ${pp(dM)}%p 늘었어요. 근력 운동이 잘 되고 있어요.`);
  if (dW != null && dW <= -0.3 && dM != null && dM >= 0) good.push(`근육은 지키면서 몸무게가 ${pp(dW)}kg 줄었어요. 가장 좋은 방향이에요.`);
  const fF = sinceFirst('f');
  if (fF != null && fF <= -1 && pick('f').length >= 3) good.push(`처음(${shortDate(first('f').date)})보다 체지방이 ${pp(fF)}%p 줄었어요.`);
  const lf = last('f');
  if (lf && lf.f >= 18 && lf.f <= 28) good.push(`체지방률 ${f1(lf.f)}%로 표준 범위(18–28%) 안이에요.`);
  const lb = last('b'), pb = prev('b');
  if (lb && lb.b >= 18.5 && lb.b < 23 && pb && pb.b >= 23) good.push(`BMI ${f1(lb.b)} · 정상 범위에 들어왔어요!`);

  // 최근 4주 운동한 날
  const today = parseYmd(todayStr());
  let active = 0;
  for (let i = 0; i < 28; i++) { const ds = ymd(new Date(today.getFullYear(), today.getMonth(), today.getDate() - i)); if (dayMin(ds) > 0 || mineOf(ds).length) active++; }
  if (active >= 12) good.push(`최근 4주 동안 ${active}일 운동했어요. 꾸준함이 최고예요!`);

  // 보완할 점
  if (dM != null && dM <= -0.2) tips.push(`근육량이 ${pp(dM)}%p 줄었어요. 헬스·필라테스 같은 근력 운동을 주 2–3회 넣고, 끼니마다 단백질(달걀·두부·살코기)을 챙겨 보세요.`);
  if (dF != null && dF >= 0.2) tips.push(`체지방이 ${pp(dF)}%p 늘었어요. 러닝·자전거 같은 유산소를 주 150분 정도로 늘려 보세요.`);
  if (dW != null && dW <= -0.5 && dM != null && dM <= -0.2) tips.push('몸무게와 함께 근육도 줄었어요. 너무 적게 먹고 있지 않은지 확인해 보세요.');
  if (dW != null && dW >= 0.5 && dF != null && dF >= 0.2) tips.push('몸무게와 체지방이 함께 늘었어요. 간식이나 늦은 저녁을 한 번 점검해 보세요.');
  if (lf && lf.f > 28 && !(dF != null && dF >= 0.2)) tips.push(`체지방률 ${f1(lf.f)}%는 표준(18–28%)보다 조금 높아요. 근력 + 유산소를 함께 하면 가장 빨리 내려가요.`);
  if (lb && lb.b >= 23) {
    const target = r1(22.9 * (heightCm() / 100) ** 2);
    tips.push(`BMI ${f1(lb.b)} · ${bmiClass(lb.b)} 범위예요. 정상(22.9 이하)까지 약 ${pp(last('w').w - target)}kg 남았어요.`);
  }
  if (lb && lb.b < 18.5) tips.push(`BMI ${f1(lb.b)} · 저체중 범위예요. 식사량을 조금 늘리고 근력 운동으로 근육을 키워 보세요.`);
  if (active < 8) tips.push(`최근 4주 동안 운동한 날이 ${active}일이에요. 주 3일을 목표로 해 볼까요?`);
  const gap = Math.round((today - parseYmd(s.at(-1).date)) / 864e5);
  if (gap > 35) tips.push(`마지막 측정이 ${gap}일 전이에요. 한 달에 한 번 재면 변화를 보기 좋아요.`);

  if (!good.length && s.length > 1) good.push('큰 변화 없이 잘 유지하고 있어요. 지금처럼 꾸준히!');
  if (s.length === 1) good.unshift('첫 기록을 남겼어요! 다음 측정부터 변화를 알려 드릴게요.');
  return { good: good.slice(0, 3), tips: tips.slice(0, 3) };
}

function feedbackCard() {
  const { good } = ibFeedback();
  if (!good.length) return '';
  const li = (cls, icon, t) => `<li class="${cls}"><span class="fb-ic" aria-hidden="true">${icon}</span><span>${esc(t)}</span></li>`;
  return `<div class="card fb">
    <h2>이번 결과 한마디</h2>
    ${good.length ? `<ul>${good.map(t => li('fb-ok', '✓', t)).join('')}</ul>` : ''}
  </div>`;
}

// 그래프에 넣을 수치 (순서와 색 고정: 몸무게·체지방·근육량·BMI — 색약 구분까지 검사한 4색)
const CHART_KEYS = ['w', 'f', 'm', 'b'];
const chartKeys = () => {
  const ks = (S.chartKeys || ['w']).filter(k => CHART_KEYS.includes(k) && (k !== 'b' || heightCm()));
  return ks.length ? ks : ['w']; // 키를 아직 모르면 BMI 대신 몸무게
};
let ibShowAll = false;

function renderIb() {
  const card = k => {
    const s = series(k), M = METRICS[k];
    const last = s[s.length - 1], prev = s[s.length - 2];
    if (k === 'b' && !heightCm()) return `<button class="metric" data-act="height">
      <div class="lab">BMI</div><div class="val" style="font-size:17px">키 입력</div>
      <div class="since">키를 적으면 자동 계산돼요</div></button>`;
    const on = chartKeys().length === 1 && chartKeys()[0] === k;
    return `<button class="metric ${on ? 'on' : ''}" data-metric="${k}">
      <div class="lab">${M.lab}${k === 'b' && last ? ` · <span class="bmi-cls">${bmiClass(last.b)}</span>` : ''}</div>
      <div class="val num">${last ? f1(last[k]) : '–'}<small>${M.unit}</small></div>
      ${prev ? deltaHtml(last[k] - prev[k], k) : '<span class="delta same">&nbsp;</span>'}
      <div class="since">${prev ? '지난번보다' : s.length ? '첫 기록' : '기록 없음'}</div>
    </button>`;
  };
  const list = ibSorted().reverse();
  const shown = ibShowAll ? list : list.slice(0, 5);
  const prevOf = (e, k) => { const s = series(k); const i = s.indexOf(e); return i > 0 ? s[i - 1][k] : null; };
  const cell = (e, k) => { const p = prevOf(e, k); return `<span class="hv num">${e[k] == null ? '–' : `<b>${f1(e[k])}</b>`}${e[k] != null && p != null ? deltaHtml(e[k] - p, k) : ''}</span>`; };
  const keys = chartKeys(), multi = keys.length > 1;

  // 오늘 결과를 아직 안 적었으면 적는 칸이 맨 위, 적었으면 맨 아래
  const doneToday = S.data.inbody.some(e => e.date === todayStr());
  const form = `<div class="card">
      <h2>새 결과 적기</h2>
      <div class="form-grid">
        <label class="fld">잰 날<input type="date" id="i-date" data-draft="ib-date" value="${draft('ib-date', todayStr())}" max="${todayStr()}"></label>
        <label class="fld">몸무게 (kg)<input id="i-w" data-draft="ib-w" value="${draft('ib-w')}" inputmode="decimal" placeholder="예: 62.4"></label>
        <label class="fld">근육량 (%)<input id="i-m" data-draft="ib-m" value="${draft('ib-m')}" inputmode="decimal" placeholder="예: 38.5"></label>
        <label class="fld">체지방 (%)<input id="i-f" data-draft="ib-f" value="${draft('ib-f')}" inputmode="decimal" placeholder="예: 27.0"></label>
      </div>
      <button class="btn" style="width:100%" data-act="add-ib">저장</button>
    </div>`;

  $('#v-ib').innerHTML = `
    ${doneToday ? '' : form}
    <div class="metrics">${card('w')}${card('m')}${card('f')}${card('b')}</div>
    ${feedbackCard()}
    <div class="card">
      <h2>${multi ? '처음 기록 대비 변화' : `${METRICS[keys[0]].lab} 변화${METRICS[keys[0]].unit ? ` <span class="sub">(${METRICS[keys[0]].unit})</span>` : ''}`}</h2>
      <div class="ck-row">${CHART_KEYS.map(k => {
        const off = k === 'b' && !heightCm();
        return `<button class="ck ${keys.includes(k) ? 'on' : ''}" data-ck="${k}" ${off ? 'data-act="height"' : ''} aria-pressed="${keys.includes(k)}"><i style="background:var(--c-${k})"></i>${METRICS[k].lab}</button>`;
      }).join('')}</div>
      <div class="rg-row">${RANGES.map(([id, lab]) => `<button class="rg ${(S.chartRange || 'all') === id ? 'on' : ''}" data-range="${id}">${lab}</button>`).join('')}</div>
      ${keys.length === 1 && keys[0] === 'b' ? `<p class="sub" style="margin:0 0 6px;font-size:13px">키 ${heightCm()}cm 기준 (대한비만학회) · <button class="link" data-act="height">키 바꾸기</button></p>` : ''}
      ${multi ? '<p class="sub" style="margin:0 0 6px;font-size:13px">보는 기간의 첫 기록을 0으로 놓고 겹쳐 봐요 (몸무게 kg, 체지방·근육량 %p, BMI 점)</p>' : ''}
      ${chartHtml(keys)}
    </div>
    <div class="card">
      <h2>지난 기록</h2>
      ${list.length ? `<ul class="hist">
        <li class="head"><span>날짜</span><span>몸무게</span><span>근육량</span><span>체지방</span><span></span></li>
        ${shown.map(e => `<li><span class="hd num">${shortDate(e.date)}</span>${cell(e, 'w')}${cell(e, 'm')}${cell(e, 'f')}
          <button class="x" data-del-ib="${esc(e.id)}" aria-label="${shortDate(e.date)} 기록 지우기">${X_ICON}</button></li>`).join('')}
      </ul>
      ${list.length > 5 ? `<button class="btn ghost small more" data-act="ib-more">${ibShowAll ? '최근 5개만 보기' : `이전 기록 ${list.length - 5}개 더 보기`}</button>` : ''}`
      : '<p class="empty">아직 기록이 없어요. 위에 첫 결과를 적어 보세요.</p>'}
    </div>
    ${doneToday ? form : ''}`;
  bindChart();
}

// 선 그래프. 하나만 고르면 실제 값, 여러 개면 각자 (보는 기간의) 첫 기록 대비 변화로 겹침.
// BMI 하나만 볼 때는 18.5 / 23 / 25 / 30 기준선과 범위 띠를 깔아서 정상 범위 안인지 바로 보이게.
// 숫자는 일부 점에만(하나: 처음·마지막·최고·최저 / 여럿: 선 끝), 점을 누르면 그날 값 전부.
const RANGES = [['3m', '3개월', 3], ['6m', '6개월', 6], ['1y', '1년', 12], ['all', '전체', 0]];
const BMI_BANDS = [
  { from: 0, to: 18.5, lab: '저체중', fill: 'var(--c-b)' },
  { from: 18.5, to: 23, lab: '정상', fill: 'var(--c-f)' },
  { from: 23, to: 25, lab: '비만 전단계', fill: 'var(--c-m)' },
  { from: 25, to: 30, lab: '비만 1단계', fill: 'var(--c-w)' },
  { from: 30, to: 99, lab: '비만 2단계 이상', fill: 'var(--c-w)' },
];
let chartPts = [];
function chartHtml(keys) {
  keys = keys.filter(k => series(k).length);
  if (!keys.length) return '<p class="empty">기록을 적으면 여기에 그래프가 그려져요.</p>';
  const multi = keys.length > 1, bmi = !multi && keys[0] === 'b';
  const months = (RANGES.find(r => r[0] === (S.chartRange || 'all')) || RANGES[3])[2];
  const now = parseYmd(todayStr());
  const cut = months ? new Date(now.getFullYear(), now.getMonth() - months, now.getDate()).getTime() : -Infinity;

  const lines = keys.map(k => {
    const s = series(k), all = s.map((e, i) => ({ t: parseYmd(e.date).getTime(), date: e.date, raw: e[k], prev: i ? s[i - 1][k] : null }));
    const pts = all.filter(p => p.t >= cut);
    const base = pts.length ? pts[0].raw : 0;
    pts.forEach(p => (p.v = multi ? r1(p.raw - base) : p.raw));
    return { k, pts };
  }).filter(l => l.pts.length);
  if (!lines.length) return '<p class="empty">이 기간에는 기록이 없어요. 기간을 넓혀 보세요.</p>';

  const W = 340, H = 220, L = 36, R = multi ? 74 : bmi ? 66 : 14, T = 18, B = 28;
  const ts = lines.flatMap(l => l.pts.map(p => p.t));
  let t0 = Math.min(...ts), t1 = Math.max(...ts);
  if (t0 === t1) { t0 -= 864e5 * 15; t1 += 864e5 * 15; }
  const vs = lines.flatMap(l => l.pts.map(p => p.v)).concat(multi ? [0] : []);
  let lo = Math.min(...vs), hi = Math.max(...vs), ticks;
  if (bmi) {
    // 18.5–30 이 늘 보이도록, 기록이 밖에 있으면 넓힘

  props: FLOOR,
};

const lerpPose = (A, B, e) => { const o = {}; for (const k of Object.keys(A)) o[k] = typeof A[k] === 'number' && typeof B[k] === 'number' ? A[k] + (B[k] - A[k]) * e : A[k]; return o; };
const pl = pts => 'M' + pts.map(q => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join('L');

function figMarkup(p, def) {
  let far = '', body = '', att = '';
  let hands, knees, feet, sho, hip = [p.hx, p.hy], s1 = p.s1;
  if (p.front) {
    const shY = p.hy - 30, sR = [p.hx + 8, shY], sL = [p.hx - 8, shY], hd = [p.hx, shY - 9];
    const aL = p.a2 ?? 180 - p.a, fL = p.f2 ?? 180 - p.f, lL = p.l2 ?? 180 - p.l, sLg = p.s2 ?? 180 - p.s;
    const eR = pt(sR, p.a, 16), hR = pt(eR, p.f, 15), eL = pt(sL, aL, 16), hL = pt(eL, fL, 15);
    const hipR = [p.hx + 5, p.hy], hipL = [p.hx - 5, p.hy];
    const kR = pt(hipR, p.l, 21), ftR = pt(kR, p.s, 21), kL = pt(hipL, lL, 21), ftL = pt(kL, sLg, 21);
    body = `<path d="${pl([sL, sR])}M${p.hx},${shY}L${p.hx},${p.hy}${pl([hipL, hipR])}${pl([sR, eR, hR])}${pl([sL, eL, hL])}${pl([hipR, kR, ftR])}${pl([hipL, kL, ftL])}"/><circle class="hd" cx="${hd[0]}" cy="${hd[1]}" r="6"/>`;
    hands = [hR, hL]; knees = [kR, kL]; feet = [ftR, ftL]; sho = [p.hx, shY];
  } else {
    sho = pt(hip, p.t, 30);
    const hd = pt(sho, p.t, 9);
    const a2 = p.a2 ?? p.a1, f2 = p.f2 ?? p.f1, l2 = p.l2 ?? p.l1, s2 = p.s2 ?? p.s1;
    const e1 = pt(sho, p.a1, 16), h1 = pt(e1, p.f1, 15), e2 = pt(sho, a2, 16), h2 = pt(e2, f2, 15);
    const k1 = pt(hip, p.l1, 21), ft1 = pt(k1, p.s1, 21), k2 = pt(hip, l2, 21), ft2 = pt(k2, s2, 21);
    far = `<path d="${pl([sho, e2, h2])}${pl([hip, k2, ft2])}"/>`;
    body = `<path d="${pl([hip, sho])}${pl([sho, e1, h1])}${pl([hip, k1, ft1])}"/><circle class="hd" cx="${hd[0].toFixed(1)}" cy="${hd[1].toFixed(1)}" r="6"/>`;
    hands = [h1, h2]; knees = [k1, k2]; feet = [ft1, ft2];

  const dumbbell = (h, ang) => {
    const a = pt(h, ang, 5), b = pt(h, ang + 180, 5);
    return `<path d="${pl([a, b])}" stroke-width="2.5"/><path d="${pl([pt(a, ang + 90, 3.5), pt(a, ang - 90, 3.5)])}${pl([pt(b, ang + 90, 3.5), pt(b, ang - 90, 3.5)])}" stroke-width="4"/>`;
  };
  for (const a of def.att || []) {
    if (a.startsWith('cable:')) { const [x, y] = a.slice(6).split(',').map(Number); att += `<path class="cb" d="M${x},${y}L${hands[0][0].toFixed(1)},${hands[0][1].toFixed(1)}"/>`; }
    else if (a === 'handle') att += hands.map(h => `<circle cx="${h[0].toFixed(1)}" cy="${h[1].toFixed(1)}" r="2.6"/>`).join('');
    else if (a === 'bar') att += `<path d="M${(hands[0][0] - 10).toFixed(1)},${hands[0][1].toFixed(1)}h20" stroke-width="2.5"/>`;
    else if (a === 'db') att += dumbbell(hands[0], 90) + (p.front ? dumbbell(hands[1], 90) : '');
    else if (a === 'db1') att += dumbbell(hands[0], 90);
    else if (a === 'dbf') att += hands.map(h => dumbbell(h, 90)).join('');
    else if (a === 'smith') att += `<circle cx="${sho[0].toFixed(1)}" cy="${(sho[1] - 1).toFixed(1)}" r="4"/>`;
    else if (a === 'barhip') att += `<circle cx="${hip[0].toFixed(1)}" cy="${(hip[1] - 5).toFixed(1)}" r="4.5"/>`;
    else if (a === 'plate') att += `<circle class="pl" cx="${hip[0].toFixed(1)}" cy="${(hip[1] - 7).toFixed(1)}" r="8"/>`;
    else if (a === 'pad') { const c = pt(knees[0], s1, 17); att += `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="4"/>`; }
    else if (a === 'plat') { const f = feet[0]; att += `<path d="${pl([pt(f, p.s1 - 90, 11), pt(f, p.s1 + 90, 11)])}" stroke-width="3"/>`; }
    else if (a === 'padOut' || a === 'padIn') att += knees.map((k, i) => { const dx = (i === 0 ? 1 : -1) * (a === 'padOut' ? 5 : -5); return `<circle cx="${(k[0] + dx).toFixed(1)}" cy="${k[1].toFixed(1)}" r="3.5"/>`; }).join('');
  }
  return `<g class="far">${far}</g><g class="bd">${body}</g><g class="at">${att}</g>`;
}
const figDef = name => FIG[name] || FIG_DEFAULT;
const figSvg = (name, size = 56) => `<svg class="fig" data-fig="${esc(name)}" data-off="${Math.random().toFixed(2)}" viewBox="0 0 100 100" width="${size}" height="${size}" aria-hidden="true"><g class="pr">${figDef(name).props || ''}</g><g class="dyn">${figMarkup(figDef(name).A, figDef(name))}</g></svg>`;
// 화면에 있는 그림만 움직임 (초당 30번, 움직임 줄이기 설정이면 멈춤)
let figLast = 0;
function figLoop(now) {
  requestAnimationFrame(figLoop);
  if (now - figLast < 33) return;
  figLast = now;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  for (const el of document.querySelectorAll('svg.fig')) {
    const r = el.getBoundingClientRect();
    if (r.bottom < 0 || r.top > innerHeight || !r.width) continue;
    const def = figDef(el.dataset.fig), period = def.period || 2600;
    const ph = (now / period + +el.dataset.off) % 1;
    const e = reduce ? 0.5 : (1 - Math.cos(ph * 2 * Math.PI)) / 2;
    el.lastChild.innerHTML = figMarkup(lerpPose(def.A, def.B, e), def);
  }
}
requestAnimationFrame(figLoop);

let gymWeek = mondayOf(new Date());

// 세트 기록
function lastSetsFor(name, before) {
  const days = Object.keys(G().sessions).filter(d => d < before).sort().reverse();
  for (const d of days) {
    const it = (G().sessions[d].items || []).find(i => i.ex === name);
    if (it && it.sets.length) return it.sets.map(s => ({ w: s.w || '', r: s.r || '', m: s.m || '', done: false }));
  }
  return isCardio(name) ? [{ m: '', done: false }] : [0, 1, 2].map(() => ({ w: '', r: '', done: false }));
}
const lastText = (name, before) => {
  const days = Object.keys(G().sessions).filter(d => d < before).sort().reverse();
  for (const d of days) {
    const it = (G().sessions[d].items || []).find(i => i.ex === name);
    if (it) { const s = it.sets.filter(x => x.done); if (s.length) return `지난번 ${shortDate(d)} · ` + (isCardio(name) ? `${s[0].m}분` : s.map(x => `${x.w}×${x.r}`).join(', ')); }
  }
  return '';
};
let pickerOpen = false;

function statsCard() {
  const now = new Date(), y = now.getFullYear(), m = now.getMonth();
  const inMonth = ds => { const d = parseYmd(ds); return d.getFullYear() === y && d.getMonth() === m; };
  const days = new Set([...Object.keys(S.data.mine || {}).filter(inMonth).filter(d => mineOf(d).length), ...Object.keys(G().sessions).filter(inMonth)]);
  const count = {};
  for (const d of Object.keys(S.data.mine || {}).filter(inMonth)) for (const x of mineOf(d)) count[x.name] = (count[x.name] || 0) + 1;
  const top = Object.entries(count).sort((a, b) => b[1] - a[1])[0];
  // 운동별 최고 무게와 지난번 무게
  const best = {};
  for (const d of Object.keys(G().sessions).sort()) for (const it of G().sessions[d].items || []) {
    if (isCardio(it.ex)) continue;
    const ws = it.sets.filter(s => s.done && +s.w > 0).map(s => +s.w);
    if (!ws.length) continue;
    const b = best[it.ex] || { max: 0 };
    best[it.ex] = { max: Math.max(b.max, ...ws), last: Math.max(...ws), date: d };
  }
  const rows = Object.entries(best).sort((a, b) => b[1].date.localeCompare(a[1].date)).slice(0, 8);
  return `<div class="card">
    <h2>${m + 1}월 기록</h2>
    <div class="tiles">
      <div class="tile"><b class="num">${days.size}<small>일</small></b><span>운동한 날</span></div>
      <div class="tile"><b style="font-size:17px">${top ? esc(top[0]) : '–'}</b><span>가장 많이 한 운동${top ? ` · ${top[1]}번` : ''}</span></div>
    </div>
    ${rows.length ? `<h3 style="font-size:15px;font-weight:800;margin:14px 0 4px">운동별 최고 무게</h3>
    <ul class="wo">${rows.map(([n, b]) => `<li>${figSvg(n, 36)}<span class="wo-name">${esc(n)}<span class="wo-note">지난번 ${f1(b.last).replace('.0', '')}kg · ${shortDate(b.date)}</span></span><b class="num">${f1(b.max).replace('.0', '')}<small class="sub"> kg</small></b></li>`).join('')}</ul>` : ''}
  </div>`;
}

  gymSaveT = setTimeout(() => post({}).catch(() => toast('인터넷 연결되면 저장돼요')), now ? 0 : 800);
}
const saveMeta = () => post({ gymMeta: { plan: G().plan, routines: G().routines, custom: G().custom } }).catch(() => toast('인터넷 연결되면 저장돼요'));

// 휴식 타이머 (1분)
let restEnd = 0, audioCtx = null;
function startRest(sec = 60) {
  restEnd = Date.now() + sec * 1000;
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch {}
  tickRest();
}
function beep() {
  try {
    for (const o of [0, 0.25, 0.5]) {
      const os = audioCtx.createOscillator(), g = audioCtx.createGain();
      os.frequency.value = 880; g.gain.value = 0.18; os.connect(g); g.connect(audioCtx.destination);
      os.start(audioCtx.currentTime + o); os.stop(audioCtx.currentTime + o + 0.15);
    }
  } catch {}
  try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch {}
}
function tickRest() {
  const bar = $('#rest');
  if (restEnd && Date.now() >= restEnd) { restEnd = 0; beep(); toast('휴식 끝! 다음 세트 💪'); }
  bar.hidden = !restEnd;
  if (restEnd) {
    const left = Math.max(0, restEnd - Date.now()), s = Math.ceil(left / 1000);
    bar.querySelector('b').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    bar.querySelector('s').style.width = Math.min(100, left / 600) + '%';
  }
  const el = $('#gym-elapsed'), ses = G().sessions[todayStr()];
  if (el && ses && !ses.end) el.textContent = `· ${Math.max(1, Math.round((Date.now() - ses.start) / 60000))}분째`;
}
setInterval(tickRest, 250);

function gymInput(e) {
  const k = e.target.dataset && e.target.dataset.gs;
  if (k) {
    const [i, j, f] = k.split(':'), s = G().sessions[todayStr()];
    if (!s || !s.items[i]) return;
    s.items[i].sets[j][f] = e.target.value.replace(',', '.').trim();
    saveSession(todayStr());
  }
  if (e.target.id === 'pk-q') {
    const q = e.target.value.trim().replace(/\s/g, '');
    document.querySelectorAll('.pk').forEach(b => (b.hidden = q && !b.textContent.replace(/\s/g, '').includes(q)));
    document.querySelectorAll('.pk-g').forEach(g => (g.hidden = ![...g.querySelectorAll('.pk')].some(b => !b.hidden)));
  }
}
document.addEventListener('input', gymInput);

// 헬스 탭 누르기 (공통 누르기 처리에서 먼저 불림; 처리했으면 true)
function gymClick(t) {
  const today = todayStr(), a = t.dataset.act;
  const s = G().sessions[today];
  if (t.dataset.planDay) { planDay = planDay === t.dataset.planDay ? null : t.dataset.planDay; renderGym(); return true; }
  if (t.dataset.planToggle) {
    const d = parseYmd(planDay), wk = ymd(mondayOf(d)), di = (d.getDay() + 6) % 7, n = t.dataset.planToggle;
    const p = (G().plan[wk] = G().plan[wk] || {}), l = p[di] || [];
    p[di] = l.includes(n) ? l.filter(x => x !== n) : [...l, n];
    save(); renderGym(); saveMeta(); return true;
  }
  if (a === 'plan-close') { planDay = null; renderGym(); return true; }
  if (a === 'wk-prev' || a === 'wk-next') { gymWeek = new Date(gymWeek.getFullYear(), gymWeek.getMonth(), gymWeek.getDate() + (a === 'wk-next' ? 7 : -7)); planDay = null; renderGym(); return true; }
  if (a === 'plan-copy') {
    const prev = ymd(new Date(gymWeek.getFullYear(), gymWeek.getMonth(), gymWeek.getDate() - 7));
    G().plan[ymd(gymWeek)] = JSON.parse(JSON.stringify(G().plan[prev] || {}));
    save(); renderGym(); saveMeta(); toast('지난주 계획을 가져왔어요'); return true;
  }
  if (t.dataset.start !== undefined) {
    const r = G().routines.find(x => x.id === t.dataset.start);
    G().sessions[today] = { start: Date.now(), routine: r ? r.name : '', items: r ? r.ex.map(n => ({ ex: n, sets: lastSetsFor(n, today) })) : [] };
    pickerOpen = !r; saveSession(today, true); renderGym(); return true;
  }
  if (!s) return false;
  if (a === 'picker') { pickerOpen = !pickerOpen; renderGym(); if (pickerOpen) setTimeout(() => scrollToEl($('#picker'), 80), 30); return true; }
  if (t.dataset.pickEx) {
    const n = t.dataset.pickEx;
    if (!s.items.some(i => i.ex === n)) { s.items.push({ ex: n, sets: lastSetsFor(n, today) }); saveSession(today); }
    toast(`${n} 추가`); pickerOpen = false; renderGym(); return true;
  }
  if (a === 'ex-custom') {
    const n = (prompt('운동 이름을 적어 주세요') || '').trim().slice(0, 30);
    if (!n) return true;
    if (!exGroups().some(([, l]) => l.includes(n))) { G().custom.push({ name: n }); saveMeta(); }
    if (!s.items.some(i => i.ex === n)) s.items.push({ ex: n, sets: lastSetsFor(n, today) });
    pickerOpen = false; saveSession(today); renderGym(); return true;
  }
  if (t.dataset.gxDel !== undefined) {
    const it = s.items[+t.dataset.gxDel];
    if (it && confirm(`${it.ex}을(를) 오늘 운동에서 뺄까요?`)) { s.items.splice(+t.dataset.gxDel, 1); saveSession(today); renderGym(); }
    return true;
  }
  if (t.dataset.gsOk) {
    const [i, j] = t.dataset.gsOk.split(':').map(Number), st = s.items[i].sets[j];
    st.done = !st.done;
    if (st.done) startRest(60);
    saveSession(today); renderGym(); return true;
  }
  if (t.dataset.gsAdd !== undefined) { const it = s.items[+t.dataset.gsAdd], lst = it.sets.at(-1) || {}; it.sets.push({ w: lst.w || '', r: lst.r || '', m: lst.m || '', done: false }); saveSession(today); renderGym(); return true; }
  if (t.dataset.gsRm !== undefined) { s.items[+t.dataset.gsRm].sets.pop(); saveSession(today); renderGym(); return true; }
  if (a === 'routine-save') {
    const n = (prompt('루틴 이름 (예: 하체, 상체)', s.routine || '') || '').trim().slice(0, 20);
    if (!n) return true;
    const ex = s.items.map(i => i.ex), old = G().routines.find(r => r.name === n);
    if (old) old.ex = ex; else G().routines.push({ id: Date.now().toString(36), name: n, ex });
    s.routine = n; save(); saveMeta(); saveSession(today); renderGym(); toast(`'${n}' 루틴을 저장했어요`); return true;
  }
  if (a === 'gym-finish') {
    const guess = Math.min(300, Math.max(1, Math.round((Date.now() - s.start) / 60000)));
    const mv = prompt('운동한 시간 (분)', guess);
    if (mv == null) return true;
    const kv = prompt('칼로리 (kcal, 모르면 비워 두세요)', s.kcal || '');
    s.min = parseInt(String(mv).replace(/\D/g, ''), 10) || guess;
    s.kcal = parseInt(String(kv || '').replace(/\D/g, ''), 10) || undefined;
    s.end = Date.now(); restEnd = 0; pickerOpen = false;
    // '오늘 한 운동'에 헬스로 넣기 (다시 끝내면 바꿔 씀)
    const note = s.items.filter(i => i.sets.some(x => x.done)).map(i => isCardio(i.ex) ? `${i.ex} ${i.sets.filter(x => x.done).map(x => x.m + '분').join('')}` : `${i.ex} ${Math.max(0, ...i.sets.filter(x => x.done).map(x => +x.w || 0))}kg`).join(', ').slice(0, 300);
    const list = mineOf(today).filter(x => !x.gym);
    list.push({ id: 'gym' + today.replace(/-/g, ''), name: '헬스', min: s.min, kcal: s.kcal, note, gym: true });
    S.data.mine = S.data.mine || {}; S.data.mine[today] = list;
    S.pending = { ...(S.pending || {}), mine: { date: today, list } };
    saveSession(today, true); renderGym(); toast('수고했어요! 오늘 한 운동에 넣었어요'); return true;
  }
  if (a === 'gym-reopen') { delete s.end; saveSession(today, true); renderGym(); return true; }
  if (a === 'gym-cancel') {
    if (!confirm('오늘 헬스 기록을 지울까요?')) return true;
    delete G().sessions[today]; restEnd = 0; pickerOpen = false;
    const list = mineOf(today).filter(x => !x.gym);
    if (list.length) S.data.mine[today] = list; else delete S.data.mine[today];
    S.pending = { ...(S.pending || {}), mine: { date: today, list } };
    saveSession(today, true); renderGym(); return true;
  }
  return false;
}
function gymClickAny(t) {
  if (t.dataset.delRoutine) {
    const r = G().routines.find(x => x.id === t.dataset.delRoutine);
    if (r && confirm(`'${r.name}' 루틴을 지울까요?`)) { G().routines = G().routines.filter(x => x !== r); save(); saveMeta(); renderGym(); }
    return true;
  }
  if (t.dataset.act === 'rest-skip') { restEnd = 0; tickRest(); return true; }
  if (t.dataset.act === 'rest-add') { restEnd += 30000; tickRest(); return true; }
  return gymClick(t);
}

// 달력을 옆으로 밀면 달 바꾸기
let sx0 = null, sy0 = null;
document.addEventListener('touchstart', e => { if (e.target.closest('#grid')) { sx0 = e.touches[0].clientX; sy0 = e.touches[0].clientY; } else sx0 = null; }, { passive: true });
document.addEventListener('touchend', e => {
  if (sx0 == null) return;
  const dx = e.changedTouches[0].clientX - sx0, dy = e.changedTouches[0].clientY - sy0;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) { view = new Date(view.getFullYear(), view.getMonth() + (dx < 0 ? 1 : -1), 1); renderCal(); }
  sx0 = null;
}, { passive: true });
for (const type of ['gesturestart', 'gesturechange']) document.addEventListener(type, e => e.preventDefault(), { passive: false });

render();
sync();
// 앱으로 돌아올 때, 그리고 켜 둔 동안 1분마다 새 기록 확인
document.addEventListener('visibilitychange', () => { if (!document.hidden) { render(); sync(); } });
setInterval(() => { if (!document.hidden) sync(); }, 60000);

// 오프라인 + 새 버전 바로 적용 (다른 앱들과 같은 방식)
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloading) return;
    reloading = true;
    location.reload();
  });
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
  }).catch(() => {});
}
</script>
</body>
</html>
