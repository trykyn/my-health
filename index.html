<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f2f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111513" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="내 건강">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>내 건강</title>
<style>
/* 모양: 연한 바탕, 흰 카드, 초록 하나. 좋아진 변화 = 초록, 나빠진 변화 = 빨강 (항상 ▲▼ 화살표와 함께) */
:root {
  --bg: #f2f4f1; --card: #ffffff; --ink: #151a17; --muted: #5f6a64; --line: #e3e7e3; --field: #f5f7f5;
  --accent: #13875c; --accent-ink: #ffffff; --soft: #e2f3ea; --track: #e4e9e5;
  --good: #13875c; --bad: #c4362b; --grid: #e8ece9;
  --shadow: 0 1px 2px rgba(21, 26, 23, .06), 0 4px 14px rgba(21, 26, 23, .04);
  --sans: system-ui, -apple-system, "Apple SD Gothic Neo", "Segoe UI", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111513; --card: #1b201d; --ink: #eef2ef; --muted: #a0aba5; --line: #2b322e; --field: #232925;
    --accent: #4fd197; --accent-ink: #08281a; --soft: #19332a; --track: #2b332e;
    --good: #4fd197; --bad: #ff8a7a; --grid: #262d29;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  }
}
/* 확대 없음, 스크롤만 */
* { box-sizing: border-box; touch-action: pan-x pan-y; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 var(--sans); -webkit-text-size-adjust: 100%; }
main { max-width: 540px; margin: 0 auto; padding: calc(18px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom)); }
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.date { margin: 0 0 2px; font-size: 14px; color: var(--muted); }
h1 { font-size: 30px; line-height: 1.15; letter-spacing: -.02em; margin: 0; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--card); box-shadow: var(--shadow); color: var(--muted); }
.icon-btn svg { width: 22px; height: 22px; }

.card { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; }
.card h2 { font-size: 17px; margin: 0 0 10px; }
.sub { color: var(--muted); font-size: 14px; }
.btn { flex: none; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 18px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.ghost { background: var(--field); color: var(--ink); }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 15px; border-radius: 10px; }

/* 아래 탭 막대 */
nav.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; justify-content: center;
  background: color-mix(in srgb, var(--card) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
nav.tabbar button { flex: 1; max-width: 160px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; font-size: 12px; color: var(--muted); }
nav.tabbar svg { width: 26px; height: 26px; }
nav.tabbar button.on { color: var(--accent); font-weight: 600; }

/* ── 달력 ── */
.month-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.month-head h2 { margin: 0; font-size: 20px; }
.month-head .arrows { display: flex; gap: 6px; }
.month-head .arrows button { width: 38px; height: 38px; border-radius: 50%; background: var(--field); display: grid; place-items: center; }
.month-head .arrows svg { width: 20px; height: 20px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.stat { background: var(--field); border-radius: 12px; padding: 8px 10px; }
.stat b { display: block; font-size: 17px; line-height: 1.3; white-space: nowrap; }
.stat span { font-size: 12px; color: var(--muted); }
.wk, .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.wk { font-size: 12px; color: var(--muted); text-align: center; margin-bottom: 2px; }
.wk span:nth-child(7) { color: var(--bad); }
.day { position: relative; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 4px 0 3px; border-radius: 12px; min-height: 66px; }
.day .dn { font-size: 13px; line-height: 1.2; color: var(--muted); }
.day.today .dn { background: var(--accent); color: var(--accent-ink); border-radius: 9px; padding: 0 6px; font-weight: 700; }
.day.sel { background: var(--soft); }
.day.future { opacity: .45; }
.day svg.ring { width: 30px; height: 30px; transform: rotate(-90deg); }
.day .dm { font-size: 11px; line-height: 1.1; color: var(--ink); font-weight: 600; min-height: 12px; }
.day .ib { position: absolute; top: 5px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); opacity: .55; }
.legend-line { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 8px; }
.legend-line i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); opacity: .55; margin-right: 5px; vertical-align: 2px; }
.banner { display: flex; gap: 12px; align-items: center; background: var(--soft); border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; font-size: 15px; }
.banner b { display: block; }
.banner .btn { flex: none; margin-left: auto; }
.tiles { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 8px; }
.tile { border-radius: 12px; background: var(--field); padding: 10px; }
.tile b { display: block; font-size: 22px; line-height: 1.2; }
.tile b small { font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 2px; }
.tile span { font-size: 12px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { font-size: 13px; padding: 3px 10px; border-radius: 99px; background: var(--soft); color: var(--ink); }
.detail-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; }
.edit-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }

/* 입력칸 */
.fld { display: flex; flex-direction: column; gap: 3px; min-width: 0; font-size: 13px; color: var(--muted); }
.fld input { width: 100%; min-width: 0; height: 44px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--field); font-size: 17px; color: var(--ink); }
.fld input[type=date] { display: block; max-width: 100%; -webkit-appearance: none; appearance: none; line-height: 42px; }
.fld input[type=date]::-webkit-date-and-time-value { text-align: left; }
.fld input:focus { outline: 0; border-color: var(--accent); }

/* ── 인바디 ── */
.metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
.metric { text-align: left; background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 12px 12px 10px; border: 2px solid transparent; }
.metric.on { border-color: var(--accent); }
.metric .lab { font-size: 13px; color: var(--muted); }
.metric .val { font-size: 24px; font-weight: 700; line-height: 1.2; letter-spacing: -.01em; }
.metric .val small { font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 1px; }
.delta { font-size: 13px; font-weight: 600; white-space: nowrap; }
.delta.good { color: var(--good); } .delta.bad { color: var(--bad); } .delta.same { color: var(--muted); }
.metric .since { font-size: 11px; color: var(--muted); margin-top: 2px; }
.chart-wrap { position: relative; }
.chart-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart-wrap .axis { fill: var(--muted); font-size: 11px; }
.chart-wrap .vlab { fill: var(--ink); font-size: 12px; font-weight: 600; }
.tip { position: absolute; pointer-events: none; transform: translate(-50%, calc(-100% - 12px)); background: var(--ink); color: var(--bg); font-size: 13px; line-height: 1.35; padding: 6px 10px; border-radius: 10px; white-space: nowrap; }
.tip .delta.good, .tip .delta.bad { color: inherit; }
.chart-sum { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 8px; font-size: 14px; color: var(--muted); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
.hist { list-style: none; margin: 0; padding: 0; }
.hist li { display: grid; grid-template-columns: 74px repeat(3, minmax(0, 1fr)) 28px; align-items: center; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; }
.hist li:first-child { border-top: 0; }
.hist .hd { font-size: 13px; color: var(--muted); }
.hist .hv b { font-weight: 600; }
.hist .hv .delta { display: block; font-size: 11px; }
.hist .head { font-size: 12px; color: var(--muted); padding-top: 0; }
.hist .x { width: 28px; height: 28px; border-radius: 50%; color: var(--muted); display: grid; place-items: center; }
.hist .x svg { width: 16px; height: 16px; }
.empty { text-align: center; color: var(--muted); padding: 18px 0 6px; font-size: 15px; }

/* ── 헬스 (초안) ── */
.draft { border: 2px dashed var(--line); background: transparent; box-shadow: none; }
.draft .tag { display: inline-block; font-size: 11px; font-weight: 700; color: var(--accent); background: var(--soft); border-radius: 6px; padding: 1px 7px; margin-bottom: 6px; }
.draft ul { margin: 6px 0 0; padding-left: 20px; color: var(--muted); font-size: 15px; }

/* ── 설정 창 ── */
dialog { width: min(540px, 100%); max-width: 100%; max-height: 92vh; margin: auto auto 0; padding: 0; border: 0; border-radius: 22px 22px 0 0; background: var(--bg); color: var(--ink); }
dialog::backdrop { background: rgba(0, 0, 0, .35); }
.sheet { padding: 18px 16px calc(24px + env(safe-area-inset-bottom)); overflow-y: auto; max-height: 92vh; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.sheet-head h2 { margin: 0; font-size: 22px; }
.url-box { font: 13px/1.4 ui-monospace, Menlo, monospace; word-break: break-all; background: var(--field); border-radius: 10px; padding: 10px; margin: 8px 0; user-select: all; -webkit-user-select: all; }
ol.steps { margin: 0; padding-left: 22px; font-size: 15px; }
ol.steps li { margin-bottom: 8px; }
ol.steps b { font-weight: 600; }
.field-tbl { width: 100%; border-collapse: collapse; font-size: 14px; margin: 6px 0; }
.field-tbl td { padding: 4px 6px; border-top: 1px solid var(--line); }
.field-tbl code { font: 13px ui-monospace, Menlo, monospace; background: var(--field); padding: 1px 5px; border-radius: 5px; }
.inline { display: flex; gap: 8px; align-items: flex-end; }
.inline .fld { flex: 1; }
#toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 12px; font-size: 15px; z-index: 20; white-space: nowrap; }
</style>
</head>
<body>
<main>
  <header>
    <div><p class="date" id="today"></p><h1 id="title">내 건강</h1></div>
    <button class="icon-btn" id="openSettings" aria-label="설정">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <section id="v-cal"></section>
  <section id="v-ib" hidden></section>
  <section id="v-gym" hidden></section>
</main>

<nav class="tabbar">
  <button data-tab="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>달력</button>
  <button data-tab="ib"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M5 16l5-5 4 3 6-7"/></svg>인바디</button>
  <button data-tab="gym"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>헬스</button>
</nav>

<dialog id="settings"><div class="sheet" id="sheet"></div></dialog>
<div id="toast" hidden></div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// 내 건강
//  · 달력: Apple Watch 기록. 아이폰 '단축어' 자동화가 운동이 끝날 때 오늘 운동 시간·활동 칼로리·걸음 수를
//    동기화 서버(worker/)로 보내면, 앱이 열릴 때와 1분마다 받아 옴.
//  · 인바디: 몸무게(kg)·근육량(%)·체지방(%) 기록과 변화 그래프.
//  · 헬스: 틀 구상 중.
// 모든 기록은 서버의 data:{연결 키} 하나에 들어 있고, 이 휴대폰에도 복사본을 둠(오프라인용).
// ─────────────────────────────────────────────────────────────────────────────
const API = 'https://my-health-sync.weekly-meals-reader.workers.dev';
const LS = 'my-health';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const WD = ['월', '화', '수', '목', '금', '토', '일'];
const WD_SUN = ['일', '월', '화', '수', '목', '금', '토'];

// ── 저장 상태 ──
const S = (() => { try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch { return {}; } })();
if (!S.key) S.key = newKey();
S.data = Object.assign({ days: {}, inbody: [], gym: {} }, S.data);
S.goal = S.goal || 30;
S.tab = S.tab || 'cal';
S.metric = S.metric || 'w';
const save = () => { try { localStorage.setItem(LS, JSON.stringify(S)); } catch {} };
save();

function newKey() {
  const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
  return Array.from(crypto.getRandomValues(new Uint8Array(32)), b => abc[b % abc.length]).join('');
}
const pushUrl = () => `${API}/h/${S.key}`;

// ── 날짜 ──
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const todayStr = () => ymd(new Date());
const longDate = s => { const d = parseYmd(s); return `${d.getMonth() + 1}월 ${d.getDate()}일 (${WD_SUN[d.getDay()]})`; };
const shortDate = s => { const d = parseYmd(s); return `${String(d.getFullYear()).slice(2)}.${d.getMonth() + 1}.${d.getDate()}`; };
const fmtInt = n => Number(n).toLocaleString('ko-KR');

let view = (() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); })();
let sel = todayStr();
let editing = false;

// ── 서버와 주고받기 ──
let syncing = false;
async function sync() {
  if (syncing) return;
  syncing = true;
  try {
    // 아직 못 보낸 인바디·헬스 기록이 있으면 먼저 보냄 (안 그러면 서버 값이 덮어씀)
    if (S.pending) await post({});
    await chain;
    if (S.pending) return;
    const r = await fetch(`${API}/d/${S.key}`, { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    if (S.pending) return; // 받는 사이에 새로 적은 게 있으면 이번 것은 버림
    S.data = Object.assign({ days: {}, inbody: [], gym: {} }, d);
    S.synced = Date.now();
    save();
    render();
  } catch { /* 오프라인: 휴대폰에 있는 복사본으로 계속 */ }
  finally { syncing = false; }
}
// 저장은 한 줄로 차례차례 (빠르게 여러 번 눌러도 늦게 온 답이 새 기록을 덮지 않게)
let chain = Promise.resolve();
function post(body) {
  S.pending = { ...(S.pending || {}), ...body };
  save();
  return (chain = chain.catch(() => {}).then(flush));
}
async function flush() {
  const send = S.pending;
  if (!send) return;
  const r = await fetch(`${API}/d/${S.key}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(send) });
  if (!r.ok) throw new Error(r.status);
  const data = await r.json();
  // 보내는 동안 또 바뀐 게 없을 때만 서버 값을 받아들임 (있으면 다음 차례에 그것까지 보냄)
  if (S.pending === send) { S.pending = null; S.data = Object.assign({ days: {}, inbody: [], gym: {} }, data); }
  save();
}
const saveSoon = body => post(body).then(render).catch(() => toast('인터넷 연결되면 저장돼요'));

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 2200);
}

// ── 그리기 ──
function render() {
  $('#today').textContent = longDate(todayStr()).replace(/^/, `${new Date().getFullYear()}년 `);
  for (const b of document.querySelectorAll('nav.tabbar button')) b.classList.toggle('on', b.dataset.tab === S.tab);
  $('#v-cal').hidden = S.tab !== 'cal'; $('#v-ib').hidden = S.tab !== 'ib'; $('#v-gym').hidden = S.tab !== 'gym';
  $('#title').textContent = { cal: '내 건강', ib: '인바디', gym: '헬스' }[S.tab];
  if (S.tab === 'cal') renderCal();
  if (S.tab === 'ib') renderIb();
  if (S.tab === 'gym') renderGym();
}

const ARROW_L = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>';
const ARROW_R = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>';
const X_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';

// 운동 링: 하루 목표(분)를 채운 만큼 초록 원이 참
function ring(min) {
  const r = 12, c = 2 * Math.PI * r, p = Math.min((min || 0) / S.goal, 1);
  return `<svg class="ring" viewBox="0 0 30 30" aria-hidden="true">
    <circle cx="15" cy="15" r="${r}" fill="none" stroke="var(--track)" stroke-width="4"/>

function renderCal() {

function dayDetail(ds) {
  const rec = S.data.days[ds], ib = S.data.inbody.find(e => e.date === ds);
  const has = rec && (rec.min != null || rec.kcal != null || rec.steps != null);

  const when = rec && rec.at ? new Date(rec.at) : null;
  let body = has
    ? `<div class="tiles">${t(rec.min, '분', '운동 시간')}${t(rec.steps, '', '걸음')}${rec.kcal != null ? t(rec.kcal, 'kcal', '활동 칼로리') : ''}</div>
       ${rec.types && rec.types.length ? `<div class="chips">${rec.types.map(x => `<span class="chip">${esc(x)}</span>`).join('')}</div>` : ''}`
    : `<p class="sub" style="margin:0">${ds > todayStr() ? '아직 오지 않은 날이에요.' : '이날은 기록이 없어요.'}</p>`;
  if (ib) body += `<p class="sub" style="margin:10px 0 0">인바디 · ${[ib.w != null && f1(ib.w) + 'kg', ib.m != null && '근육 ' + f1(ib.m) + '%', ib.f != null && '체지방 ' + f1(ib.f) + '%'].filter(Boolean).join(' · ')}</p>`;
  const form = editing ? `
    <div class="edit-row">
      <label class="fld">운동(분)<input id="e-min" inputmode="numeric" value="${rec?.min ?? ''}"></label>

    </div>

    <div class="detail-foot"><span class="sub">${when ? `${when.getMonth() + 1}/${when.getDate()} ${String(when.getHours()).padStart(2, '0')}:${String(when.getMinutes()).padStart(2, '0')} ${rec.manual ? '직접 적음' : '워치에서 받음'}` : ''}</span>
      ${ds <= todayStr() ? '<button class="btn small ghost" data-act="edit">직접 고치기</button>' : ''}</div>`;
  return `<div class="card"><h2>${longDate(ds)}</h2>${body}${form}</div>`;

// ── 인바디 ──
const METRICS = {
  w: { lab: '몸무게', unit: 'kg', better: -1 },   // 줄면 좋음
  m: { lab: '근육량', unit: '%', better: 1 },     // 늘면 좋음
  f: { lab: '체지방', unit: '%', better: -1 },    // 줄면 좋음
};
const r1 = v => Math.round(v * 10) / 10;
const f1 = v => Number(v).toFixed(1); // 29 → 29.0
function deltaHtml(d, key, suffix = '') {
  if (d == null) return '';
  d = r1(d);
  if (d === 0) return `<span class="delta same">± 0${suffix}</span>`;
  const cls = d * METRICS[key].better > 0 ? 'good' : 'bad';
  return `<span class="delta ${cls}">${d > 0 ? '▲ +' : '▼ −'}${Math.abs(d).toFixed(1)}${suffix}</span>`;
}
const ibSorted = () => [...S.data.inbody].sort((a, b) => a.date.localeCompare(b.date) || (a.id || '').localeCompare(b.id || ''));
const series = k => ibSorted().filter(e => e[k] != null);

function renderIb() {
  const card = k => {
    const s = series(k), M = METRICS[k];
    const last = s[s.length - 1], prev = s[s.length - 2], first = s[0];
    return `<button class="metric ${S.metric === k ? 'on' : ''}" data-metric="${k}">
      <div class="lab">${M.lab}</div>
      <div class="val num">${last ? f1(last[k]) : '–'}<small>${M.unit}</small></div>
      ${prev ? deltaHtml(last[k] - prev[k], k) : '<span class="delta same">&nbsp;</span>'}
      <div class="since">${prev ? '지난번보다' : s.length ? '첫 기록' : '기록 없음'}</div>
    </button>`;
  };
  const list = ibSorted().reverse();
  const prevOf = (e, k) => { const s = series(k); const i = s.indexOf(e); return i > 0 ? s[i - 1][k] : null; };
  const cell = (e, k) => { const p = prevOf(e, k); return `<span class="hv num">${e[k] == null ? '–' : `<b>${f1(e[k])}</b>`}${e[k] != null && p != null ? deltaHtml(e[k] - p, k) : ''}</span>`; };

  $('#v-ib').innerHTML = `
    <div class="metrics">${card('w')}${card('m')}${card('f')}</div>
    <div class="card">
      <h2>${METRICS[S.metric].lab} 변화 <span class="sub">(${METRICS[S.metric].unit})</span></h2>
      ${chartHtml(S.metric)}
    </div>
    <div class="card">
      <h2>새 결과 적기</h2>
      <div class="form-grid">
        <label class="fld">잰 날<input type="date" id="i-date" value="${todayStr()}" max="${todayStr()}"></label>
        <label class="fld">몸무게 (kg)<input id="i-w" inputmode="decimal" placeholder="예: 62.4"></label>
        <label class="fld">근육량 (%)<input id="i-m" inputmode="decimal" placeholder="예: 38.5"></label>
        <label class="fld">체지방 (%)<input id="i-f" inputmode="decimal" placeholder="예: 27.0"></label>
      </div>
      <button class="btn" style="width:100%" data-act="add-ib">저장</button>
    </div>
    <div class="card">
      <h2>지난 기록</h2>
      ${list.length ? `<ul class="hist">
        <li class="head"><span>날짜</span><span>몸무게</span><span>근육량</span><span>체지방</span><span></span></li>
        ${list.map(e => `<li><span class="hd num">${shortDate(e.date)}</span>${cell(e, 'w')}${cell(e, 'm')}${cell(e, 'f')}
          <button class="x" data-del-ib="${esc(e.id)}" aria-label="${shortDate(e.date)} 기록 지우기">${X_ICON}</button></li>`).join('')}
      </ul>` : '<p class="empty">아직 기록이 없어요. 위에 첫 결과를 적어 보세요.</p>'}
    </div>`;
  bindChart();
}

// 선 그래프: 한 번에 한 가지 수치만 (축 하나). 처음·마지막·가장 높은·낮은 점에만 숫자 표시, 점을 누르면 자세히
let chartPts = [];
function chartHtml(k) {
  const s = series(k);
  if (!s.length) return '<p class="empty">기록을 적으면 여기에 그래프가 그려져요.</p>';
  const W = 340, H = 190, L = 34, R = 14, T = 24, B = 26;
  const ts = s.map(e => parseYmd(e.date).getTime());
  let t0 = Math.min(...ts), t1 = Math.max(...ts);
  if (t0 === t1) { t0 -= 864e5 * 15; t1 += 864e5 * 15; }
  const vs = s.map(e => e[k]);
  let lo = Math.min(...vs), hi = Math.max(...vs);
  const pad = Math.max((hi - lo) * 0.2, k === 'w' ? 1 : 0.8);
  lo -= pad; hi += pad;
  const step = niceStep((hi - lo) / 3);
  const ticks = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) ticks.push(r1(v));
  const X = t => L + (t - t0) / (t1 - t0) * (W - L - R), Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  chartPts = s.map((e, i) => ({ x: X(ts[i]), y: Y(e[k]), e, prev: i ? s[i - 1][k] : null, k }));
  // 숫자를 붙일 점: 처음, 마지막, 최고, 최저 (겹치지 않게 중복 제거)
  const iMax = vs.indexOf(Math.max(...vs)), iMin = vs.lastIndexOf(Math.min(...vs));
  const labeled = [...new Set([0, s.length - 1, iMax, iMin])];
  const path = chartPts.map((p, i) => `${i ? 'L' : 'M'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join('');
  const xl = [0, s.length - 1].filter((v, i, a) => a.indexOf(v) === i);
  if (s.length > 2) { const mid = Math.round((s.length - 1) / 2); if (chartPts[mid].x - chartPts[0].x > 60 && chartPts.at(-1).x - chartPts[mid].x > 60) xl.splice(1, 0, mid); }
  const firstV = vs[0], lastV = vs.at(-1);
  return `<div class="chart-wrap" id="chart">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${METRICS[k].lab} ${s.length}번 기록, 처음 ${firstV} 지금 ${lastV}">
      ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)" stroke-width="1"/><text class="axis num" x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`).join('')}
      ${xl.map(i => `<text class="axis num" x="${chartPts[i].x}" y="${H - 6}" text-anchor="${s.length === 1 ? 'middle' : i === 0 ? 'start' : i === s.length - 1 ? 'end' : 'middle'}">${shortDate(s[i].date)}</text>`).join('')}
      <line id="cross" x1="0" x2="0" y1="${T - 8}" y2="${H - B}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>
      <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${chartPts.map((p, i) => `<circle cx="${p.x}" cy="${p.y}" r="4.5" fill="var(--accent)" stroke="var(--card)" stroke-width="2" data-i="${i}"/>`).join('')}
      ${labeled.map(i => { const p = chartPts[i], below = i === iMin && i !== iMax && s.length > 1; return `<text class="vlab num" x="${Math.min(Math.max(p.x, L + 12), W - R - 12)}" y="${below ? p.y + 18 : p.y - 10}" text-anchor="middle">${f1(vs[i])}</text>`; }).join('')}
      <rect id="hit" x="0" y="0" width="${W}" height="${H}" fill="transparent"/>
    </svg>
    <div class="tip" id="tip" hidden></div>
  </div>
  <div class="chart-sum"><span>${s.length}번 기록</span>${s.length > 1 ? `<span>처음(${shortDate(s[0].date)})보다 ${deltaHtml(lastV - firstV, k, METRICS[k].unit)}</span>` : ''}</div>`;
}
function niceStep(raw) {
  const p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
}
function bindChart() {
  const wrap = $('#chart'); if (!wrap) return;
  const svg = wrap.querySelector('svg'), tip = $('#tip'), cross = $('#cross');
  const show = ev => {
    const box = svg.getBoundingClientRect(), sx = box.width / 340;
    const x = (ev.clientX - box.left) / sx;
    let best = chartPts[0]; for (const p of chartPts) if (Math.abs(p.x - x) < Math.abs(best.x - x)) best = p;
    const M = METRICS[best.k];
    tip.innerHTML = `${longDate(best.e.date)}<br><b class="num">${f1(best.e[best.k])}${M.unit}</b> ${best.prev != null ? deltaHtml(best.e[best.k] - best.prev, best.k) : ''}`;
    tip.style.left = Math.min(Math.max(best.x * sx, 70), box.width - 70) + 'px';
    tip.style.top = best.y * sx + 'px';
    tip.hidden = false;
    cross.setAttribute('x1', best.x); cross.setAttribute('x2', best.x); cross.setAttribute('visibility', 'visible');
    svg.querySelectorAll('circle').forEach(c => c.setAttribute('r', c.dataset.i == chartPts.indexOf(best) ? 6.5 : 4.5));
  };
  const hide = () => { tip.hidden = true; cross.setAttribute('visibility', 'hidden'); svg.querySelectorAll('circle').forEach(c => c.setAttribute('r', 4.5)); };
  svg.addEventListener('pointermove', show);
  svg.addEventListener('pointerdown', show);
  svg.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hide(); });
}

      <p class="sub" style="margin:0 0 8px">연결 키를 다른 기기 앱에 넣으면 같은 기록을 봐요. 휴대폰을 바꿨을 때도 이 키로 되살려요.</p>
      <div class="url-box">${esc(S.key)}</div>
      <div class="inline"><label class="fld">다른 연결 키 넣기<input id="newkey" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="32자리 키"></label><button class="btn small ghost" data-act="usekey">바꾸기</button></div>
    </div>`;
}

// ── 누르기 ──
document.addEventListener('click', async ev => {
  const t = ev.target.closest('button'); if (!t) return;
  if (t.dataset.tab) { S.tab = t.dataset.tab; editing = false; save(); render(); scrollTo(0, 0); return; }
  if (t.dataset.day) { sel = t.dataset.day; editing = false; renderCal(); return; }
  if (t.dataset.metric) { S.metric = t.dataset.metric; save(); renderIb(); return; }
  if (t.dataset.delIb) {
    const e = S.data.inbody.find(x => x.id === t.dataset.delIb);
    if (!e || !confirm(`${shortDate(e.date)} 인바디 기록을 지울까요?`)) return;
    S.data.inbody = S.data.inbody.filter(x => x !== e); save(); renderIb();
    saveSoon({ inbody: S.data.inbody }); return;
  }
  const a = t.dataset.act;
  if (a === 'prev' || a === 'next') { view = new Date(view.getFullYear(), view.getMonth() + (a === 'next' ? 1 : -1), 1); renderCal(); }
  if (a === 'edit') { editing = true; renderCal(); }
  if (a === 'cancel') { editing = false; renderCal(); }
  if (a === 'save-day' || a === 'del-day') {
    const val = id => { const v = $(id).value.replace(/\D/g, ''); return v === '' ? undefined : Number(v); };
    let value = null;
    if (a === 'save-day') {
      value = { ...(S.data.days[sel] || {}), min: val('#e-min'), steps: val('#e-steps') };
      delete value.at; delete value.manual;
      for (const k of Object.keys(value)) if (value[k] === undefined) delete value[k];
      if (!Object.keys(value).length) value = null;
    }
    if (value) S.data.days[sel] = value; else delete S.data.days[sel];
    editing = false; save(); renderCal();
    post({ day: { date: sel, value } }).then(render).catch(() => toast('인터넷 연결되면 저장돼요'));
  }
  if (a === 'add-ib') {
    const n = id => { const v = $(id).value.trim().replace(',', '.'); const x = parseFloat(v); return isFinite(x) ? r1(x) : null; };
    const date = $('#i-date').value || todayStr();
    const e = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), date, w: n('#i-w'), m: n('#i-m'), f: n('#i-f') };
    if (e.w == null && e.m == null && e.f == null) { toast('숫자를 하나 이상 적어 주세요'); return; }
    S.data.inbody.push(e); save(); renderIb(); toast('저장했어요');
    saveSoon({ inbody: S.data.inbody });
  }
  if (a === 'setup') { renderSettings(); $('#settings').showModal(); }
  if (a === 'close') $('#settings').close();
  if (a === 'copy') {
    try { await navigator.clipboard.writeText(pushUrl()); toast('주소를 복사했어요'); }
    catch { getSelection().selectAllChildren($('#url')); toast('주소를 길게 눌러 복사하세요'); }
  }
  if (a === 'goal') { const g = parseInt($('#goal').value, 10); if (g > 0 && g < 600) { S.goal = g; save(); render(); toast('저장했어요'); } }
  if (a === 'usekey') {
    const k = $('#newkey').value.trim();
    if (!/^[A-Za-z0-9]{24,64}$/.test(k)) { toast('키 모양이 맞지 않아요'); return; }
    if (!confirm('이 기기의 기록 대신 그 키의 기록을 볼까요?')) return;
    S.key = k; S.data = { days: {}, inbody: [], gym: {} }; S.pending = null; save();
    $('#settings').close(); render(); sync();
  }
});
$('#openSettings').addEventListener('click', () => { renderSettings(); $('#settings').showModal(); });
$('#settings').addEventListener('click', e => { if (e.target === $('#settings')) $('#settings').close(); });

// 달력을 옆으로 밀면 달 바꾸기
let sx0 = null, sy0 = null;
document.addEventListener('touchstart', e => { if (e.target.closest('#grid')) { sx0 = e.touches[0].clientX; sy0 = e.touches[0].clientY; } else sx0 = null; }, { passive: true });
document.addEventListener('touchend', e => {
  if (sx0 == null) return;
  const dx = e.changedTouches[0].clientX - sx0, dy = e.changedTouches[0].clientY - sy0;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) { view = new Date(view.getFullYear(), view.getMonth() + (dx < 0 ? 1 : -1), 1); renderCal(); }
  sx0 = null;
}, { passive: true });
for (const type of ['gesturestart', 'gesturechange']) document.addEventListener(type, e => e.preventDefault(), { passive: false });

render();
sync();
// 앱으로 돌아올 때, 그리고 켜 둔 동안 1분마다 새 기록 확인
document.addEventListener('visibilitychange', () => { if (!document.hidden) { render(); sync(); } });
setInterval(() => { if (!document.hidden) sync(); }, 60000);

// 오프라인 + 새 버전 바로 적용 (다른 앱들과 같은 방식)
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloading) return;
    reloading = true;
    location.reload();
  });
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
  }).catch(() => {});
}
</script>
</body>
</html>
