      <div class="inline" style="margin-bottom:12px;flex-wrap:wrap"><button class="btn small" data-act="copykey">연결 키 복사</button><button class="btn small ghost" data-act="backup-save">백업 파일 저장</button><label class="btn small ghost" for="restore-file">백업 불러오기</label></div>
      <input type="file" id="restore-file" accept="application/json,.json" hidden>
      ${S.backupAt ? `<p class="sub" style="margin:0 0 12px;font-size:13px">마지막 백업: ${new Date(S.backupAt).toLocaleDateString('ko-KR')}</p>` : ''}
      <h2 style="margin-top:4px">다른 기기에서 같이 보기</h2>
      <p class="sub" style="margin:0 0 8px">위 연결 키를 다른 기기 앱에 넣으면 같은 기록을 봐요.</p>
      <div class="inline"><label class="fld">다른 연결 키 넣기<input id="newkey" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="32자리 키"></label><button class="btn small ghost" data-act="usekey">바꾸기</button></div>
      ${(S.prevKeys || []).length ? `<p class="sub" style="margin:10px 0 0;font-size:13px">바로 전 키 …${esc(S.prevKeys.at(-1).slice(-4))} · <button class="link" data-act="prevkey">그 키로 돌아가기</button></p>` : ''}
    </div>`;
}

// 화면을 그 칸까지 내림 (scrollIntoView 는 바깥 틀까지 움직일 수 있어서 창만 스크롤)
const scrollToEl = (el, gap = 0) => { if (el) scrollTo({ top: el.getBoundingClientRect().top + scrollY - gap, behavior: 'smooth' }); };

// ── 누르기 ──
document.addEventListener('click', async ev => {
  const t = ev.target.closest('button'); if (!t) return;
  if (t.dataset.tab) { S.tab = t.dataset.tab; stopEditing(); render(); scrollTo(0, 0); return; }
  if (S.tab === 'cyc' && cycClick(t)) return;
  if ((S.tab === 'gym' || /^rest-/.test(t.dataset.act || '') || t.dataset.delRoutine) && gymClickAny(t)) return;
  if (t.dataset.day) {
    sel = t.dataset.day; stopEditing(); save(); renderCal();
    if (sel === todayStr()) scrollTo({ top: 0, behavior: 'smooth' });
    else scrollToEl($('#day-detail'), 12);
    return;
  }
  if (t.dataset.pick) { S.drafts['mine-name'] = t.dataset.pick; save(); renderCal(); return; }
  const ds = t.dataset.date || sel;
  if (t.dataset.delMine) {
    const x = mineOf(ds).find(w => w.id === t.dataset.delMine);
    if (!x || !confirm(`'${x.name}' 운동을 지울까요?`)) return;
    const list = mineOf(ds).filter(w => w !== x);
    if (list.length) S.data.mine[ds] = list; else delete S.data.mine[ds];
    save(); renderCal();
    post({ mineDays: { [ds]: list } }).then(render).catch(failed);
    return;
  }
  if (t.dataset.metric) { S.chartKeys = [t.dataset.metric]; save(); renderIb(); return; }
  if (t.dataset.range) { S.chartRange = t.dataset.range; save(); renderIb(); return; }
  if (t.dataset.ck && !t.dataset.act) {
    const k = t.dataset.ck, cur = chartKeys();
    S.chartKeys = cur.includes(k) ? (cur.length > 1 ? cur.filter(x => x !== k) : cur) : CHART_KEYS.filter(x => cur.includes(x) || x === k);
    save(); renderIb(); return;
  }
  if (t.dataset.delIb) {
    const e = S.data.inbody.find(x => x.id === t.dataset.delIb);
    if (!e || !confirm(`${shortDate(e.date)} 인바디 기록을 지울까요?`)) return;
    S.data.inbody = S.data.inbody.filter(x => x !== e); save(); renderIb();
    saveSoon({ ibDel: [e.id] }); return;
  }
  const a = t.dataset.act;
  if (a === 'mine-open') { clearDrafts('mine-'); S.drafts['mine-open'] = ds; save(); renderCal(); setTimeout(() => scrollToEl($('#m-name'), innerHeight / 3), 50); }
  if (a === 'mine-cancel') { clearDrafts('mine-'); save(); renderCal(); }
  if (a === 'mine-save') {
    const name = $('#m-name').value.trim();
    if (!name) { toast('운동 이름을 적거나 골라 주세요'); return; }
    const min = parseInt($('#m-min').value.replace(/\D/g, ''), 10);
    const note = $('#m-note').value.trim();
    const kcal = parseInt($('#m-kcal').value.replace(/\D/g, ''), 10);
    if (!(min > 0) && !(kcal > 0) && !confirm('시간과 칼로리 없이 추가할까요?')) return;
    const item = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5), name };
    if (min > 0) item.min = min;
    if (kcal > 0) item.kcal = kcal;
    if (note) item.note = note;
    const list = [...mineOf(ds), item];
    S.data.mine = S.data.mine || {}; S.data.mine[ds] = list;
    clearDrafts('mine-'); save(); renderCal(); toast('추가했어요');
    post({ mineDays: { [ds]: list } }).then(render).catch(failed);
  }
  if (a === 'prev' || a === 'next') { view = new Date(view.getFullYear(), view.getMonth() + (a === 'next' ? 1 : -1), 1); renderCal(); }
  if (a === 'edit') { clearDrafts('day-'); S.drafts['day-edit'] = ds; save(); renderCal(); }
  if (a === 'cancel') { stopEditing(); renderCal(); }
  if (a === 'save-day' || a === 'del-day') {
    const val = id => { const v = $(id).value.replace(/\D/g, ''); return v === '' ? undefined : Number(v); };
    let value = null;
    if (a === 'save-day') {
      value = { ...(S.data.days[ds] || {}), min: val('#e-min'), steps: val('#e-steps') };
      delete value.at; delete value.manual;
      for (const k of Object.keys(value)) if (value[k] === undefined) delete value[k];
      if (!Object.keys(value).length) value = null;
    }
    if (value) S.data.days[ds] = value; else delete S.data.days[ds];
    stopEditing(); renderCal();
    post({ dayEdits: { [ds]: value } }).then(render).catch(failed);
  }
  if (a === 'add-ib') {
    const n = id => { const v = $(id).value.trim().replace(',', '.'); const x = parseFloat(v); return isFinite(x) ? r1(x) : null; };
    const date = $('#i-date').value || todayStr();
    const e = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), date, w: n('#i-w'), m: n('#i-m'), f: n('#i-f') };
    if (e.w == null && e.m == null && e.f == null) { toast('숫자를 하나 이상 적어 주세요'); return; }
    S.data.inbody.push(e); clearDrafts('ib-'); save(); renderIb(); toast('저장했어요');
    saveSoon({ ibAdd: [e] });
  }
  if (a === 'setup') { renderSettings(); $('#settings').showModal(); }
  if (a === 'close') $('#settings').close();
  if (a === 'copy') {
    try { await navigator.clipboard.writeText(pushUrl()); toast('주소를 복사했어요'); }
    catch { getSelection().selectAllChildren($('#url')); toast('주소를 길게 눌러 복사하세요'); }
  }
  if (a === 'height') {
    const v = prompt('키를 cm로 적어 주세요 (예: 165)', heightCm() || '');
    if (v == null) return;
    const h = parseFloat(String(v).replace(',', '.'));
    if (!(h > 80 && h < 250)) { toast('키를 cm로 적어 주세요'); return; }
    S.data.profile = { ...(S.data.profile || {}), height: Math.round(h * 10) / 10 };
    S.chartKeys = ['b']; save(); renderIb();
    saveSoon({ profile: S.data.profile });
  }
  if (a === 'ib-more') { ibShowAll = !ibShowAll; renderIb(); }
  if (a === 'goal') { const g = parseInt($('#goal').value, 10); if (g > 0 && g < 600) { S.goal = g; save(); render(); toast('저장했어요'); } }
  if (a === 'copykey') {
    try { await navigator.clipboard.writeText(S.key); S.keySaved = true; save(); toast('연결 키를 복사했어요. 메모 앱에 붙여 넣어 두세요'); render(); }
    catch { toast('키를 길게 눌러 복사하세요'); }
  }
  if (a === 'backup-save') {
    const name = `내건강-백업-${todayStr()}.json`;
    const blob = new Blob([JSON.stringify({ app: 'my-health', saved: new Date().toISOString(), key: S.key, data: S.data })], { type: 'application/json' });
    try {
      const file = new File([blob], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title: name });
      else { const l = document.createElement('a'); l.href = URL.createObjectURL(blob); l.download = name; l.click(); setTimeout(() => URL.revokeObjectURL(l.href), 5000); }
      S.backupAt = Date.now(); S.keySaved = true; save(); renderSettings(); render(); toast('백업 파일을 만들었어요');
    } catch (e) { if (!e || e.name !== 'AbortError') toast('백업을 만들지 못했어요'); }
  }
  if (a === 'usekey' || a === 'prevkey') {
    const k = a === 'prevkey' ? S.prevKeys.at(-1) : $('#newkey').value.trim();
    if (!/^[A-Za-z0-9]{24,64}$/.test(k)) { toast('키 모양이 맞지 않아요'); return; }
    if (k === S.key) { toast('지금 쓰는 키예요'); return; }
    if (!confirm(`이 기기의 기록 대신 그 키의 기록을 볼까요?${S.keySaved ? '' : '\n\n⚠️ 지금 키를 아직 저장하지 않았어요. 아래에 "바로 전 키"로 남겨 두지만, 먼저 "연결 키 복사"로 저장해 두는 게 안전해요.'}`)) return;
    if (!(await switchKey(k))) toast('아직 못 보낸 기록이 있어요. 인터넷 연결 후 다시 해 주세요');
  }
});
// 연결 키 바꾸기: 못 보낸 기록을 먼저 보내고, 이전 키는 S.prevKeys 에 남김 (잘못 넣어도 돌아갈 수 있게)
async function switchKey(k) {
  if (S.pending) { try { await post({}); } catch {} }
  await chain.catch(() => {});
  if (S.pending) return false;
  S.prevKeys = [...(S.prevKeys || []).filter(x => x !== S.key && x !== k), S.key].slice(-5);
  S.key = k; S.data = blank(); S.keySaved = false; lastSync = ''; save();
  $('#settings').close(); render(); await sync();
  return true;
}
// 백업 불러오기
document.addEventListener('change', async e => {
  if (e.target.id !== 'restore-file' || !e.target.files[0]) return;
  try {
    const b = JSON.parse(await e.target.files[0].text());
    if (!b || b.app !== 'my-health' || !b.data) throw new Error('bad');
    const n = (b.data.inbody || []).length, d = Object.keys(b.data.mine || {}).length, c = Object.values(b.data.cycle || {}).filter(x => x && x.f).length;
    if (!confirm(`${new Date(b.saved).toLocaleDateString('ko-KR')} 백업으로 되돌릴까요?\n(인바디 ${n}개, 운동 기록 ${d}일, 생리 기록 ${c}일)\n지금 기록은 이 백업으로 바뀌어요.`)) return;
    // 다른 키로 만든 백업(예: 예전 휴대폰): 단축어는 아직 그 키 주소로 보내고 있으니 그 키로 옮겨 감.
    // 그 키에 서버 기록이 남아 있으면 그게 백업보다 새것 → 그대로 불러옴. 비어 있으면 백업으로 채움
    if (KEY_OK(b.key) && b.key !== S.key && confirm('이 백업은 다른 연결 키로 만든 거예요. 아이폰 단축어가 그 키로 보내고 있을 수 있어요.\n그 키로 바꿀까요? (추천)')) {
      const r = await fetch(`${API}/d/${b.key}`, { cache: 'no-store', signal: tmo(15000) });
      if (!r.ok) throw new Error(r.status);
      const sv = await r.json(), has = Object.keys(sv.days || {}).length || (sv.inbody || []).length || Object.keys(sv.mine || {}).length || Object.keys(sv.cycle || {}).length;
      if (!(await switchKey(b.key))) { toast('아직 못 보낸 기록이 있어요. 인터넷 연결 후 다시 해 주세요'); return; }
      S.keySaved = true; save();
      if (has) { render(); toast('그 키의 기록을 불러왔어요'); return; }
    }
    S.data = blank(b.data); S.pending = null; save(); render();
    await post({ restore: b.data }); render(); toast('백업에서 되살렸어요');
  } catch { toast('백업 파일을 읽지 못했어요'); }
  finally { e.target.value = ''; }
});
for (const type of ['input', 'change']) document.addEventListener(type, e => {
  const k = e.target.dataset && e.target.dataset.draft;
  if (k) { S.drafts[k] = e.target.value; save(); }
});
$('#openSettings').addEventListener('click', () => { renderSettings(); $('#settings').showModal(); });
$('#settings').addEventListener('click', e => { if (e.target === $('#settings')) $('#settings').close(); });

// 달력을 옆으로 밀면 달 바꾸기
let sx0 = null, sy0 = null;
let swipeCyc = false;
document.addEventListener('touchstart', e => { const g = e.target.closest('#grid, #cgrid'); if (g) { sx0 = e.touches[0].clientX; sy0 = e.touches[0].clientY; swipeCyc = g.id === 'cgrid'; } else sx0 = null; }, { passive: true });
document.addEventListener('touchend', e => {
  if (sx0 == null) return;
  const dx = e.changedTouches[0].clientX - sx0, dy = e.changedTouches[0].clientY - sy0;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    if (swipeCyc) { cycView = new Date(cycView.getFullYear(), cycView.getMonth() + (dx < 0 ? 1 : -1), 1); renderCyc(); }
    else { view = new Date(view.getFullYear(), view.getMonth() + (dx < 0 ? 1 : -1), 1); renderCal(); }
  }
  sx0 = null;
}, { passive: true });
for (const type of ['gesturestart', 'gesturechange']) document.addEventListener(type, e => e.preventDefault(), { passive: false });

render();
sync();
// 앱으로 돌아올 때, 그리고 켜 둔 동안 1분마다 새 기록 확인
document.addEventListener('visibilitychange', () => { updateWakeLock(); if (!document.hidden) { if (!typing()) render(); sync(); } });
setInterval(() => { if (!document.hidden) sync(); }, 60000);

// 오프라인 + 새 버전 바로 적용 (다른 앱들과 같은 방식)
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloading) return;
    reloading = true;
    location.reload();
  });
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
  }).catch(() => {});
}
</script>
</body>
</html>
